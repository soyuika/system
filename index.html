<script>
"use strict";
/* =========================================================
   CONSTANTS
   ========================================================= */
const STORAGE_KEY = 'arise_system_v1';

const STAT_KEYS = ['intellect','stamina','agility','mental','awareness'];
const STAT_META = {
  intellect:{label:'INTELLECT', icon:'◈', desc:'Strategy, learning, creativity, problem-solving, pattern recognition, efficiency of thought.'},
  stamina  :{label:'STAMINA',   icon:'⬢', desc:'Endurance, cardio, deep work, sustained focus, muscle building, perseverance.'},
  agility  :{label:'AGILITY',   icon:'⚡', desc:'Mobility, reflexes, coordination, speed.'},
  mental   :{label:'MENTAL',    icon:'◆', desc:'Self-belief, focus on the goal, consistency, working with your nature instead of against it.'},
  awareness:{label:'AWARENESS', icon:'◎', desc:'Perception, intuition, self-reflection, spotting weaknesses, reading people, values alignment.'}
};

const RANKS = [
  {name:'E', min:0,    max:10,       color:'#8fa6c4'},
  {name:'D', min:11,   max:50,       color:'#5fd0ff'},
  {name:'C', min:51,   max:200,      color:'#4f8dff'},
  {name:'B', min:201,  max:500,      color:'#a06bff'},
  {name:'A', min:501,  max:1000,     color:'#ffb347'},
  {name:'S', min:1001, max:Infinity, color:'#ff4d6d'}
];
const POINTS_PER_LEVEL = 10;

const RANK_VAL = {E:1,D:2,C:3,B:4,A:5,S:6};
const DUNGEON_DAYS = {E:2,D:2,C:3,B:4,A:4,S:5};
const DUNGEON_OBJECTIVE_POINTS = 20;
const EDIT_TOKEN_CHANCE_IN_KEY_SLOT = 0.5; // inside the 20% "key" band, 50/50 key vs token
const DEV_PASSWORD = "I'm breaking the rules";
const MISSION_BOUNTY = {E:5, D:10, C:30, B:70, A:100, S:150};
const MISSION_MIN_DAYS = 14;

const DOMAIN_KEYS = ['mind','spirit','body','aesthetics'];
const DOMAIN_META = {
  mind:       { label:'MIND',       icon:'◈', color:'#4fd6ff', desc:'Cognition, knowledge, craft, learning.' },
  spirit:     { label:'SPIRIT',     icon:'◆', color:'#a06bff', desc:'Fortitude, calm, resilience, belief system.' },
  body:       { label:'BODY',       icon:'⬢', color:'#38ffb0', desc:'Health, fitness, physical ability.' },
  aesthetics: { label:'AESTHETICS', icon:'◎', color:'#ffcf5c', desc:'Appearance, home, immediate environment.' }
};
const ARC_TOTAL_DAYS = 28;

/* =========================================================
   UTILS
   ========================================================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function localDateStr(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartStr(d = new Date()){
  const x = new Date(d);
  const dow = (x.getDay() + 6) % 7; // Monday = 0
  x.setDate(x.getDate() - dow);
  return localDateStr(x);
}
function fmtDuration(ms){
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return d > 0 ? `${d}d ${p(h)}:${p(m)}:${p(ss)}` : `${p(h)}:${p(m)}:${p(ss)}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* =========================================================
   STATE
   ========================================================= */
function defaultState(){
  return {
    version: 1,
    createdAt: new Date().toISOString(),
        playerName: 'HUNTER',
    oathTaken: false,
    devMode: false,
    stats: {intellect:0, stamina:0, agility:0, mental:0, awareness:0},
    unassigned: 0,
    systemTokens: 0,
                                quests: STAT_KEYS.map(k => ({
      id: uid(), stat: k, name: '', floor: '', ceiling: '', phase: 1,
      ceilingSteps: [],
      origin: new Date().toISOString(),
      history: []
    })),
        lifestyle: [],
            today: {date: localDateStr(), floor:{}, ceil:{}, lifestyle:{}, ceilPaid:{}, ceilSteps:{}, floorPointGiven:false, rewardGiven:false, rewardText:null},
    log: {},
        weekFails: {},
    weekStart: weekStartStr(),
    lastWeeklyPrompt: null,
        weeklyApplied: null,
        arc: null,
    arcHistory: [],
    arcExpiryNotified: false,
    pendingPenalty: null,
    penalties: [
      {id:uid(), tier:1, text:'No screens for the first 60 minutes after waking.'},
      {id:uid(), tier:1, text:'10-minute cold shower, or 20 push-ups + 20 squats.'},
      {id:uid(), tier:2, text:'45 minutes of focused work on your hardest task — no music, no phone.'},
      {id:uid(), tier:2, text:'Zero social media / YouTube for the entire day.'},
      {id:uid(), tier:3, text:'Full digital detox for 24 hours.'},
      {id:uid(), tier:3, text:'Wake at 05:00 and complete a 5 km run before sunrise.'}
    ],
    rewards: [
      {id:uid(), text:'One episode of the anime you are currently watching.'},
      {id:uid(), text:'A treat you genuinely enjoy (good coffee, snack, bath, etc.).'}
    ],
        titles: [],
    equippedTitle: null,
        keys: [],
    skips: 0,
    editTokens: 0,
                dungeons: {inbox:[], active:null, locked:{}, cleared:[]},
        missions: {active:null, backlog:[], history:[]},
        ui: {
      expandedStats: [],
      expandedQuests: [],
      expandedMilestones: [],
      collapsedEncounters: [],
      encountersSectionOpen: true,
      missionCollapsed: false,
      criteriaSectionOpen: true,
      milestonesSectionOpen: true,
      missionFormCollapsed: false
    }
  };
}

let state = defaultState();
let activeTab = 'status';
const expandedStats = new Set();  // which stat descriptions are expanded this session
const expandedQuests = new Set();  // which quest cards are expanded this session
const expandedMilestones = new Set();  // which mission milestones are expanded this session
const editingEncounters = new Set();   // which encounter pairs are in edit mode this session
let encountersSectionOpen = true;      // whether the encounters section is expanded
let missionCollapsed = false;          // whether the active mission panel is collapsed
const collapsedEncounters = new Set(); // which encounter pairs are collapsed
let criteriaSectionOpen = true;        // whether the success criteria section is expanded
let milestonesSectionOpen = true;      // whether the milestones section is expanded
let missionFormCollapsed = false;      // whether the New Mission Briefing panel is collapsed
let saveTimer = null, saveDirty = false;

function save(){
  saveDirty = true;
  if (saveTimer) return;
  saveTimer = setTimeout(flushSave, 400);
}

function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!saveDirty) return;
  saveDirty = false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

/* Persist / restore UI collapse state across reloads. */
function syncUI(){
  state.ui = {
    expandedStats: [...expandedStats],
    expandedQuests: [...expandedQuests],
    expandedMilestones: [...expandedMilestones],
    collapsedEncounters: [...collapsedEncounters],
    encountersSectionOpen,
    missionCollapsed,
    criteriaSectionOpen,
    milestonesSectionOpen,
    missionFormCollapsed
  };
  save();
}

function hydrateUI(){
  const ui = (state && state.ui) || {};
  const arr = v => Array.isArray(v) ? v : [];
  expandedStats.clear();
  arr(ui.expandedStats).forEach(x => expandedStats.add(x));
  expandedQuests.clear();
  arr(ui.expandedQuests).forEach(x => expandedQuests.add(x));
  expandedMilestones.clear();
  arr(ui.expandedMilestones).forEach(x => expandedMilestones.add(x));
  collapsedEncounters.clear();
  arr(ui.collapsedEncounters).forEach(x => collapsedEncounters.add(x));
  encountersSectionOpen = ui.encountersSectionOpen !== false;
  missionCollapsed      = !!ui.missionCollapsed;
  criteriaSectionOpen   = ui.criteriaSectionOpen !== false;
  milestonesSectionOpen = ui.milestonesSectionOpen !== false;
  missionFormCollapsed  = !!ui.missionFormCollapsed;
}

function migrate(raw){
  const d = defaultState();
  const s = Object.assign({}, d, raw || {});
  s.stats = Object.assign({}, d.stats, (raw && raw.stats) || {});
    s.today = Object.assign({}, d.today, (raw && raw.today) || {});
    s.today.lifestyle = (raw && raw.today && raw.today.lifestyle) || {};
  // Ensure per-ceiling tracking exists. On first load after this update, mark
  // any already-ticked ceilings as paid so they aren't re-awarded retroactively.
      const hasCeilPaidField = raw && raw.today && typeof raw.today.ceilPaid === 'object';
  s.today.ceilPaid = (raw && raw.today && raw.today.ceilPaid) || {};
  if (!hasCeilPaidField && s.today.ceil){
    // One-time migration from the pre-ceilPaid schema: mark today's existing
    // ceiling ticks as already paid so they aren't retroactively awarded.
    Object.keys(s.today.ceil).forEach(id => {
      if (s.today.ceil[id]) s.today.ceilPaid[id] = true;
    });
  }
  s.today.ceilSteps = (raw && raw.today && raw.today.ceilSteps) || {};
  s.lifestyle = (raw && raw.lifestyle) || [];
    s.dungeons = Object.assign({}, d.dungeons, (raw && raw.dungeons) || {});
  s.dungeons.locked = (raw && raw.dungeons && raw.dungeons.locked) || {};
  s.dungeons.cleared = (raw && raw.dungeons && raw.dungeons.cleared) || [];
  s.dungeons.inbox = (raw && raw.dungeons && raw.dungeons.inbox) || [];
    if (s.dungeons.active && Array.isArray(s.dungeons.active.tasks)){
    s.dungeons.active.tasks.forEach(t => {
      if (typeof t.paid !== 'boolean') t.paid = !!t.done;
    });
    if (!s.dungeons.active.domain) s.dungeons.active.domain = 'mind';
  }
  s.dungeons.inbox.forEach(x => { if (!x.domain) x.domain = 'mind'; });
  s.dungeons.cleared.forEach(x => { if (!x.domain) x.domain = 'mind'; });
      s.titles = (raw && raw.titles) || [];
  s.titles.forEach(t => {
    if (typeof t.awardedAt === 'undefined' || (t.awardedAt === null && raw && !raw.__titlesAwardedSupported)){
      // Old saves had no notion of "stored" — everything in the list was awarded.
      // Use createdAt as a conservative backfill.
      t.awardedAt = s.createdAt || new Date().toISOString();
    }
  });
  if (typeof s.equippedTitle !== 'string') s.equippedTitle = null;
  if (s.equippedTitle && !s.titles.some(t => t.id === s.equippedTitle && t.awardedAt)) s.equippedTitle = null;
    s.keys = (raw && raw.keys) || [];
    if (typeof s.editTokens !== 'number') s.editTokens = 0;
    if (typeof s.devMode !== 'boolean') s.devMode = false;
        s.missions = Object.assign({active: null, backlog: [], history: []}, (raw && raw.missions) || {});
  if (!Array.isArray(s.missions.history)) s.missions.history = [];
  if (!Array.isArray(s.missions.backlog)) s.missions.backlog = [];

  // Mission schema evolution: convert legacy encounter/plan strings to pairs,
  // ensure milestones array exists and its shape is correct.
    const migrateMissionShape = (m) => {
    if (!m) return;
    if (!m.domain) m.domain = 'mind';
    if (!Array.isArray(m.encounterPairs)){
      const pairs = [];
      if (m.encounter || m.plan){
        pairs.push({ id: uid(), encounter: m.encounter || '', plan: m.plan || '' });
      }
      m.encounterPairs = pairs;
    }
    delete m.encounter;
    delete m.plan;
            m.encounterPairs.forEach(p => {
      if (!p.id) p.id = uid();
      if (typeof p.happened !== 'boolean') p.happened = false;
      if (typeof p.outcome === 'undefined') p.outcome = null;
      if (!p.fieldNotes || typeof p.fieldNotes !== 'object'){
        p.fieldNotes = { worked: '', failed: '', change: '' };
      } else {
        ['worked','failed','change'].forEach(k => {
          if (typeof p.fieldNotes[k] !== 'string') p.fieldNotes[k] = '';
        });
      }
      if (!p.createdAt) p.createdAt = m.startedAt || new Date().toISOString();
      if (!p.editedAt) p.editedAt = p.createdAt;
      if (p.happened && !p.happenedAt) p.happenedAt = p.editedAt;
      if (!p.happened && p.happenedAt) delete p.happenedAt;
    });
    if (!Array.isArray(m.milestones)) m.milestones = [];
    m.milestones.forEach(ms => {
      if (!ms.id) ms.id = uid();
      if (typeof ms.done !== 'boolean') ms.done = false;
      if (!Array.isArray(ms.steps)) ms.steps = [];
      ms.steps.forEach(st => {
        if (!st.id) st.id = uid();
        if (typeof st.done !== 'boolean') st.done = false;
      });
    });
  };

  if (s.missions.active) migrateMissionShape(s.missions.active);
  s.missions.backlog.forEach(migrateMissionShape);
  s.missions.history.forEach(migrateMissionShape);
  s.log = (raw && raw.log) || {};
    s.weekFails = (raw && raw.weekFails) || {};
    if (typeof s.weeklyApplied !== 'string') s.weeklyApplied = null;
    if (!s.arc || typeof s.arc !== 'object') s.arc = null;
  if (s.arc && (!s.arc.domain || !DOMAIN_META[s.arc.domain])) s.arc = null;
  if (s.arc && typeof s.arc.startedAt !== 'string') s.arc = null;
  if (!Array.isArray(s.arcHistory)) s.arcHistory = [];
  s.arcHistory = s.arcHistory.map(a => {
    if (typeof a === 'string') return { domain: a, startedAt: null, endedAt: null };
    if (!a || !DOMAIN_META[a.domain]) return null;
    return { domain: a.domain, startedAt: a.startedAt || null, endedAt: a.endedAt || null };
  }).filter(Boolean);
  if (typeof s.arcExpiryNotified !== 'boolean') s.arcExpiryNotified = false;
  s.penalties = (raw && raw.penalties) || d.penalties;
  s.rewards = (raw && raw.rewards) || d.rewards;
  if (!Array.isArray(s.quests) || s.quests.length !== 5){
    s.quests = d.quests;
  }
                        s.quests.forEach(q => {
    if (typeof q.phase !== 'number') q.phase = 1;
    if (!Array.isArray(q.history)) q.history = [];
    if (!Array.isArray(q.ceilingSteps)) q.ceilingSteps = [];
    if (typeof q.ceilingRepeatable !== 'boolean') q.ceilingRepeatable = false;
    q.ceilingSteps.forEach(st => {
      if (typeof st.repeatable !== 'boolean') st.repeatable = false;
    });
        if (!q.origin) q.origin = s.createdAt || new Date().toISOString();
    delete q.mult;
  });
  if (!s.ui || typeof s.ui !== 'object') s.ui = {};
  s.ui = Object.assign({
    expandedStats: [],
    expandedQuests: [],
    expandedMilestones: [],
    collapsedEncounters: [],
    encountersSectionOpen: true,
    missionCollapsed: false,
    criteriaSectionOpen: true,
    milestonesSectionOpen: true,
    missionFormCollapsed: false
  }, s.ui);
  return s;
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return migrate(JSON.parse(raw));
  } catch(e){ console.error('load failed', e); return null; }
}

/* =========================================================
   DERIVED VALUES
   ========================================================= */
function getLevel(){
  return Math.floor(Math.min(...STAT_KEYS.map(k => state.stats[k])) / POINTS_PER_LEVEL);
}
function rankForLevel(lv){
  return RANKS.find(r => lv >= r.min && lv <= r.max) || RANKS[RANKS.length-1];
}
function nextRankOf(lv){
  const idx = RANKS.findIndex(r => lv >= r.min && lv <= r.max);
  return idx >= 0 && idx < RANKS.length-1 ? RANKS[idx+1] : null;
}
function nextLevelBarrier(){
  return (getLevel() + 1) * POINTS_PER_LEVEL;
}
function getSystemLevel(){
  return 1 + state.systemTokens;
}
function getDayNumber(){
  const start = new Date(state.createdAt);
  start.setHours(0,0,0,0);
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.floor((today - start) / 86400000) + 1;
}
function hasFullWeekOfData(){
  const [y,m,d] = state.weekStart.split('-').map(Number);
  const weekStartDate = new Date(y, m-1, d, 0, 0, 0, 0);
  const created = new Date(state.createdAt);
  created.setHours(0,0,0,0);
  return created <= weekStartDate;
}
function isWeeklyWindow(){
  const now = new Date();
  return now.getDay() === 0 && now.getHours() >= 19;
}
function canEditNow(){
  return state.devMode || isWeeklyWindow() || state.editTokens > 0;
}
function consumeEditToken(){
  if (state.devMode) return true;
  if (isWeeklyWindow()) return true;
  if (state.editTokens <= 0) return false;
  if (!confirm(`Use 1 instant edit token for this change?\n\nYou have ${state.editTokens} remaining.`)) return false;
  state.editTokens -= 1;
  return true;
}
function lowestStat(){
  let k = STAT_KEYS[0];
  STAT_KEYS.forEach(s => { if (state.stats[s] < state.stats[k]) k = s; });
  return k;
}

function getArcInfo(){
  if (!state.arc || !state.arc.domain || !state.arc.startedAt){
    return { active:false, expired:false, domain:null, phase:null, daysElapsed:0, daysRemaining:0 };
  }
  const start = new Date(state.arc.startedAt);
  start.setHours(0,0,0,0);
  const today = new Date();
  today.setHours(0,0,0,0);
  const daysElapsed = Math.floor((today - start) / 86400000);

  let phase = null, daysRemaining = 0;
  if (daysElapsed < 0){ phase = 'DEVELOPMENT'; daysRemaining = 7; }
  else if (daysElapsed < 7){ phase = 'DEVELOPMENT'; daysRemaining = 7 - daysElapsed; }
  else if (daysElapsed < 21){ phase = 'COMPOUNDING'; daysRemaining = 21 - daysElapsed; }
  else if (daysElapsed < 28){ phase = 'ANALYSIS'; daysRemaining = 28 - daysElapsed; }
  else { phase = 'EXPIRED'; daysRemaining = 0; }

    return {
    active: phase !== 'EXPIRED',
    expired: phase === 'EXPIRED',
    domain: state.arc.domain,
    phase,
    daysElapsed: Math.max(0, daysElapsed),
    daysRemaining
  };
}

function getDomainMultiplier(itemDomain){
  if (!state.arc || !state.arc.domain || !itemDomain) return 1;
  return itemDomain === state.arc.domain ? 1.10 : 0.90;
}

function isArcDomainBlocked(domain){
  if (state.devMode) return false;
  const sequence = [
    ...(state.arcHistory || []).map(a => a.domain),
    state.arc && state.arc.domain
  ].filter(Boolean);
  if (sequence.length < 3) return false;
  const last3 = sequence.slice(-3);
  return last3.every(d => d === domain);
}

function getBlockedArcDomain(){
  return DOMAIN_KEYS.find(k => isArcDomainBlocked(k)) || null;
}

function domainBadgeHTML(domain, multiplier){
  if (!domain || !DOMAIN_META[domain]) return '';
  const dm = DOMAIN_META[domain];
  let multTag = '';
  if (typeof multiplier === 'number' && multiplier !== 1){
    const pct = Math.round((multiplier - 1) * 100);
    const cls = pct > 0 ? 'plus' : 'minus';
    multTag = `<span class="domain-badge-mult ${cls}">${pct > 0 ? '+' : ''}${pct}%</span>`;
  }
  return `<span class="domain-badge" style="color:${dm.color}">${dm.icon} ${dm.label}</span>${multTag}`;
}

/* =========================================================
   TITLES
   ========================================================= */
function addTitle(name, desc, hours){
  state.titles = state.titles.filter(t => t.name !== name);
  state.titles.push({
    id: uid(), name, desc, custom:false,
    awardedAt: new Date().toISOString(),
    expiresAt: hours ? new Date(Date.now() + hours*3600*1000).toISOString() : null
  });
}
function pruneTitles(){
  const now = Date.now();
  const before = state.titles.length;
  state.titles = state.titles.filter(t => !t.expiresAt || new Date(t.expiresAt).getTime() > now);
  const changed = state.titles.length !== before;
  if (changed && state.equippedTitle && !state.titles.some(t => t.id === state.equippedTitle)){
    state.equippedTitle = null;
  }
  return changed;
}

/* =========================================================
   GAME LOGIC — points, rewards, penalties
   ========================================================= */
function toast(msg, kind){
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => { d.style.transition='opacity .4s'; d.style.opacity='0'; setTimeout(()=>d.remove(), 420); }, 3800);
}

function checkDailyAwards(){
  if (state.devMode) return;
  const t = state.today;
  if (!t.ceilPaid) t.ceilPaid = {};

  const total = state.quests.length;
  const allFloor = state.quests.every(q => t.floor[q.id]);

  // Floors: +1 to every stat when all five are done. Reversible.
  if (allFloor && !t.floorPointGiven){
    t.floorPointGiven = true;
    STAT_KEYS.forEach(k => { state.stats[k] += 1; });
    toast('+1 TO EVERY STAT — ALL FLOORS CLEARED', 'gold');
  } else if (!allFloor && t.floorPointGiven){
    t.floorPointGiven = false;
    STAT_KEYS.forEach(k => { state.stats[k] = Math.max(0, state.stats[k] - 1); });
    toast('−1 FROM EVERY STAT — FLOOR BONUS REVOKED', 'bad');
  }

  // Ceilings: awarded only while all floors are done.
  // Ticked early → suspended until floors finish.
  const awarded = [];
  const revoked = [];

  state.quests.forEach(q => {
    const ceilOn = !!t.ceil[q.id];
    const wasPaid = !!t.ceilPaid[q.id];
    const shouldPay = ceilOn && allFloor;

    if (shouldPay && !wasPaid){
      t.ceilPaid[q.id] = true;
      state.stats[q.stat] += 1;
      awarded.push(q.stat);
    } else if (!shouldPay && wasPaid){
      delete t.ceilPaid[q.id];
      state.stats[q.stat] = Math.max(0, state.stats[q.stat] - 1);
      revoked.push(q.stat);
    }
  });

  if (awarded.length === 1){
    toast(`+1 ${STAT_META[awarded[0]].label} — CEILING CLEARED`, 'gold');
  } else if (awarded.length > 1){
    toast(`+${awarded.length} CEILING POINTS — SUSPENDED AWARDS RELEASED`, 'gold');
  }
  if (revoked.length === 1){
    toast(`−1 ${STAT_META[revoked[0]].label} — CEILING REVOKED`, 'bad');
  } else if (revoked.length > 1){
    toast(`−${revoked.length} CEILING POINTS — SUSPENDED`, 'bad');
  }
}

function rollReward(boostFactor = 0){
  const w = {
    custom:     50,
    keyED:      20,
    skip:       15,
    pointKeyCB: 10,
    keyAS:       4,
    token:       1
  };

  // If no custom rewards are defined, redistribute that slot proportionally.
  if (!state.rewards.length){
    const released = w.custom;
    w.custom = 0;
    const sum = w.keyED + w.skip + w.pointKeyCB + w.keyAS + w.token;
    for (const k of ['keyED','skip','pointKeyCB','keyAS','token']){
      w[k] += released * (w[k] / sum);
    }
  }

  // Lifestyle boost: shift weight from common → rare, scaled by boostFactor (0..1).
  if (boostFactor > 0){
    const diminish = 1 - 0.35 * boostFactor;
    let released = 0;
    for (const k of ['custom','keyED','skip']){
      const before = w[k];
      w[k] = w[k] * diminish;
      released += before - w[k];
    }
    const rareSum = w.pointKeyCB + w.keyAS + w.token;
    if (rareSum > 0){
      for (const k of ['pointKeyCB','keyAS','token']){
        w[k] += released * (w[k] / rareSum);
      }
    } else {
      for (const k of ['pointKeyCB','keyAS','token']) w[k] += released / 3;
    }
  }

  const total = Object.values(w).reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (const [key, weight] of Object.entries(w)){
    if (r < weight){
      switch(key){
        case 'custom':     return {type:'custom',    text: pick(state.rewards).text};
                case 'keyED':      return Math.random() < EDIT_TOKEN_CHANCE_IN_KEY_SLOT
                                    ? {type:'key',       tier:'ED'}
                                    : {type:'editToken'};
        case 'skip':       return {type:'skip'};
        case 'pointKeyCB': return {type:'point_key', tier:'CB'};
        case 'keyAS':      return {type:'key',       tier:'AS'};
        case 'token':      return {type:'token'};
      }
    }
    r -= weight;
  }
  return {type:'token'};
}

function makeKey(tier){
  const table = {ED:['E','D'], CB:['C','B'], AS:['A','S']};
  const rank = pick(table[tier]);
  return {id: uid(), rank};
}

function claimReward(){
  const t = state.today;
  if (t.rewardGiven) return;
  if (!state.quests.every(q => t.ceil[q.id])) return;
  if (state.devMode){
    t.rewardGiven = true;
    t.rewardText = 'DEV MODE — reward not applied.';
    save(); render();
    return;
  }

    const lifestyleDone = Object.keys(state.today.lifestyle || {}).filter(id => state.today.lifestyle[id]).length;
  const lifestyleTotal = state.lifestyle.length;
  const boostFactor = lifestyleTotal > 0 ? lifestyleDone / lifestyleTotal : 0;
  const res = rollReward(boostFactor);
  let text = '';

  if (res.type === 'custom'){
    text = res.text;
  } else if (res.type === 'key'){
    const k = makeKey(res.tier);
    state.keys.push(k);
    text = `DUNGEON KEY [${k.rank}-RANK] acquired.`;
    } else if (res.type === 'skip'){
    state.skips += 1;
    text = 'PENALTY SKIP — tomorrow\'s penalty will be voided.';
  } else if (res.type === 'editToken'){
    state.editTokens += 1;
    text = 'INSTANT EDIT TOKEN — one unrestricted System edit, usable any time.';
  } else if (res.type === 'point_key'){
    const k = makeKey(res.tier);
    state.keys.push(k);
    state.unassigned += 1;
    text = `+1 STAT POINT and DUNGEON KEY [${k.rank}-RANK].`;
  } else {
    state.systemTokens += 1;
    text = 'SYSTEM UPGRADE TOKEN — account level +1.';
  }

  t.rewardGiven = true;
  t.rewardText = text;
  save(); render();
  openModal(`
    <h2>Reward Acquired</h2>
    <div style="font-size:15px;line-height:1.9;color:#eaf6ff;text-align:center;padding:10px 0 20px">${esc(text)}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="close-modal">Acknowledge</button></div>
  `);
}

/* =========================================================
   ROLLOVER / TICK
   ========================================================= */
function issuePenalty(failedCount, forDate, lifestyleDone = 0, lifestyleTotal = 0){
  if (state.devMode) return;
  let tier = failedCount === 1 ? 1 : (failedCount <= 3 ? 2 : 3);
  const ratio = lifestyleTotal > 0 ? lifestyleDone / lifestyleTotal : 0;

  // Full escape: 1 missed quest + ALL lifestyle upgrades done → 1% chance to skip entirely.
  if (tier === 1 && lifestyleTotal > 0 && lifestyleDone === lifestyleTotal){
    if (Math.random() < 0.01){
      toast('LIFESTYLE BONUS — penalty escaped entirely.', 'gold');
      return;
    }
  }

  // Tier reduction: base tier 2 or 3, scaled by lifestyle ratio.
  if (tier > 1 && lifestyleTotal > 0 && lifestyleDone > 0){
    const dropChance = ratio * 0.6;
    if (Math.random() < dropChance){
      tier -= 1;
      if (tier === 2 && Math.random() < dropChance * 0.4){
        tier -= 1;
      }
      toast(`LIFESTYLE BONUS — penalty tier reduced to ${tier}.`, 'gold');
    }
  }

  if (state.skips > 0){
    state.skips -= 1;
    toast('Penalty skipped (consumed skip).', 'gold');
    return;
  }

  const pool = state.penalties.filter(p => p.tier === tier);
  const chosen = pool.length ? pick(pool) : null;

  let dl = new Date(); dl.setHours(12,0,0,0);
  if (dl.getTime() < Date.now()) dl = new Date(Date.now() + 6*3600*1000);

  state.pendingPenalty = {
    date: forDate,
    tier,
    penaltyId: chosen ? chosen.id : null,
    text: chosen ? chosen.text : `Tier ${tier} penalty — you have none defined. Add them in the System tab.`,
    deadline: dl.toISOString(),
    done: false
  };
  toast(`PENALTY ISSUED — TIER ${tier}`, 'bad');
}

function applyFraud(){
  const lv = getLevel();
  const barrier = lv * POINTS_PER_LEVEL;
  STAT_KEYS.forEach(k => { state.stats[k] = barrier; });
  state.unassigned = 0;
  addTitle('Fraud', 'You did not complete your penalty in time.', 24);
  state.pendingPenalty = null;
  toast('FRAUD — all progress within your level annulled. Title: FRAUD (24h)', 'bad');
}

function rollover(){
  const nowStr = localDateStr();
  const prev = state.today;
  const total = state.quests.length;

  let done = 0;
  state.quests.forEach(q => { if (prev.floor[q.id]) done++; });
  const failed = total - done;

  const prevLife = prev.lifestyle || {};
  const lifeDone = Object.keys(prevLife).filter(id => prevLife[id]).length;
  const lifeTotal = state.lifestyle.length;

  if (prev.date){
    state.log[prev.date] = {done, failed};
    const keys = Object.keys(state.log).sort();
    while (keys.length > 400) delete state.log[keys.shift()];
        if (!state.devMode){
      state.quests.forEach(q => {
        if (!prev.floor[q.id]) state.weekFails[q.id] = (state.weekFails[q.id] || 0) + 1;
      });
    }
  }

  if (prev.date && failed > 0) issuePenalty(failed, prev.date, lifeDone, lifeTotal);

      state.today = {
    date: nowStr, floor:{}, ceil:{}, lifestyle:{}, ceilPaid:{}, ceilSteps:{},
    floorPointGiven:false, rewardGiven:false, rewardText:null
  };
}

function checkDungeonTimeout(){
  const a = state.dungeons.active;
  if (!a) return false;
  if (Date.now() > new Date(a.deadline).getTime()){
    const lockMs = (7 + Math.random()*175) * 86400000; // 7 days .. ~6 months
    state.dungeons.locked[a.id] = {
      until: new Date(Date.now() + lockMs).toISOString(),
      everFailed: true
    };
    state.dungeons.active = null;
    toast('SYSTEM ERROR: MENTAL BARRIER — dungeon sealed.', 'bad');
    return true;
  }
  return false;
}

function checkMissionDeadline(){
  const m = state.missions && state.missions.active;
  if (!m) return false;
  if (Date.now() < new Date(m.deadline).getTime()) return false;
  resolveMissionDeadline();
  return true;
}

function resolveMissionDeadline(){
  const m = state.missions.active;
  if (!m) return;
  const done = m.criteria.filter(c => c.done).length;
  const missing = m.criteria.length - done;

  if (missing === 0){
    if (state.devMode){
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: 0});
      toast('DEV MODE — mission complete, no points awarded.');
        } else {
      const mult = getDomainMultiplier(m.domain);
      const paid = Math.round(m.bounty * mult);
      state.unassigned += paid;
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: paid});
      const multNote = mult !== 1 ? ` (arc ${mult > 1 ? '+' : ''}${Math.round((mult-1)*100)}%)` : '';
      toast(`MISSION COMPLETE — +${paid} points${multNote}`, 'gold');
    }
  } else {
    const fine = Math.round(m.bounty * missing / m.criteria.length);
    if (state.devMode){
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'failed', delta: 0, missing});
      toast('DEV MODE — mission failed, no fine applied.');
    } else {
      applyMissionFine(fine);
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'failed', delta: -fine, missing});
      toast(`MISSION FAILED — ${missing} criteria missing · −${fine} points`, 'bad');
    }
  }
  state.missions.active = null;
  if (state.missions.history.length > 100) state.missions.history.length = 100;
}

function applyMissionFine(fine){
  let remaining = fine;
  const fromPool = Math.min(state.unassigned, remaining);
  state.unassigned -= fromPool;
  remaining -= fromPool;
  while (remaining > 0){
    const sorted = [...STAT_KEYS].sort((a,b) => state.stats[b] - state.stats[a]);
    let deducted = false;
    for (const k of sorted){
      if (state.stats[k] > 0 && remaining > 0){
        state.stats[k] -= 1;
        remaining -= 1;
        deducted = true;
      }
    }
    if (!deducted) break;
  }
}
  
function checkWeeklyWindow(){
  const now = new Date();
  if (now.getDay() === 0 && now.getHours() >= 19){
    const ws = weekStartStr();
    if (state.lastWeeklyPrompt !== ws && state.weeklyApplied !== ws){
      state.lastWeeklyPrompt = ws;
      save();
      if (hasFullWeekOfData()){
        openWeeklyReview();
      } else {
        toast('FIRST WEEK — no reset. Full week of data required.', 'gold');
      }
    }
  }
}

function tick(){
  let dirty = false;

  // 1. title expiry
  if (pruneTitles()) dirty = true;

  // 2. fraud check (before rollover, so the pending penalty belongs to the right day)
  if (state.pendingPenalty && !state.pendingPenalty.done){
    if (Date.now() > new Date(state.pendingPenalty.deadline).getTime()){
      applyFraud();
      dirty = true;
    }
  }

    // 3. dungeon timeout
  if (checkDungeonTimeout()) dirty = true;

    // 3b. mission deadline
  if (checkMissionDeadline()) dirty = true;

  // 3c. arc expiry notification
  const arcInfo = getArcInfo();
  if (arcInfo.expired && !state.arcExpiryNotified){
    state.arcExpiryNotified = true;
    toast('ARC COMPLETE — set your next focus.', 'gold');
    dirty = true;
  }

  // 4. day rollover
  if (state.today.date !== localDateStr()){
    rollover();
    dirty = true;
  }

  // 5. week rollover
  const ws = weekStartStr();
  if (state.weekStart !== ws){
    state.weekStart = ws;
    state.weekFails = {};
    dirty = true;
  }

  if (dirty){ save(); render(); }
  checkWeeklyWindow();
}

/* =========================================================
   WEEKLY REVIEW
   ========================================================= */
function weeklySuggestion(fails){
  if (fails === 0) return {label:'INCREASE DIFFICULTY', delta:1,  cls:'gold'};
  if (fails >= 5)  return {label:'DECREASE DIFFICULTY', delta:-1, cls:'ghost'};
  return {label:'HOLD', delta:0, cls:'ghost'};
}

function openWeeklyReview(){
  const rows = state.quests.map(q => {
    const fails = state.weekFails[q.id] || 0;
    const s = weeklySuggestion(fails);
    return `
      <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="row" style="justify-content:space-between">
          <div>
            <div style="font-size:10px;letter-spacing:.2em;color:var(--cyan)">${STAT_META[q.stat].label}</div>
            <div style="font-size:13px;font-weight:600">${esc(q.name || '— unnamed —')}</div>
          </div>
          <div style="text-align:right">
            <div class="meta">FAILED ${fails}× THIS WEEK</div>
                        <div class="meta" style="color:${s.delta>0?'var(--gold)':s.delta<0?'var(--danger)':'var(--dim)'}">${s.label}</div>
          </div>
        </div>
        <input data-wk-floor="${q.id}" value="${esc(q.floor)}" placeholder="new floor text (optional)">
                <label class="row" style="font-size:11px;color:var(--dim);gap:6px">
          <input type="checkbox" data-wk-apply="${q.id}" style="width:auto" ${s.delta !== 0 ? 'checked' : 'disabled'}>
          ${s.delta > 0 ? 'shift phase +1' : s.delta < 0 ? 'shift phase −1' : 'no phase change'} (current: PHASE ${q.phase ?? 1})
        </label>
      </div>`;
  }).join('');

  openModal(`
    <h2>Weekly System Reset</h2>
    <p style="font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:14px">
            Sunday 19:00–24:00. Review your quests. 0 failures → difficulty increases (phase +1).
      1–4 failures → hold. 5+ failures → difficulty decreases (phase −1). Adjust ceilings freely.
    </p>
        ${rows}
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" data-act="close-modal">Later</button>
      <button class="btn" data-act="apply-weekly">Confirm Reset</button>
    </div>
  `);
}

function applyWeekly(){
  const ws = weekStartStr();
  if (!state.devMode && !isWeeklyWindow()){
    toast('Weekly reset only available Sunday 19:00–24:00.', 'bad');
    closeModal(); render();
    return;
  }
  if (!state.devMode && state.weeklyApplied === ws){
    toast('Weekly reset already applied this week.', 'bad');
    closeModal(); render();
    return;
  }
  state.quests.forEach(q => {
    const inp = document.querySelector(`[data-wk-floor="${q.id}"]`);
    if (inp && inp.value.trim()) q.floor = inp.value.trim();
        const chk = document.querySelector(`[data-wk-apply="${q.id}"]`);
    if (chk && chk.checked){
      const fails = state.weekFails[q.id] || 0;
      const s = weeklySuggestion(fails);
      if (s.delta !== 0){
        q.phase = (q.phase ?? 1) + s.delta;
      }
    }
  });
  state.weekFails = {};
  state.lastWeeklyPrompt = ws;
  state.weeklyApplied = ws;
  save(); closeModal(); render();
  toast('WEEKLY RESET COMPLETE');
}

/* =========================================================
   DUNGEONS
   ========================================================= */
function openDungeon(id){
  const d = state.dungeons.inbox.find(x => x.id === id);
  if (!d) return;
  if (state.dungeons.active) return toast('You are already inside a dungeon.', 'bad');

  const lock = state.dungeons.locked[id];
  if (lock && Date.now() < new Date(lock.until).getTime()){
    return toast(`SYSTEM ERROR: MENTAL BARRIER — sealed until ${fmtDate(lock.until)}`, 'bad');
  }

  let usedKey = null;
  const needsKey = !(lock && lock.everFailed);
  if (needsKey){
    const need = RANK_VAL[d.rank];
    const idx = state.keys.findIndex(k => RANK_VAL[k.rank] >= need);
    if (idx === -1) return toast('No suitable key. Clear all ceiling quests for a chance at one.', 'bad');
    usedKey = state.keys.splice(idx,1)[0];
  }

  const days = DUNGEON_DAYS[d.rank];
      state.dungeons.active = {
    id: d.id,
    name: d.name,
    real: d.real || '',
    rank: d.rank,
    domain: d.domain || null,
    tasks: d.tasks.map(t => ({...t, done:false})),
    startedAt: new Date().toISOString(),
    deadline: new Date(Date.now() + days*86400000).toISOString()
  };
  state.dungeons.inbox = state.dungeons.inbox.filter(x => x.id !== id);
  delete state.dungeons.locked[id];

  save(); render();
  toast(`DUNGEON OPENED — ${d.rank}-RANK${usedKey ? ` (key [${usedKey.rank}] consumed)` : ''}`);
}

function toggleTask(taskId){
  const a = state.dungeons.active;
  if (!a) return;
  const t = a.tasks.find(x => x.id === taskId);
  if (!t) return;

  t.done = !t.done;

  // Bank points the first time an objective is ticked. Unticking does not refund.
        if (t.done && !t.paid){
    t.paid = true;
    const mult = getDomainMultiplier(a.domain);
    const pts = Math.round(DUNGEON_OBJECTIVE_POINTS * mult);
    t.pointsAwarded = state.devMode ? 0 : pts;
    if (state.devMode){
      toast('DEV MODE — objective logged, no points awarded.');
    } else {
      state.unassigned += pts;
      const multNote = mult !== 1 ? ` (arc ${mult > 1 ? '+' : ''}${Math.round((mult-1)*100)}%)` : '';
      toast(`+${pts} STAT POINTS — OBJECTIVE COMPLETE${multNote}`, 'gold');
    }
  }
  if (a.tasks.every(x => x.done)){
                const earned = state.devMode ? 0 : a.tasks.reduce((sum, x) => sum + (x.pointsAwarded || 0), 0);
        state.dungeons.cleared.push({
      id: a.id, name: a.name, real: a.real || '', rank: a.rank,
      domain: a.domain || null,
      clearedAt: new Date().toISOString()
    });
    state.dungeons.active = null;
    save(); render();
    openModal(`
      <h2>Dungeon Cleared</h2>
      <div style="text-align:center;padding:10px 0 20px">
        <div style="font-size:16px;font-weight:700;margin-bottom:12px">
          <span class="tag rank-${a.rank}" style="font-size:13px">${a.rank}</span>
          ${esc(a.name)}
        </div>
        ${a.real ? `<div class="dungeon-real" style="margin-bottom:18px">${esc(a.real)}</div>` : ''}
        <div style="font-size:11px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px">Total Earned</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--gold);text-shadow:0 0 20px rgba(255,207,92,.7)">+${earned} STAT POINTS</div>
        <div style="font-size:12px;color:var(--dim);margin-top:10px">Assign them in the Status tab.</div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" data-act="close-modal">Acknowledge</button>
      </div>
    `);
    return;
  }
  save(); render();
}
function abandonDungeon(){
  const a = state.dungeons.active;
  if (!a) return;
  if (!confirm('Abandon this dungeon? It will be sealed for a random period (1 week – 6 months).')) return;
  const lockMs = (7 + Math.random()*175) * 86400000;
  state.dungeons.locked[a.id] = {until: new Date(Date.now()+lockMs).toISOString(), everFailed:true};
  state.dungeons.active = null;
  save(); render();
  toast('SYSTEM ERROR: MENTAL BARRIER — dungeon sealed.', 'bad');
}

function renderHUD(){

  function statPentagonHTML(){
  const W = 420, H = 300;
  const cx = W/2, cy = H/2;
  const R = 90;
  const letterR = R + 22;
  const labelR  = R + 44;
  const angleFor = (i) => -Math.PI/2 + i * (2*Math.PI/5);

  const barrier = nextLevelBarrier();
  const values = STAT_KEYS.map(k => state.stats[k]);
  const maxVal = Math.max(barrier, ...values);
  const totalVal = values.reduce((a,b) => a+b, 0);

  const axes = STAT_KEYS.map((k, i) => {
    const a = angleFor(i);
    const v = state.stats[k];
    const ratio = maxVal > 0 ? v/maxVal : 0;
    return {
      key: k,
      angle: a,
      value: v,
      ratio,
      outer: { x: cx + Math.cos(a)*R,          y: cy + Math.sin(a)*R },
      inner: { x: cx + Math.cos(a)*R*ratio,    y: cy + Math.sin(a)*R*ratio },
      letterPos: { x: cx + Math.cos(a)*letterR, y: cy + Math.sin(a)*letterR },
      labelPos:  { x: cx + Math.cos(a)*labelR,  y: cy + Math.sin(a)*labelR }
    };
  });

  const gridPoly = (r) => axes.map(p => {
    const x = cx + Math.cos(p.angle)*R*r;
    const y = cy + Math.sin(p.angle)*R*r;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const dataPoly = axes.map(p => `${p.inner.x.toFixed(1)},${p.inner.y.toFixed(1)}`).join(' ');

  const gradeFor = (ratio) => {
    const pct = ratio * 100;
    if (pct >= 90) return 'S';
    if (pct >= 80) return 'A';
    if (pct >= 70) return 'B';
    if (pct >= 60) return 'C';
    if (pct >= 50) return 'D';
    if (pct >= 40) return 'E';
    if (pct >= 30) return 'F';
    return 'G';
  };

  return `
    <div class="stat-pentagon-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="stat-pentagon" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="pentagonFill" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#4fd6ff" stop-opacity=".32"/>
            <stop offset="100%" stop-color="#4fd6ff" stop-opacity=".08"/>
          </radialGradient>
        </defs>

        <!-- concentric grid rings -->
        ${[0.25,0.5,0.75,1].map(r =>
          `<polygon points="${gridPoly(r)}" fill="none" stroke="rgba(47,143,255,${r===1?0.45:0.18})" stroke-width="1"/>`
        ).join('')}

        <!-- axes -->
        ${axes.map(p =>
          `<line x1="${cx}" y1="${cy}" x2="${p.outer.x.toFixed(1)}" y2="${p.outer.y.toFixed(1)}" stroke="rgba(47,143,255,.22)" stroke-width="1"/>`
        ).join('')}

        <!-- filled polygon for current values -->
        <polygon points="${dataPoly}" fill="url(#pentagonFill)" stroke="#4fd6ff" stroke-width="2" stroke-linejoin="round"/>

        <!-- grade letters, positioned between the polygon and the stat name -->
        ${axes.map(p => {
          const g = gradeFor(p.ratio);
          const s = g === 'S';
          return `<text x="${p.letterPos.x.toFixed(1)}" y="${p.letterPos.y.toFixed(1)}"
                        text-anchor="middle" dominant-baseline="middle"
                        font-family="'Share Tech Mono',monospace" font-size="20" font-weight="700"
                        fill="${s ? '#ffcf5c' : '#eaf6ff'}"
                        style="filter:drop-shadow(0 0 5px ${s ? 'rgba(255,207,92,.75)' : 'rgba(79,214,255,.55)'})">${g}</text>`;
        }).join('')}

        <!-- stat name labels, positioned further out -->
        ${axes.map(p => {
          const anchor = Math.abs(p.labelPos.x - cx) < 5 ? 'middle' : (p.labelPos.x > cx ? 'start' : 'end');
          return `<text x="${p.labelPos.x.toFixed(1)}" y="${p.labelPos.y.toFixed(1)}"
                        text-anchor="${anchor}" dominant-baseline="middle"
                        font-family="'Chakra Petch',sans-serif" font-size="11" font-weight="600"
                        letter-spacing="1.5" fill="#6f8cb5">${STAT_META[p.key].label}</text>`;
        }).join('')}
      </svg>

      <div class="stat-pentagon-caption">
        <div class="stat-pentagon-total">
          <span class="label">TOTAL</span>
          <span class="value">${totalVal}</span>
        </div>
        <div class="meta">
          Graded against <b style="color:var(--cyan)">${maxVal}</b>
          ${maxVal > barrier
            ? ' — highest stat is now the target'
            : ` · next barrier ${barrier}`}
        </div>
      </div>
    </div>`;
}

function openTreeModal(q){
  const origin = q.origin || state.createdAt;

  // Build the version chain: oldest → newest, ending with the current version.
  const versions = [];
  if (q.history.length === 0){
    versions.push({
      start: origin, end: null,
      name: q.name, floor: q.floor, ceiling: q.ceiling,
      isCurrent: true, isOrigin: true
    });
  } else {
    versions.push({
      start: origin, end: q.history[0].date,
      name: q.history[0].name, floor: q.history[0].floor, ceiling: q.history[0].ceiling,
      action: q.history[0].action, note: q.history[0].note,
      isOrigin: true
    });
    for (let i = 1; i < q.history.length; i++){
      versions.push({
        start: q.history[i-1].date, end: q.history[i].date,
        name: q.history[i].name, floor: q.history[i].floor, ceiling: q.history[i].ceiling,
        action: q.history[i].action, note: q.history[i].note
      });
    }
    versions.push({
      start: q.history[q.history.length-1].date, end: null,
      name: q.name, floor: q.floor, ceiling: q.ceiling,
      isCurrent: true
    });
  }

  const treeHTML = versions.map(v => {
    const dateLabel = v.isCurrent
      ? `CURRENT · since ${fmtShort(v.start)}`
      : `${fmtShort(v.start)} → ${fmtShort(v.end)}`;

        const canGrad = canEditNow();

    </p>

      <span style="color:var(--gold)">Next window: Sunday 19:00 – 24:00</span><br>
      <span style="color:var(--dim)">…or spend an instant edit token.</span>
    </p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" data-act="close-modal">Close</button>
    </div>
  `;

  openModal(`
    <h2>Quest Tree — ${STAT_META[q.stat].label}</h2>
    <div class="qtree">${treeHTML}</div>

    <hr style="border:none;border-top:1px solid rgba(47,143,255,.2);margin:18px 0">

    ${gradSection}
  `);

    // In Extend mode, the new habit builds on top of the old ceiling.
  // In Replace mode, the new habit stands alone — clear the floor.
  document.querySelectorAll('input[name="gradMode"]').forEach(r => {
    r.addEventListener('change', () => {
      const floorInput = document.getElementById('gradFloor');
      if (!floorInput) return;
      if (r.checked && r.value === 'extend'){

        floorInput.value = base ? base + ' + ' : '';
        floorInput.focus();
      } else if (r.checked){
        floorInput.value = '';
      }
    });
  });
}

    return viewActiveMission(active) + viewMissionForm() + viewMissionBacklog() + viewMissionHistory();

function viewActiveMission(m){
  const done = m.criteria.filter(c => c.done).length;
  const total = m.criteria.length;
  const allDone = done === total;

  const now = Date.now();
  const start = new Date(m.startedAt).getTime();
  const end = new Date(m.deadline).getTime();
  const daysElapsed = Math.floor((now - start) / 86400000);
  const totalDays = Math.max(1, Math.ceil((end - start) / 86400000));
  const daysRemaining = Math.max(0, Math.ceil((end - now) / 86400000));
  const overdue = now > end;

  // ---- criteria section (collapsible) ----
  const criteriaHTML = m.criteria.map((c, i) => `
    <div class="mission-criterion ${c.done ? 'on' : ''}">
      <button class="crit-chk ${c.done ? 'on' : ''}" data-act="toggle-criterion" data-id="${c.id}">${c.done ? '✓' : (i+1)}</button>
      <span class="crit-text">${esc(c.text)}</span>
    </div>`).join('');

  const criteriaSection = `
    <div class="mission-collapsible-section ${criteriaSectionOpen?'open':''}">
      <div class="mission-section-toggle" data-act="toggle-criteria-section">
        <span class="mission-section-toggle-label">Success Criteria — all three required</span>
        <span class="mission-section-toggle-meta">${done}/${total}</span>
        <span class="mission-section-toggle-chevron">▸</span>
      </div>
      <div class="mission-section-body">
        ${criteriaHTML}
        <div class="mission-progress">PROGRESS: <b>${done}</b> / ${total}${allDone ? ' — ALL CRITERIA MET' : ''}</div>
      </div>
    </div>`;

  // ---- milestones section (collapsible) ----
  const mssDone = (m.milestones || []).filter(ms => ms.done).length;
  const mssTotal = (m.milestones || []).length;
  const milestonesBody = mssTotal > 0
    ? m.milestones.map(ms => {
        const msOpen = expandedMilestones.has(ms.id);
        const stepDone = (ms.steps || []).filter(s => s.done).length;
        const stepTotal = (ms.steps || []).length;
        const hasSteps = stepTotal > 0;
        const progress = hasSteps ? `<span class="mission-milestone-progress">${stepDone}/${stepTotal}</span>` : '';
        const stepsHTML = hasSteps
          ? ms.steps.map(s => `
              <div class="mission-milestone-step ${s.done ? 'on' : ''}">
                <button class="step-chk ${s.done ? 'on' : ''}" data-act="toggle-milestone-step" data-msid="${ms.id}" data-sid="${s.id}">${s.done ? '✓' : '○'}</button>
                <span class="step-text">${esc(s.text)}</span>
              </div>`).join('')
          : '';
        const chevron = hasSteps ? `<span class="mission-milestone-chevron">▸</span>` : '';
        const headAct = hasSteps ? `data-act="toggle-milestone-collapse" data-id="${ms.id}"` : '';
        const body = hasSteps ? `<div class="mission-milestone-body">${stepsHTML}</div>` : '';
        return `
          <div class="mission-milestone ${ms.done ? 'done' : ''} ${msOpen ? 'open' : ''}" data-msid="${ms.id}">
            <div class="mission-milestone-head" ${headAct}>
              <button class="mission-milestone-chk ${ms.done ? 'on' : ''}" data-act="toggle-milestone" data-id="${ms.id}">${ms.done ? '✓' : ''}</button>
              <span class="mission-milestone-title">${esc(ms.title)}</span>
              ${progress}
              ${chevron}
            </div>
            ${body}
          </div>`;
      }).join('')
        : '<div class="empty">No checkpoints defined.</div>';

  const milestonesSection = `
    <div class="mission-collapsible-section ${milestonesSectionOpen?'open':''}">
            <div class="mission-section-toggle" data-act="toggle-milestones-section">
        <span class="mission-section-toggle-label">Checkpoints</span>
        <span class="mission-section-toggle-meta">${mssDone}/${mssTotal} done</span>
        <span class="mission-section-toggle-chevron">▸</span>
      </div>
      <div class="mission-section-body">
        ${milestonesBody}
      </div>
    </div>`;

  // ---- encounter pairs ----
  const pairsAll = m.encounterPairs || [];
  const happenedCount = pairsAll.filter(x => x.happened).length;

  // Sort: happened first (by happenedAt), then not happened (by editedAt, then createdAt)
  const sortedPairs = [...pairsAll].sort((a, b) => {
    if (a.happened && !b.happened) return -1;
    if (!a.happened && b.happened) return 1;
    if (a.happened && b.happened) {
      return new Date(a.happenedAt || 0) - new Date(b.happenedAt || 0);
    }
    const aTime = new Date(a.editedAt || a.createdAt || 0).getTime();
    const bTime = new Date(b.editedAt || b.createdAt || 0).getTime();
    return aTime - bTime;
  });

  const pairsList = sortedPairs.map(p => {
    const editing = editingEncounters.has(p.id);
    const collapsed = collapsedEncounters.has(p.id);
    const happened = !!p.happened;
    const badge = happened
      ? '<span class="mission-pair-badge happened">Happened</span>'
      : '<span class="mission-pair-badge planned">Planned</span>';
        const preview = (p.encounter || '').split('\n')[0].trim();
    const headerLabelHTML = preview
      ? `<span class="mission-pair-preview" title="${esc(p.encounter)}">${esc(preview)}</span>`
      : `<span class="mission-pair-label">Encounter</span>`;
    const notes = p.fieldNotes || {worked:'', failed:'', change:''};

    // Build encounter and plan blocks, skipping empty ones when not editing
    let encBlock = '';
    if (editing) {
      encBlock = `<textarea data-enc-encounter="${p.id}" placeholder="What might happen / what happened...">${esc(p.encounter || '')}</textarea>`;
    } else if (p.encounter && p.encounter.trim()) {
      encBlock = `<div class="mission-pair-text">${esc(p.encounter)}</div>`;
    }

    let planBlock = '';
    if (editing) {
      planBlock = `<textarea data-enc-plan="${p.id}" placeholder="How I'll handle it...">${esc(p.plan || '')}</textarea>`;
    } else if (p.plan && p.plan.trim()) {
      planBlock = `<div class="mission-pair-text">${esc(p.plan)}</div>`;
    }

    const outcomeRow = happened
      ? `<div class="mission-pair-outcome">
          <button class="outcome-chip ${p.outcome==='worked'?'on worked':''}" data-act="set-encounter-outcome" data-pid="${p.id}" data-outcome="worked">Worked</button>
          <button class="outcome-chip ${p.outcome==='partial'?'on partial':''}" data-act="set-encounter-outcome" data-pid="${p.id}" data-outcome="partial">Partial</button>
          <button class="outcome-chip ${p.outcome==='failed'?'on failed':''}" data-act="set-encounter-outcome" data-pid="${p.id}" data-outcome="failed">Failed</button>
        </div>`
      : '';

    let notesBlock = '';
    if (happened) {
      if (editing) {
        notesBlock = `
          <div class="mission-pair-notes">
            <label><span class="note-label">What worked</span>
              <textarea data-note-pid="${p.id}" data-note-field="worked" placeholder="What went right...">${esc(notes.worked)}</textarea>
            </label>
            <label><span class="note-label">What didn't</span>
              <textarea data-note-pid="${p.id}" data-note-field="failed" placeholder="What went wrong...">${esc(notes.failed)}</textarea>
            </label>
            <label><span class="note-label">What needs to change</span>
              <textarea data-note-pid="${p.id}" data-note-field="change" placeholder="How to adjust the plan...">${esc(notes.change)}</textarea>
            </label>
          </div>`;
      } else {
        const noteItems = [];
        if (notes.worked && notes.worked.trim()) noteItems.push({label:'What worked', body: notes.worked});
        if (notes.failed && notes.failed.trim()) noteItems.push({label:"What didn't", body: notes.failed});
        if (notes.change && notes.change.trim()) noteItems.push({label:'What needs to change', body: notes.change});
        if (noteItems.length > 0) {
          notesBlock = `<div class="mission-pair-notes">${noteItems.map(n => `
            <div class="mission-pair-note-static">
              <span class="note-label">${n.label}</span>
              <div class="note-body">${esc(n.body)}</div>
            </div>`).join('')}</div>`;
        }
      }
    }

    const actions = editing
      ? `<div class="mission-pair-actions">
          <button class="btn small ghost" data-act="cancel-edit-encounter" data-pid="${p.id}">Cancel</button>
          <button class="btn small" data-act="save-encounter" data-pid="${p.id}">Save</button>
        </div>`
      : `<div class="mission-pair-actions">
          <button class="btn small ghost" data-act="edit-encounter" data-pid="${p.id}">Edit</button>
          <button class="btn small" data-act="toggle-encounter-happened" data-pid="${p.id}">${happened ? 'Unmark Happened' : 'Encounter Happened'}</button>
        </div>`;

        const encSection  = encBlock  ? `<div class="mission-pair-enc">${encBlock}</div>` : '';
    const planSection = planBlock ? `<div class="mission-pair-plan">
            <div class="mission-pair-label">Plan</div>
            ${planBlock}
          </div>` : '';

    return `
      <div class="mission-pair ${collapsed?'collapsed':''}" data-pid="${p.id}">
                <div class="mission-pair-head" data-act="toggle-encounter-collapse" data-pid="${p.id}">
          <span class="mission-collapse-chevron">▸</span>
          ${headerLabelHTML}
          ${badge}

/* =========================================================
   TIMERS
   ========================================================= */
function updateTimers(){
  const p = state.pendingPenalty;
  const pEl = document.querySelector('[data-timer="penalty"]');
  if (pEl && p && !p.done){
    const ms = new Date(p.deadline).getTime() - Date.now();
    const txt = fmtDuration(ms);
    if (pEl.textContent !== txt) pEl.textContent = txt;
    const ok = ms > 3*3600*1000;
    if (pEl.classList.contains('ok') !== ok) pEl.classList.toggle('ok', ok);
  }
  const a = state.dungeons.active;
  const dEl = document.querySelector('[data-timer="dungeon"]');
  if (dEl && a){
    const ms = new Date(a.deadline).getTime() - Date.now();
    const txt = fmtDuration(ms);
    if (dEl.textContent !== txt) dEl.textContent = txt;
    const ok = ms > 24*3600*1000;
    if (dEl.classList.contains('ok') !== ok) dEl.classList.toggle('ok', ok);
  }
}
setInterval(updateTimers, 1000);
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ tick(); updateTimers(); }
});
window.addEventListener('pageshow', () => { tick(); updateTimers(); });

/* =========================================================
   MODAL
   ========================================================= */
function openModal(html){
  const m = $('#modal');
  m.innerHTML = `<div class="modal">${html}</div>`;
  m.classList.remove('hidden');
}
function closeModal(){
  const m = $('#modal');
  m.classList.add('hidden');
  m.innerHTML = '';
}

    case 'save-dungeon-edit': {
      if (!state.devMode){
        toast('Editing dungeons requires developer mode.', 'bad');
        break;
      }
      const id = el.dataset.id;
      const isActive = el.dataset.active === '1';
      const name = $('#edName').value.trim();
      const real = $('#edReal').value.trim();
      const rank = $('#edRank').value;
      const domain = $('#edDomain').value || 'mind';

      if (!name){ toast('Dungeon name is required.', 'bad'); break; }
      if (!DUNGEON_DAYS[rank]){ toast('Invalid rank.', 'bad'); break; }

      if (isActive){
        const d = state.dungeons.active;
        if (!d || d.id !== id) break;
        d.name = name;
        d.real = real;
        d.rank = rank;
        d.domain = domain;
      } else {
        const d = state.dungeons.inbox.find(x => x.id === id);
        if (!d) break;
        const rawTasks = $('#edTasks').value.split('\n').map(s => s.trim()).filter(Boolean);
        if (!rawTasks.length){ toast('At least one objective is required.', 'bad'); break; }
        d.name = name;
        d.real = real;
        d.rank = rank;
        d.domain = domain;
        const oldTasks = d.tasks || [];
        d.tasks = rawTasks.map((text, i) => {
          const old = oldTasks[i];
          const sameText = old && old.text === text;
          return { id: sameText ? old.id : uid(), text, done: false };
        });
      }

      save(); closeModal(); render();
      toast('Dungeon updated.', 'gold');
      break;
    }

    case 'open-dungeon':
      openDungeon(el.dataset.id);
      break;

    case 'toggle-task':
      toggleTask(el.dataset.id);
      break;

    case 'abandon-dungeon':
      abandonDungeon();
      break;

    case 'weekly':
      openWeeklyReview();
      break;

    case 'apply-weekly':
      applyWeekly();
      break;

    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `arise-system-${localDateStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Export complete.');
      break;
    }

    case 'import':
      $('#importFile').click();
      break;

    case 'wipe': {
      if (!confirm('This erases EVERYTHING permanently. Are you certain?')) break;
      if (!confirm('Absolutely certain? There is no recovery.')) break;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
      break;
    }
  }
});

/* file import */
document.addEventListener('change', (e) => {
  if (e.target.id !== 'importFile') return;
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
            const data = JSON.parse(r.result);
      state = migrate(data);
      hydrateUI();
      save(); render();
      toast('Data imported successfully.', 'gold');
    } catch(err){
      toast('Import failed — invalid file.', 'bad');
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* =========================================================
   INIT
   ========================================================= */
function showOath(){
  openModal(`
    <div class="oath-title">ARISE</div>
    <div class="oath-sub">SYSTEM INITIALIZATION</div>
    <div class="oath-text">
      You have been selected as a <b>Player</b>.<br>
      Daily quests have been generated.<br>
      Failure to comply will result in a <b>penalty</b>.<br><br>
      <span style="color:var(--dim);font-size:12px;line-height:1.9">
        The first rule of this System is that you do not speak of this System.<br>
        Once you begin, you do not quit. You may only stop —
        and remain, indefinitely, at whatever level you stopped.
      </span>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-act="accept-oath" id="oathBtn">I Accept</button>
    </div>
  `);
  document.getElementById('oathBtn').addEventListener('click', () => {
    state.oathTaken = true;
    save(); closeModal(); render();
    toast('Welcome, Player.', 'gold');
  });
}

/* On-screen error overlay — mobile-friendly debugging without a Mac. */
function showErrorBox(label, text){
  let box = document.getElementById('__err_box');
  if (!box){
    box = document.createElement('div');
    box.id = '__err_box';
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999999;background:#1a0004;color:#ff9db5;padding:12px;font-family:monospace;font-size:12px;max-height:50vh;overflow:auto;border:2px solid #ff3d6e;white-space:pre-wrap;';
    document.body.appendChild(box);
  }
  box.textContent = label + '\n\n' + text;
  box.style.display = 'block';
}
window.addEventListener('error', (e) => {
  const stack = e.error && e.error.stack ? e.error.stack.split('\n').slice(0, 8).join('\n') : '(no stack)';
  showErrorBox(
    'ERROR: ' + (e.message || 'unknown'),
    (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n\n' + stack
  );
});
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  showErrorBox('PROMISE REJECTION', (r && r.stack) ? r.stack : String(r));
});

init();
  
function init(){
  const loaded = load();
  if (loaded) state = loaded;

  hydrateUI();

  tick();
  render();
  if (!state.oathTaken) showOath();
  else tick();
}

init();
</script>
