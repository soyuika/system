<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARISE // SYSTEM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='50%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%234fd6ff'/%3E%3Cstop offset='100%25' stop-color='%230a1230'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='%2304060d'/%3E%3Cpolygon points='32,6 56,20 56,44 32,58 8,44 8,20' fill='url(%23g)' stroke='%234fd6ff' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='bold' fill='%2304060d' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#04060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060d;
  --panel-a:rgba(10,22,45,.92);
  --panel-b:rgba(5,10,22,.92);
  --line:rgba(47,143,255,.35);
  --line-hi:rgba(79,214,255,.85);
  --cyan:#4fd6ff;
  --blue:#2f7fff;
  --text:#cfe6ff;
  --dim:#6f8cb5;
  --danger:#ff3d6e;
  --gold:#ffcf5c;
  --green:#38ffb0;
    --purple:#a06bff;
  --mission:#ff5fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Chakra Petch',system-ui,-apple-system,sans-serif;
  font-weight:400;
  letter-spacing:.02em;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg,
      var(--bg) 0%,
      rgba(4,6,13,.85) 6%,
      rgba(4,6,13,.35) 14%,
      rgba(4,6,13,0) 22%,
      rgba(4,6,13,0) 66%,
      rgba(4,6,13,.45) 82%,
      rgba(4,6,13,.92) 94%,
      var(--bg) 100%),
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(30,110,255,.20), transparent 65%),
    radial-gradient(ellipse 60% 40% at 100% 105%, rgba(0,200,255,.09), transparent 60%),
    linear-gradient(rgba(47,143,255,.05) 1px, transparent 1px) 0 0/100% 44px,
    linear-gradient(90deg, rgba(47,143,255,.05) 1px, transparent 1px) 0 0/44px 100%;
}
body::after{
  content:'';position:fixed;left:0;right:0;top:-100px;bottom:-100px;
  pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(180deg,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,20,60,.16) 3px, rgba(0,0,0,0) 4px);
  opacity:.5;
  will-change:transform;
  animation:scan 9s linear infinite;
}
@keyframes scan{ from{transform:translateY(0)} to{transform:translateY(100px)} }

/* On mobile, keep the texture but stop the animation. */
@media (max-width:900px){
  body::after{
    animation:none;
    will-change:auto;
    transform:none;
    top:0;bottom:0;
    opacity:.35;
  }
}
@media (prefers-reduced-motion:reduce){
  body::after{ animation:none; }
}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:18px 14px 40px}

/* ---------- panels ---------- */
.panel{
  position:relative;
  background:linear-gradient(160deg,var(--panel-a),var(--panel-b));
  border:1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  padding:16px 18px;
  margin-bottom:14px;
}
.panel::before{
  content:'';position:absolute;top:0;left:14px;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-hi),transparent);opacity:.75;
}
.panel-title{
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);
  margin:0 0 14px 0;display:flex;align-items:center;gap:12px;
  padding:9px 14px;
  border:1px solid rgba(79,214,255,.32);
  background:linear-gradient(90deg, rgba(79,214,255,.07), rgba(79,214,255,.01) 70%);
  text-shadow:0 0 12px rgba(79,214,255,.6);
  box-shadow:0 0 14px rgba(79,214,255,.08), inset 0 0 24px rgba(79,214,255,.03);
}
.panel-title::before{
  content:'';
  display:block;
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--cyan);border-radius:50%;
  background:
    linear-gradient(var(--cyan),var(--cyan)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(79,214,255,.18), transparent 72%);
  box-shadow:0 0 10px rgba(79,214,255,.45), inset 0 0 8px rgba(79,214,255,.15);
  filter:drop-shadow(0 0 4px rgba(79,214,255,.9));
}
.warn .panel-title::before{
  border-color:var(--danger);
  background:
    linear-gradient(var(--danger),var(--danger)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--danger),var(--danger)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(255,61,110,.20), transparent 72%);
  box-shadow:0 0 10px rgba(255,61,110,.5), inset 0 0 8px rgba(255,61,110,.15);
  filter:drop-shadow(0 0 4px rgba(255,61,110,.9));
}
.warn .panel-title{
  border-color:rgba(255,61,110,.4);
  background:linear-gradient(90deg, rgba(255,61,110,.08), rgba(255,61,110,.01) 70%);
}

/* ---------- HUD ---------- */
#hud{margin-bottom:14px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hud-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud-name{font-size:19px;font-weight:600;letter-spacing:.18em;color:#eaf6ff;text-shadow:0 0 18px rgba(79,214,255,.55)}
.hud-name small{font-weight:400;color:var(--dim);letter-spacing:.1em;font-size:11px;display:block;margin-top:2px}
.hud-title{
  display:inline-block;
  margin-left:12px;
  padding:2px 10px;
  font-family:'Share Tech Mono',monospace;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  border:1px solid rgba(255,207,92,.5);
  background:linear-gradient(90deg, rgba(255,207,92,.10), rgba(255,207,92,.02) 70%);
  text-shadow:0 0 10px rgba(255,207,92,.6);
  box-shadow:0 0 12px rgba(255,207,92,.15), inset 0 0 12px rgba(255,207,92,.05);
  vertical-align:middle;
}
.hud-title.danger{
  color:var(--danger);
  border-color:rgba(255,61,110,.5);
  background:linear-gradient(90deg, rgba(255,61,110,.10), rgba(255,61,110,.02) 70%);
  text-shadow:0 0 10px rgba(255,61,110,.6);
  box-shadow:0 0 12px rgba(255,61,110,.15), inset 0 0 12px rgba(255,61,110,.05);
}
.title-equipped-badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  letter-spacing:.14em;
  padding:1px 6px;
  margin-left:8px;
  color:var(--gold);
  border:1px solid rgba(255,207,92,.5);
  background:rgba(255,207,92,.08);
  text-transform:uppercase;
  vertical-align:middle;
}
.title-stored-badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  letter-spacing:.14em;
  padding:1px 6px;
  margin-left:8px;
  color:var(--dim);
  border:1px solid rgba(111,140,181,.5);
  background:rgba(111,140,181,.06);
  text-transform:uppercase;
  vertical-align:middle;
}
.title-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
  width:100%;
}
.title-name-line{
  font-weight:600;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  min-width:0;
}
.title-awarded-date{
  color:var(--gold) !important;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  white-space:nowrap;
  flex-shrink:0;
}
.item.title-equipped{
  border-color:rgba(255,207,92,.4);
  background:linear-gradient(90deg, rgba(255,207,92,.06), rgba(255,207,92,.01) 70%);
}

/* Titles: stack vertically on mobile so text and buttons each get full width */
@media(max-width:620px){
  .item.title-item{
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:12px 13px;
  }
  .item.title-item > div:first-child{
    width:100%;
  }
  .item.title-item .title-awarded-date{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item.title-item .title-actions{
    width:100%;
    padding-top:12px;
    margin-top:12px;
    border-top:1px dashed rgba(47,143,255,.18);
    justify-content:flex-start;
    flex-wrap:wrap;
    gap:6px;
  }
  .item.title-item .title-actions .btn{
    flex:1 1 calc(50% - 3px);
    min-width:0;
    text-align:center;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
}
.hud-right{display:flex;align-items:center;gap:16px}

/* ---------- arc banner ---------- */
.arc-banner{
  --arc-color:#4fd6ff;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:14px;padding:10px 14px;
  border:1px solid var(--arc-color);
  background:linear-gradient(90deg, rgba(255,255,255,.04), transparent 80%);
  font-family:'Share Tech Mono',monospace;font-size:12px;
  letter-spacing:.14em;
  box-shadow:0 0 18px rgba(79,214,255,.06), inset 0 0 20px rgba(79,214,255,.03);
  clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
.arc-banner-left,
.arc-banner-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arc-banner-label{color:var(--dim);font-size:10.5px;letter-spacing:.24em}
.arc-banner-domain{
  color:var(--arc-color);font-weight:600;
  text-shadow:0 0 8px rgba(79,214,255,.4);
}
.arc-banner-phase{color:#eaf6ff;font-size:11px}
.arc-banner-days{color:var(--dim);font-size:11px}
.arc-banner-btn{
  font-family:inherit;font-size:10.5px;letter-spacing:.14em;
  padding:5px 10px;cursor:pointer;text-transform:uppercase;
  background:rgba(4,10,22,.6);
  border:1px solid var(--arc-color);
  color:var(--arc-color);
  transition:.15s;
}
.arc-banner-btn:hover{background:rgba(20,50,100,.5);color:#fff}
.arc-banner-idle{--arc-color:rgba(79,214,255,.35)}
.arc-banner-idle .arc-banner-domain{color:var(--dim);text-shadow:none}
.arc-banner-expired{--arc-color:#ff3d6e !important}
@media(max-width:620px){
  .arc-banner{flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px}
  .arc-banner-right{width:100%;justify-content:space-between}
}

.arc-domain-grid{display:grid;grid-template-columns:1fr;gap:6px}
.arc-domain-choice{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;
  border:1px solid rgba(47,143,255,.25);
  background:rgba(4,10,22,.6);
  cursor:pointer;transition:.15s;
}
.arc-domain-choice:hover{border-color:rgba(79,214,255,.5)}
.arc-domain-choice input{margin-top:3px;flex-shrink:0}
.arc-domain-name{font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:.14em;margin-bottom:3px}
.arc-domain-desc{font-size:12px;color:var(--dim);line-height:1.5}
.arc-domain-choice.selected{border-color:var(--cyan);background:rgba(20,60,120,.25)}

/* ---------- domain badge ---------- */
.domain-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  letter-spacing:.12em;
  padding:2px 7px;
  border:1px solid currentColor;
  text-transform:uppercase;
  white-space:nowrap;
  flex-shrink:0;
  line-height:1.2;
}
.domain-badge-mult{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.06em;
  padding:1px 5px;
  margin-left:4px;
  vertical-align:middle;
  border:1px solid currentColor;
}
.domain-badge-mult.plus{color:#38ffb0}
.domain-badge-mult.minus{color:#ff3d6e}
.lvl-box{text-align:right}
.lvl-label{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim)}
.lvl-num{font-family:'Share Tech Mono',monospace;font-size:34px;line-height:1;color:#fff;text-shadow:0 0 22px rgba(79,214,255,.85)}
.rank-badge{
  --c:#8fa6c4;
  width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:28px;color:var(--c);
  border:1px solid var(--c);
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  text-shadow:0 0 18px var(--c);
  box-shadow:0 0 26px color-mix(in srgb, var(--c) 40%, transparent);
  animation:pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{
  font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  background:rgba(8,18,36,.7);color:var(--dim);border:1px solid rgba(47,143,255,.22);
  padding:10px 16px;cursor:pointer;transition:.16s;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.tab:hover{color:var(--cyan);border-color:rgba(79,214,255,.5)}
.tab.active{color:#04121f;background:linear-gradient(180deg,#5fd8ff,#2f8fff);border-color:#7fe3ff;font-weight:600;box-shadow:0 0 22px rgba(79,214,255,.5)}
.tab .badge{display:inline-block;margin-left:6px;background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px}
.tab-icon{display:none}

/* Alert state: dark red when idle, brighter red when active. */
.tab.tab-alert{
  --tab-accent:     #ff3d6e;
  --tab-accent-dim: #8a1230;
  --tab-accent-soft:rgba(255,61,110,.55);
  --tab-accent-bg:  rgba(42,8,20,.75);
  --tab-accent-bg-hover: rgba(64,10,30,.9);
  color:var(--tab-accent);
  border-color:var(--tab-accent-soft);
  background:var(--tab-accent-bg);
}
.tab[data-tab="missions"].tab-alert{
  --tab-accent:     #ff5fa8;
  --tab-accent-dim: #8a1250;
  --tab-accent-soft:rgba(255,95,168,.55);
  --tab-accent-bg:  rgba(42,8,22,.75);
  --tab-accent-bg-hover: rgba(64,10,34,.9);
}
.tab.tab-alert:hover{
  color:#fff;
  border-color:var(--tab-accent);
  background:var(--tab-accent-bg-hover);
}
.tab.tab-alert.active{
  color:#1a0010;
  background:linear-gradient(180deg, var(--tab-accent), var(--tab-accent-dim));
  border-color:var(--tab-accent);
  font-weight:600;
  box-shadow:0 0 22px var(--tab-accent-soft);
}

@media(max-width:620px){
  .tabs{flex-wrap:nowrap;gap:5px;overflow:visible}
  .tab{flex:1 1 auto;min-width:0;text-align:center;font-size:11px !important;padding:9px 6px !important;letter-spacing:.12em !important}
  .tab-full{display:none}
  .tab-icon{
    display:flex;align-items:center;justify-content:center;
    flex:0 0 42px;
    padding:9px 0 !important;
    font-size:18px !important;
    letter-spacing:0 !important;
    font-family:'Share Tech Mono',monospace !important;
  }
  /* unassigned points: stack the number above a 2-column grid of buttons */
  .unassigned-row{
    flex-direction:column !important;
    align-items:stretch !important;
    justify-content:flex-start !important;
    gap:14px !important;
  }
  .unassigned-row .pts{
    text-align:center;
    font-size:38px;
    line-height:1;
  }
  .unassigned-row .assign-row{
    display:grid !important;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:0 !important;
    width:100%;
  }
  .unassigned-row .assign-row .btn{
    width:100%;
    justify-content:center;
    padding:10px 6px;
    font-size:10.5px !important;
    letter-spacing:.06em !important;
    min-width:0;
    text-align:center;
  }
  /* the odd-one-out button (last, at odd position) spans the full width */
  .unassigned-row .assign-row .btn:last-child:nth-child(odd){
    grid-column:1 / -1;
  }
}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  background:linear-gradient(180deg, rgba(30,90,180,.35), rgba(10,30,70,.35));
  border:1px solid rgba(79,214,255,.45);color:var(--cyan);
  padding:9px 15px;cursor:pointer;transition:.15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn:hover:not(:disabled){background:linear-gradient(180deg, rgba(50,140,255,.55), rgba(20,60,130,.55));box-shadow:0 0 20px rgba(79,214,255,.45);color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.small{font-size:10px;padding:6px 11px;letter-spacing:.12em}
.btn.danger{border-color:rgba(255,61,110,.5);color:var(--danger)}
.btn.danger:hover:not(:disabled){background:linear-gradient(180deg, rgba(180,30,60,.55), rgba(80,10,25,.55));box-shadow:0 0 20px rgba(255,61,110,.45);color:#fff}
.btn.gold{border-color:rgba(255,207,92,.5);color:var(--gold)}
.btn.gold:hover:not(:disabled){background:linear-gradient(180deg, rgba(180,140,30,.55), rgba(80,60,10,.55));box-shadow:0 0 20px rgba(255,207,92,.45);color:#fff}
.btn.ghost{border-color:rgba(111,140,181,.35);color:var(--dim);background:rgba(10,18,32,.5)}
.btn.ghost:hover{color:var(--cyan);border-color:rgba(79,214,255,.5);background:rgba(20,50,100,.5)}

input,textarea,select{
  font-family:inherit;font-size:13px;color:var(--text);
  background:rgba(4,10,22,.85);border:1px solid rgba(47,143,255,.3);
  padding:9px 11px;width:100%;outline:none;transition:.15s;
}

/* iOS/Safari: strip native chrome so inputs respect the container width */
input[type="date"],
input[type="time"],
input[type="datetime-local"],
input[type="number"]{
  -webkit-appearance:none;
  appearance:none;
  min-width:0;
  max-width:100%;
  width:100%;
  box-sizing:border-box;
}

/* keep the picker indicator from pushing the box wider on iOS */
input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:.7;
  margin-left:6px;
  cursor:pointer;
  filter:invert(1) hue-rotate(180deg);
}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(79,214,255,.25)}
textarea{resize:vertical;min-height:64px}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}

/* ---------- stats ---------- */
.stat-row{margin-bottom:14px}
.stat-top{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:.14em;margin-bottom:6px;
  cursor:pointer;user-select:none;
  padding:4px 0;
  transition:.15s;
}
.stat-top:hover .stat-name{color:var(--cyan)}
.stat-name{
  color:var(--text);font-weight:500;
  display:inline-flex;align-items:center;gap:11px;
  transition:color .15s;
}
.stat-chevron{
  display:inline-block;width:0;height:0;
  border-left:6px solid var(--cyan);
  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  transition:transform .2s ease;
  flex-shrink:0;
}
.stat-top.open .stat-chevron{transform:rotate(90deg)}
.stat-val{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff}
.stat-val small{color:var(--dim);font-size:10px}
.bar{height:8px;background:rgba(10,25,50,.9);border:1px solid rgba(47,143,255,.25);overflow:hidden;position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,#1c5fd6,#4fd6ff);box-shadow:0 0 14px rgba(79,214,255,.7);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.stat-desc{
  font-size:10.5px;color:var(--dim);margin-top:0;line-height:1.5;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .28s ease, opacity .22s ease, margin-top .22s ease;
}
.stat-desc.open{max-height:160px;opacity:1;margin-top:8px}

/* lagging stat highlight */
.stat-row.lagging .stat-name{color:var(--gold)}
.stat-row.lagging .stat-val{color:var(--gold)}
.stat-row.lagging .bar{border-color:rgba(255,207,92,.45)}
.stat-row.lagging .bar-fill{background:linear-gradient(90deg,#c9880a,#ffcf5c);box-shadow:0 0 14px rgba(255,207,92,.6)}
.stat-lag-badge{
  display:inline-block;font-size:9.5px;letter-spacing:.16em;
  padding:2px 6px;margin-left:10px;
  color:var(--gold);border:1px solid rgba(255,207,92,.5);
  text-transform:uppercase;font-weight:500;
}

/* ---------- stat pentagon (Blue Lock style) ---------- */
.stat-pentagon-wrap{
  max-width:400px;
  margin:18px auto 4px;
  padding-top:14px;
  border-top:1px dashed rgba(47,143,255,.2);
}
.stat-pentagon{
  width:100%;
  height:auto;
  display:block;
  overflow:visible;
}
.stat-pentagon-caption{
  text-align:center;
  margin-top:6px;
}
.stat-pentagon-total{
  display:inline-flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:6px;
}
.stat-pentagon-total .label{
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px;
  letter-spacing:.24em;
  color:var(--dim);
}
.stat-pentagon-total .value{
  font-family:'Share Tech Mono',monospace;
  font-size:24px;
  color:#fff;
  text-shadow:0 0 14px rgba(79,214,255,.6);
}
.stat-pentagon-caption .meta{
  font-size:11.5px;
  color:var(--dim);
  letter-spacing:.04em;
  line-height:1.6;
}
@media(max-width:620px){
  .stat-pentagon-wrap{max-width:300px}
}

/* unassigned-points lag warning */
.lag-warn{
  margin-top:11px;padding:10px 13px;
  border:1px solid rgba(255,207,92,.4);
  background:linear-gradient(90deg, rgba(255,207,92,.09), rgba(255,207,92,.01) 80%);
  font-size:12.5px;color:var(--text);line-height:1.65;
}
.lag-warn b{color:var(--gold)}

/* distribution modal */
.dist-row{
  display:flex;align-items:center;gap:14px;
  padding:11px 0;
  border-bottom:1px solid rgba(47,143,255,.12);
}
.dist-row:last-of-type{border-bottom:none}
.dist-name{flex:1;font-size:14.5px;letter-spacing:.1em}
.dist-name.lag{color:var(--gold)}
.dist-cur{
  font-family:'Share Tech Mono',monospace;
  font-size:13.5px;color:var(--dim);
  min-width:56px;text-align:right;
}
.dist-input{
  width:84px !important;padding:7px 9px !important;
  font-family:'Share Tech Mono',monospace;font-size:16px !important;
  text-align:center;
}
.dist-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 0 4px;margin-top:4px;
  border-top:1px solid rgba(79,214,255,.25);
}
.dist-total .label{
  font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
}
.dist-total .val{
  font-family:'Share Tech Mono',monospace;
  font-size:21px;color:var(--gold);
  text-shadow:0 0 14px rgba(255,207,92,.5);
}
.dist-total .val.over{color:var(--danger);text-shadow:0 0 14px rgba(255,61,110,.5)}

.assign-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.pts{font-family:'Share Tech Mono',monospace;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(255,207,92,.7)}

/* ---------- quests ---------- */
.quest{padding:14px 16px;margin-bottom:10px}
.quest.done{border-color:rgba(56,255,176,.45);box-shadow:0 0 26px rgba(56,255,176,.12)}
.q-summary{
  display:flex;align-items:center;gap:12px;
  cursor:pointer;user-select:none;
  padding:2px 0;min-height:24px;
}
.q-summary .q-stat{
  font-size:10.5px;letter-spacing:.24em;color:var(--cyan);
  text-transform:uppercase;flex-shrink:0;
  min-width:100px;
}
.q-summary .q-name{
  flex:1;font-size:15px;font-weight:600;color:#eaf6ff;
  margin:0;letter-spacing:.04em;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .15s;
}
.quest.open .q-summary .q-name{white-space:normal;overflow:visible;text-overflow:clip}
.q-summary:hover .q-name{color:var(--cyan)}
.q-summary-status{display:flex;gap:5px;align-items:center;flex-shrink:0}
.q-dot{
  width:8px;height:8px;border-radius:50%;
  border:1px solid rgba(47,143,255,.3);display:inline-block;
  transition:background .2s, box-shadow .2s, border-color .2s;
}
.q-dot.on{
  background:var(--green);border-color:var(--green);
  box-shadow:0 0 6px rgba(56,255,176,.6);
}
.q-toggle{
  color:var(--dim);font-size:14px;
  transition:transform .15s;flex-shrink:0;
  display:inline-block;line-height:1;
}
.quest.open .q-toggle{transform:rotate(90deg)}
.q-detail{display:none;margin-top:12px}
.quest.open .q-detail{display:block}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.q-stat{font-size:10.5px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase}
.q-phase{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--cyan);border:1px solid rgba(79,214,255,.35);padding:1px 6px;letter-spacing:.1em}
.q-phase.hard{color:var(--gold);border-color:rgba(255,207,92,.5)}
.q-phase.easy{color:var(--green);border-color:rgba(56,255,176,.5)}
.q-name{font-size:15px;font-weight:600;color:#eaf6ff;margin-bottom:11px;letter-spacing:.04em}
.q-line{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-top:1px solid rgba(47,143,255,.13)}
.q-tag{font-size:9.5px;letter-spacing:.2em;color:var(--dim);min-width:62px;padding-top:3px}
.q-text{flex:1;font-size:12.5px;color:var(--text);line-height:1.5}
.q-text.empty{color:var(--dim);font-style:italic}
.chk{
  font-family:inherit;font-size:10px;letter-spacing:.14em;padding:6px 11px;cursor:pointer;
  background:rgba(8,18,36,.8);border:1px solid rgba(47,143,255,.35);color:var(--dim);
  transition:.15s;min-width:92px;text-transform:uppercase;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.chk:hover{border-color:var(--cyan);color:var(--cyan)}
.chk.on{background:linear-gradient(180deg,rgba(56,255,176,.35),rgba(10,80,55,.35));border-color:var(--green);color:#c9fff0;box-shadow:0 0 18px rgba(56,255,176,.35)}
.chk-mini{
  font-family:inherit;font-size:12px;letter-spacing:.06em;
  padding:6px 10px;cursor:pointer;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(47,143,255,.25);
  color:var(--dim);
  transition:.15s;
}
.chk-mini:hover{border-color:var(--danger);color:var(--danger);background:rgba(60,10,25,.5)}
.q-line.on .q-text{color:var(--green);text-decoration:line-through;text-decoration-color:rgba(56,255,176,.4)}

/* ---------- ceiling sub-steps ---------- */
.ceil-steps{
  margin:0 0 0 0;
  padding:6px 0 4px 22px;
  border-top:1px dashed rgba(47,143,255,.14);
}
.ceil-steps-head{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase;
  margin-bottom:6px;
}
.ceil-steps-head b{color:var(--cyan);font-weight:500}
.ceil-step{
  display:flex;align-items:flex-start;gap:11px;
  padding:4px 0;
  font-size:13.5px;color:var(--dim);
  line-height:1.5;
  transition:color .15s;
}
.ceil-step .step-chk{
  font-family:'Share Tech Mono',monospace;font-size:12px;
  width:22px;height:22px;min-width:22px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(47,143,255,.3);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;
  margin-top:1px;
}
.ceil-step .step-chk:hover{border-color:var(--cyan);color:var(--cyan)}
.ceil-step .step-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
  box-shadow:0 0 12px rgba(56,255,176,.3);
}
.ceil-step .step-text{flex:1}
.ceil-suspended{
  display:inline-block;margin-left:8px;
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px;letter-spacing:.14em;
  padding:1px 6px;
  color:var(--gold);
  border:1px solid rgba(255,207,92,.5);
  text-transform:uppercase;vertical-align:middle;
}
.ceil-step.on .step-text{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}

/* ---------- quest tree / graduation ---------- */
.qtree{
  margin:0 0 16px 0;
  padding:14px 16px;
  background:rgba(4,10,22,.65);
  border:1px solid rgba(47,143,255,.2);
}
.qtree-node{
  position:relative;
  padding:10px 0 10px 22px;
  border-left:2px solid rgba(47,143,255,.35);
  margin-left:6px;
}
.qtree-node:last-child{border-left-color:transparent}
.qtree-node::before{
  content:'';position:absolute;left:-6px;top:14px;
  width:10px;height:10px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px rgba(79,214,255,.8);
}
.qtree-node.origin{border-left-color:rgba(111,140,181,.3)}
.qtree-node.origin::before{background:var(--dim);box-shadow:none}
.qtree-node.current{border-left-color:rgba(255,207,92,.5)}
.qtree-node.current::before{background:var(--gold);box-shadow:0 0 10px rgba(255,207,92,.9)}
.qtree-date{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.qtree-name{font-size:14.5px;font-weight:600;color:#eaf6ff;margin-bottom:6px}
.qtree-detail{font-size:12.5px;color:var(--text);line-height:1.55;margin-bottom:3px}
.qtree-detail b{color:var(--dim);font-weight:400;letter-spacing:.12em;font-size:10.5px;text-transform:uppercase;margin-right:7px}
.qtree-action{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;padding:3px 8px;border:1px solid currentColor}
.qtree-action.extend{color:var(--green)}
.qtree-action.replace{color:var(--gold)}
.qtree-action.obsolete{color:var(--danger)}
.qtree-note{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:5px}

/* graduate mode radio cards */
.grad-modes{display:grid;grid-template-columns:1fr;gap:6px}
.grad-mode{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;border:1px solid rgba(47,143,255,.25);
  background:rgba(4,10,22,.65);cursor:pointer;transition:.15s;
  font-size:13px;
}
.grad-mode:hover{border-color:rgba(79,214,255,.5)}
.grad-mode input{margin-top:3px;flex-shrink:0;width:auto}
.grad-mode b{display:block;color:#eaf6ff;margin-bottom:2px;font-weight:600;letter-spacing:.06em}
.grad-mode span{display:block;color:var(--dim);font-size:12px;line-height:1.5}
.grad-mode:has(input:checked){border-color:var(--cyan);background:rgba(20,60,120,.3)}

/* ---------- lifestyle upgrades ---------- */
.life-panel{border-color:rgba(160,107,255,.4)}
.life-panel .panel-title{
  color:var(--purple);
  text-shadow:0 0 12px rgba(160,107,255,.55);
  border-color:rgba(160,107,255,.4);
  background:linear-gradient(90deg, rgba(160,107,255,.09), rgba(160,107,255,.01) 70%);
  box-shadow:0 0 14px rgba(160,107,255,.1), inset 0 0 24px rgba(160,107,255,.04);
}
.life-panel .panel-title::before{
  border-color:var(--purple);
  background:
    linear-gradient(var(--purple),var(--purple)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--purple),var(--purple)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(160,107,255,.22), transparent 72%);
  box-shadow:0 0 10px rgba(160,107,255,.55), inset 0 0 8px rgba(160,107,255,.18);
  filter:drop-shadow(0 0 4px rgba(160,107,255,.95));
}
.life-grid{display:grid;grid-template-columns:1fr;gap:8px}
.life-item{
  display:flex;align-items:center;gap:12px;padding:10px 13px;
  border:1px solid rgba(160,107,255,.25);background:rgba(15,8,28,.55);
  transition:.15s;
}
.life-item:hover{border-color:rgba(160,107,255,.5)}
.life-item.on{border-color:rgba(56,255,176,.45);background:rgba(10,30,25,.55)}
.life-item .life-name{flex:1;font-size:14.5px;color:var(--text)}
.life-item.on .life-name{color:var(--green)}
.life-check{
  font-family:inherit;font-size:11px;letter-spacing:.14em;padding:6px 12px;cursor:pointer;
  background:rgba(20,10,35,.8);border:1px solid rgba(160,107,255,.4);color:var(--purple);
  transition:.15s;min-width:96px;text-transform:uppercase;text-align:center;
}
.life-check:hover{border-color:var(--purple);color:#c9a9ff}
.life-check.on{background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));border-color:var(--green);color:#c9fff0}
.life-counter{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--purple)}
.life-counter b{color:#fff;font-size:17px}

.daily-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.daily-count{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim)}
.daily-count b{color:#fff;font-size:17px}
.daily-count .ok{color:var(--green)}

/* ---------- misc ---------- */
.empty{color:var(--dim);font-size:12px;font-style:italic;padding:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border:1px solid rgba(47,143,255,.18);background:rgba(6,14,28,.6);margin-bottom:6px;
  font-size:12.5px;
}
.item .meta{font-size:10px;color:var(--dim);letter-spacing:.1em}

/* dungeon inbox / cleared entries get extra breathing room */
.item.dungeon{
  padding:13px 15px;
  gap:16px;
  align-items:flex-start;
  margin-bottom:8px;
}
.item.dungeon .title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14.5px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:7px;
  flex-wrap:wrap;
  word-break:break-word;
}
.item.dungeon .meta .domain-badge{
  margin-left:0;
  margin-right:2px;
}
.item.dungeon .title .tag{
  flex-shrink:0;
  font-size:11.5px;
  padding:3px 8px;
}
.item.dungeon .meta{
  font-size:12px !important;
  letter-spacing:.04em !important;
  line-height:1.55;
  color:var(--dim);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px 8px;
}
.item.dungeon .meta > span{
  white-space:nowrap;
}
/* active dungeon panel uses the same row layout */
.dungeon-meta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px 8px;
}
.dungeon-meta-row > span{
  white-space:nowrap;
}
.item.dungeon .row{
  gap:9px;
  flex-shrink:0;
  padding-top:2px;
}
.dungeon-real{
  font-size:12.5px;
  color:var(--dim);
  font-style:italic;
  opacity:.62;
  letter-spacing:.03em;
  line-height:1.4;
}
.item.dungeon .dungeon-real{
  margin:-4px 0 7px 0;
}
.tag{font-family:'Share Tech Mono',monospace;font-size:10px;padding:2px 7px;border:1px solid currentColor}
.tag.t1{color:var(--green)}.tag.t2{color:var(--gold)}.tag.t3{color:var(--danger)}
.rank-E{color:#8fa6c4}.rank-D{color:#5fd0ff}.rank-C{color:#4f8dff}
.rank-B{color:#a06bff}.rank-A{color:#ffb347}.rank-S{color:#ff4d6d}

.warn{border-color:rgba(255,61,110,.5)}
.warn .panel-title{color:var(--danger);text-shadow:0 0 12px rgba(255,61,110,.5)}

/* ---------- developer mode ---------- */
.dev-banner{
  text-align:center;
  padding:9px 14px;
  margin:-4px 0 14px 0;
  border:1px dashed rgba(255,207,92,.6);
  background:linear-gradient(90deg, rgba(255,207,92,.08), rgba(255,207,92,.02) 80%);
  color:var(--gold);
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  box-shadow:0 0 20px rgba(255,207,92,.12);
}
.dev-panel{border-color:rgba(255,207,92,.4)}
.dev-panel .panel-title{
  color:var(--gold);
  text-shadow:0 0 12px rgba(255,207,92,.55);
  border-color:rgba(255,207,92,.4);
  background:linear-gradient(90deg, rgba(255,207,92,.09), rgba(255,207,92,.01) 70%);
}
.dev-panel .panel-title::before{
  border-color:var(--gold);
  background:
    linear-gradient(var(--gold),var(--gold)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--gold),var(--gold)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(255,207,92,.22), transparent 72%);
  box-shadow:0 0 10px rgba(255,207,92,.55), inset 0 0 8px rgba(255,207,92,.18);
  filter:drop-shadow(0 0 4px rgba(255,207,92,.95));
}
.dev-active{
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;letter-spacing:.14em;
  padding:11px 14px;margin-bottom:12px;
  border:1px dashed rgba(255,207,92,.6);
  background:rgba(255,207,92,.06);
  color:var(--gold);
  text-transform:uppercase;
  line-height:1.6;
}

/* ---------- missions ---------- */
.mission-panel{
  border-color:rgba(255,95,168,.4);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset;
}
.mission-panel .panel-title{
  color:var(--mission);
  text-shadow:0 0 12px rgba(255,95,168,.55);
  border-color:rgba(255,95,168,.4);
  background:linear-gradient(90deg, rgba(255,95,168,.09), rgba(255,95,168,.01) 70%);
  box-shadow:0 0 14px rgba(255,95,168,.1), inset 0 0 24px rgba(255,95,168,.04);
}
.mission-panel .panel-title::before{
  border-color:var(--mission);
  background:
    linear-gradient(var(--mission),var(--mission)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--mission),var(--mission)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(255,95,168,.22), transparent 72%);
  box-shadow:0 0 10px rgba(255,95,168,.55), inset 0 0 8px rgba(255,95,168,.18);
  filter:drop-shadow(0 0 4px rgba(255,95,168,.95));
}
.mission-name{
  font-size:22px;font-weight:700;color:#fff;
  letter-spacing:.05em;margin-bottom:10px;
  line-height:1.25;
  text-shadow:0 0 18px rgba(255,95,168,.5);
}
.mission-meta{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  margin-bottom:12px;padding-bottom:12px;
  border-bottom:1px solid rgba(255,95,168,.2);
}
.mission-bounty{
  font-family:'Share Tech Mono',monospace;
  font-size:14px;color:var(--gold);
  letter-spacing:.1em;
}
.mission-dates{
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;color:var(--dim);
  letter-spacing:.06em;margin-bottom:6px;
}
.mission-timeline{
  font-family:'Share Tech Mono',monospace;
  font-size:15px;color:var(--text);
  letter-spacing:.06em;margin-bottom:4px;
}
.mission-timeline b{color:var(--mission);font-weight:600}
.mission-section-label{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim);margin:18px 0 8px;
  padding-bottom:6px;
  border-bottom:1px dashed rgba(255,95,168,.25);
}
.mission-criterion{
  display:flex;align-items:flex-start;gap:12px;
  padding:9px 0;font-size:14.5px;color:var(--text);
  line-height:1.5;transition:color .15s;
}
.mission-criterion .crit-chk{
  font-family:'Share Tech Mono',monospace;font-size:14px;
  width:26px;height:26px;min-width:26px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(255,95,168,.35);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;margin-top:1px;
}
.mission-criterion .crit-chk:hover{border-color:var(--mission);color:var(--mission)}
.mission-criterion .crit-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
  box-shadow:0 0 12px rgba(56,255,176,.3);
}
.mission-criterion .crit-text{flex:1}
.mission-criterion.on .crit-text{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}
.mission-progress{
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;color:var(--dim);
  letter-spacing:.08em;margin-top:8px;
}
.mission-progress b{color:var(--green);font-weight:600}
.mission-field-value{
  font-size:13.5px;color:var(--text);
  line-height:1.7;white-space:pre-wrap;
  padding:10px 13px;
  background:rgba(4,10,22,.6);
  border-left:2px solid rgba(255,95,168,.4);
}

/* encounter / plan pairs */
.mission-pair{
  margin-bottom:12px;
  border:1px solid rgba(255,95,168,.22);
  background:rgba(4,10,22,.5);
  overflow:hidden;
}
.mission-pair:last-child{margin-bottom:0}
.mission-pair-enc,
.mission-pair-plan{
  padding:10px 13px;
}
.mission-pair-enc{
  border-bottom:1px dashed rgba(255,95,168,.2);
}
.mission-pair-label{
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px;letter-spacing:.2em;
  color:var(--dim);text-transform:uppercase;
  margin-bottom:5px;
}
.mission-pair-preview{
  flex:1;
  min-width:0;
  font-size:13.5px;
  color:#eaf6ff;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.02em;
  margin-bottom:0;
}
.mission-pair-enc .mission-pair-label{color:var(--mission)}
.mission-pair-plan .mission-pair-label{color:var(--cyan)}
.mission-pair-text{
  font-size:13.5px;color:var(--text);line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}
.mission-pair-text.empty{
  color:var(--dim);
  font-style:italic;
}

/* collapsible section header */
.encounters-toggle{
  display:flex;align-items:center;gap:10px;
  padding:10px 0 8px;
  margin:6px 0 8px;
  border-bottom:1px dashed rgba(255,95,168,.25);
  cursor:pointer;user-select:none;
  transition:.15s;
}
.encounters-toggle:hover .encounters-toggle-label{color:var(--mission)}
.encounters-toggle-label{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim);flex:1;
  transition:color .15s;
}
.encounters-toggle-meta{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--dim);
  letter-spacing:.06em;flex-shrink:0;
}
.encounters-toggle-chevron{
  color:var(--dim);font-size:13px;
  transition:transform .15s;flex-shrink:0;
  display:inline-block;line-height:1;
}
.encounters-toggle.open .encounters-toggle-chevron{transform:rotate(90deg)}
.encounters-body{display:none}
.encounters-body.open{display:block}

/* static field-note display */
.mission-pair-note-static{
  padding:6px 0;
}
.mission-pair-note-static:first-child{padding-top:0}
.mission-pair-note-static .note-label{margin-bottom:2px}
.mission-pair-note-static .note-body{
  font-size:13px;color:var(--text);line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
}
.mission-pair-note-static .note-body.empty{
  color:var(--dim);font-style:italic;
}

/* recon / field notes on encounter pairs */
.mission-pair-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:6px;
}
.mission-pair-head .mission-pair-label{
  margin-bottom:0;flex:1;
}
.mission-pair-badge{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:.16em;
  padding:1px 6px;text-transform:uppercase;
  flex-shrink:0;
}
.mission-pair-badge.planned{
  color:var(--dim);
  border:1px solid rgba(111,140,181,.45);
}
.mission-pair-badge.happened{
  color:var(--mission);
  border:1px solid rgba(255,95,168,.55);
  background:rgba(255,95,168,.08);
}
.mission-pair-x{
  background:transparent;border:none;
  color:var(--dim);font-size:13px;
  cursor:pointer;padding:0 4px;
  transition:.15s;flex-shrink:0;
}
.mission-pair-x:hover{color:var(--danger)}
.mission-pair textarea{
  min-height:44px;
  font-size:13.5px;
  background:rgba(4,10,22,.75);
  border:1px solid rgba(255,95,168,.2);
  padding:7px 10px;
}
.mission-pair textarea:focus{
  border-color:var(--mission);
  box-shadow:0 0 12px rgba(255,95,168,.25);
}
.mission-pair-outcome{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:10px 13px;
  border-top:1px dashed rgba(255,95,168,.2);
}
.outcome-chip{
  font-family:inherit;font-size:11px;letter-spacing:.14em;
  padding:5px 11px;cursor:pointer;text-transform:uppercase;
  background:rgba(8,18,36,.7);color:var(--dim);
  border:1px solid rgba(111,140,181,.35);
  transition:.15s;
}
.outcome-chip:hover{color:var(--cyan);border-color:var(--cyan)}
.outcome-chip.on.worked{color:var(--green);border-color:var(--green);background:rgba(56,255,176,.12)}
.outcome-chip.on.partial{color:var(--gold);border-color:var(--gold);background:rgba(255,207,92,.12)}
.outcome-chip.on.failed{color:var(--danger);border-color:var(--danger);background:rgba(255,61,110,.12)}
.mission-pair-notes{
  padding:12px 13px;
  border-top:1px dashed rgba(255,95,168,.2);
  display:flex;flex-direction:column;gap:10px;
}
.mission-pair-notes label{display:block}
.note-label{
  display:block;
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px;letter-spacing:.18em;
  color:var(--dim);text-transform:uppercase;
  margin-bottom:4px;
}
.mission-pair-actions{
  display:flex;justify-content:flex-end;gap:8px;
  padding:10px 13px 12px;
  border-top:1px dashed rgba(255,95,168,.15);
}
/* form builder for pairs and milestones */
.mission-pair-form,
.mission-milestone-form{
  position:relative;
  padding:12px 44px 12px 14px;
  margin-bottom:10px;
  border:1px solid rgba(255,95,168,.25);
  background:rgba(4,10,22,.5);
}
.mission-pair-form .pair-x,
.mission-milestone-form .ms-x{
  position:absolute;top:10px;right:10px;
  padding:4px 9px !important;
  font-size:11px !important;
}

/* milestone collapsibles in the active mission */
.mission-milestone{
  border:1px solid rgba(255,95,168,.22);
  background:rgba(4,10,22,.5);
  margin-bottom:8px;
}
.mission-milestone:last-child{margin-bottom:0}
.mission-milestone-head{
  display:flex;align-items:center;gap:12px;
  padding:11px 13px;cursor:pointer;user-select:none;
  transition:.15s;
}
.mission-milestone-head:hover{background:rgba(255,95,168,.05)}
.mission-milestone-chk{
  font-family:'Share Tech Mono',monospace;font-size:14px;
  width:26px;height:26px;min-width:26px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(255,95,168,.35);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;
}
.mission-milestone-chk:hover{border-color:var(--mission);color:var(--mission)}
.mission-milestone-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
  box-shadow:0 0 12px rgba(56,255,176,.3);
}
.mission-milestone-title{
  flex:1;font-size:14px;color:var(--text);
  font-weight:500;line-height:1.4;
  min-width:0;
}
.mission-milestone.done .mission-milestone-title{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}
.mission-milestone-progress{
  font-family:'Share Tech Mono',monospace;
  font-size:11.5px;color:var(--dim);
  letter-spacing:.06em;flex-shrink:0;
}
.mission-milestone-chevron{
  color:var(--dim);font-size:13px;
  transition:transform .15s;flex-shrink:0;
  line-height:1;
}
.mission-milestone.open .mission-milestone-chevron{
  transform:rotate(90deg);
}
.mission-milestone-body{
  display:none;
  padding:4px 13px 12px 51px;
  border-top:1px dashed rgba(255,95,168,.15);
}
.mission-milestone.open .mission-milestone-body{display:block}
.mission-milestone-step{
  display:flex;align-items:flex-start;gap:10px;
  padding:6px 0;font-size:13.5px;color:var(--text);
  line-height:1.5;transition:color .15s;
}
.mission-milestone-step .step-chk{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  width:20px;height:20px;min-width:20px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(255,95,168,.3);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;margin-top:1px;
}
.mission-milestone-step .step-chk:hover{border-color:var(--mission);color:var(--mission)}
.mission-milestone-step .step-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
}
.mission-milestone-step.on .step-text{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}
.mission-milestone-step .step-text{flex:1}

/* ---------- mission collapse ---------- */
.mission-collapse-head{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;user-select:none;
  margin-bottom:14px;
  transition:.15s;
}
.mission-collapse-head:hover .mission-name{color:var(--mission)}
.mission-collapse-head .mission-name{margin-bottom:0;transition:color .15s}
.mission-collapse-chevron{
  color:var(--dim);font-size:14px;
  transition:transform .15s;flex-shrink:0;
  display:inline-block;line-height:1;
}
.mission-panel:not(.collapsed) .mission-collapse-head .mission-collapse-chevron{
  transform:rotate(90deg);
}
.mission-body{display:block}
.mission-panel.collapsed .mission-body{display:none}
.mission-panel.collapsed .mission-collapse-head{margin-bottom:0}

.mission-form-collapse-head{cursor:pointer;user-select:none}
.mission-panel.collapsed .mission-form-collapse-head{margin-bottom:0}
.mission-panel.collapsed .mission-form-collapse-head .mission-collapse-chevron{transform:rotate(0deg)}
.mission-panel:not(.collapsed) .mission-form-collapse-head .mission-collapse-chevron{transform:rotate(90deg)}

/* ---------- generic collapsible section ---------- */
.mission-collapsible-section{margin-top:6px}
.mission-section-toggle{
  display:flex;align-items:center;gap:10px;
  padding:10px 0 8px;
  margin-bottom:8px;
  border-bottom:1px dashed rgba(255,95,168,.25);
  cursor:pointer;user-select:none;
  transition:.15s;
}
.mission-section-toggle:hover .mission-section-toggle-label{color:var(--mission)}
.mission-section-toggle-label{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim);flex:1;transition:color .15s;
}
.mission-section-toggle-meta{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:var(--dim);
  letter-spacing:.06em;flex-shrink:0;
}
.mission-section-toggle-chevron{
  color:var(--dim);font-size:13px;
  transition:transform .15s;flex-shrink:0;
  display:inline-block;line-height:1;
}
.mission-collapsible-section.open .mission-section-toggle-chevron{
  transform:rotate(90deg);
}
.mission-section-body{display:none}
.mission-collapsible-section.open .mission-section-body{display:block}

/* ---------- encounter collapse ---------- */
.mission-pair-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 13px;
  margin-bottom:0;
  cursor:pointer;user-select:none;
  transition:.15s;
  border-bottom:1px dashed rgba(255,95,168,.2);
}
.mission-pair-head:hover{background:rgba(255,95,168,.04)}
.mission-pair-head .mission-pair-label{margin-bottom:0;flex:1}
.mission-pair.collapsed .mission-pair-head{border-bottom:none}
.mission-pair-body{display:block}
.mission-pair.collapsed .mission-pair-body{display:none}
.mission-pair:not(.collapsed) .mission-pair-head .mission-collapse-chevron{
  transform:rotate(90deg);
}
.mission-ready{
  padding:12px 14px;margin:18px 0 8px;
  border:1px solid rgba(56,255,176,.5);
  background:linear-gradient(90deg, rgba(56,255,176,.08), rgba(56,255,176,.01) 80%);
  color:var(--green);
  font-family:'Share Tech Mono',monospace;
  font-size:13px;letter-spacing:.16em;
  text-align:center;text-transform:uppercase;
  box-shadow:0 0 20px rgba(56,255,176,.15);
}
.mission-log-item{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:11px 13px;margin-bottom:8px;
  border:1px solid rgba(255,95,168,.18);
  background:rgba(6,14,28,.55);
}
.mission-log-item.completed{border-color:rgba(56,255,176,.35)}
.mission-log-item.failed{border-color:rgba(255,61,110,.35)}
.mission-log-name{
  font-size:14px;font-weight:600;color:#eaf6ff;
  margin-bottom:5px;line-height:1.4;
}
.mission-log-name .tag{margin-right:6px}
.mission-log-meta{
  font-family:'Share Tech Mono',monospace;
  font-size:11.5px;color:var(--dim);
  letter-spacing:.04em;
}
.mission-log-delta{
  font-family:'Share Tech Mono',monospace;
  font-size:15px;font-weight:700;
  flex-shrink:0;white-space:nowrap;
}
.mission-log-delta.plus{color:var(--green)}
.mission-log-delta.minus{color:var(--danger)}
.mission-log-delta.zero{color:var(--dim)}

/* action rows */
.encounters-footer{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.mission-bottom-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}
@media(max-width:620px){
  .encounters-footer{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
    margin-top:12px;
  }
  .encounters-footer .btn{
    width:100%;
    justify-content:center;
    padding:10px 8px;
    font-size:10.5px;
    letter-spacing:.1em;
  }
  .mission-bottom-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:14px;
  }
  .mission-bottom-actions .btn{
    width:100%;
    justify-content:center;
    padding:10px 6px;
    font-size:11px;
    letter-spacing:.08em;
  }
  /* when there are 3 (or 5) buttons, the last spans full width */
  .mission-bottom-actions .btn:last-child:nth-child(odd){
    grid-column:1 / -1;
  }
}
.big-timer{font-family:'Share Tech Mono',monospace;font-size:30px;color:var(--danger);text-shadow:0 0 22px rgba(255,61,110,.7);letter-spacing:.06em}
.big-timer.ok{color:var(--cyan);text-shadow:0 0 22px rgba(79,214,255,.7)}

.hexstrip{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hex{width:15px;height:15px;background:rgba(20,40,70,.8);border:1px solid rgba(47,143,255,.2)}
.hex.g{background:linear-gradient(180deg,#38ffb0,#12a878);border-color:#38ffb0;box-shadow:0 0 8px rgba(56,255,176,.6)}
.hex.y{background:linear-gradient(180deg,#ffcf5c,#b8860b);border-color:#ffcf5c}
.hex.r{background:linear-gradient(180deg,#ff3d6e,#8a1230);border-color:#ff3d6e}
.hex.today{outline:1px solid #fff}

/* ---------- overlay / modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
  background:rgba(2,5,12,.9);backdrop-filter:blur(6px);padding:18px;overflow-y:auto;
}
.overlay.hidden{display:none}
.modal{
  width:100%;max-width:520px;position:relative;
  background:linear-gradient(160deg,rgba(10,24,48,.98),rgba(4,9,20,.98));
  border:1px solid rgba(79,214,255,.5);
    box-shadow: 0 0 0 1px rgba(0,0,0,.7) inset;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  padding:26px;max-height:88vh;overflow-y:auto;
}
.modal h2{font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);margin-bottom:16px;text-shadow:0 0 14px rgba(79,214,255,.5)}
.oath-title{font-size:26px;letter-spacing:.32em;color:#fff;text-align:center;text-shadow:0 0 34px rgba(79,214,255,.9);margin-bottom:8px}
.oath-sub{text-align:center;font-size:11px;letter-spacing:.24em;color:var(--cyan);margin-bottom:24px}
.oath-text{font-size:13px;line-height:2;color:var(--text);margin-bottom:22px;text-align:center}
.oath-text b{color:var(--cyan)}

/* ---------- toast ---------- */
#toasts{position:fixed;right:14px;bottom:14px;z-index:10001;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  background:linear-gradient(160deg,rgba(10,30,60,.97),rgba(4,10,22,.97));
  border:1px solid rgba(79,214,255,.6);color:var(--cyan);
  padding:11px 16px;font-size:12px;letter-spacing:.1em;
  box-shadow:0 0 28px rgba(79,214,255,.35);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  animation:tin .3s ease-out;max-width:320px;
}
.toast.gold{border-color:rgba(255,207,92,.7);color:var(--gold);box-shadow:0 0 28px rgba(255,207,92,.35)}
.toast.bad{border-color:rgba(255,61,110,.7);color:var(--danger);box-shadow:0 0 28px rgba(255,61,110,.35)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

footer{position:relative;z-index:2;text-align:center;font-size:10px;letter-spacing:.22em;color:#33465f;padding:26px 0 10px;text-transform:uppercase}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(5,12,24,.9)}
::-webkit-scrollbar-thumb{background:rgba(47,143,255,.35)}
::-webkit-scrollbar-thumb:hover{background:rgba(79,214,255,.6)}

.panel-title{font-size:12.5px;letter-spacing:.24em}
.tab{font-size:12.5px}
.tab .badge{font-size:10px}
.btn{font-size:12.5px}
.btn.small{font-size:11.5px}
label.fld span{font-size:11.5px}

.lvl-label{font-size:10.5px}
.lvl-num{font-size:38px}
.rank-badge{font-size:32px;width:72px;height:72px}
.stat-top{font-size:14px}
.stat-val{font-size:18px}
.stat-val small{font-size:12.5px}
.stat-desc{font-size:13px !important;line-height:1.6}
.stat-desc.open{max-height:200px}
.bar{height:9px}
.pts{font-size:30px}
.q-stat{font-size:12.5px}

/* ---------- mobile HUD: keep level + rank on the right ---------- */
@media(max-width:620px){
  .hud{flex-wrap:nowrap;gap:12px;align-items:center}
  .hud-left{flex:1 1 auto;min-width:0}
  .hud-right{flex:0 0 auto;gap:10px}
  .hud-name{font-size:17px;letter-spacing:.14em;line-height:1.2}
    .hud-name small{font-size:10.5px;letter-spacing:.04em;line-height:1.5;white-space:normal}
    .hud-title{font-size:9.5px;padding:1px 7px;margin-left:8px;letter-spacing:.14em}
  .lvl-label{font-size:9px;letter-spacing:.2em}
  .lvl-num{font-size:30px}
  .rank-badge{width:56px;height:56px;font-size:24px}

  /* quest action row: phase on the left, buttons on the right */
    .q-actions{
    justify-content:flex-start !important;
    align-items:center;
    flex-wrap:nowrap;
    gap:8px;
  }
  .q-actions .q-phase{
    flex-shrink:0;
  }
  /* push the button group to the right edge */
  .q-actions button:first-of-type{
    margin-left:auto;
  }
  .q-actions .btn.small{
    flex:0 0 auto;
  }
}

/* ---------- mobile performance diet ---------- */
@media(max-width:900px){
  /* fixed multi-gradient background repaints during scroll on iOS */
  body::before{ transform: translateZ(0); }

  .panel-title{ box-shadow:none; text-shadow:0 0 6px rgba(79,214,255,.4); }
  .panel-title::before{ filter:none; }          /* drop-shadow is a per-paint raster */
  .warn .panel-title::before{ filter:none; }
  .life-panel .panel-title::before{ filter:none; }
  .dev-panel .panel-title::before{ filter:none; }
  .mission-panel .panel-title::before{ filter:none; }

  .rank-badge{ animation:none; }
  .stat-desc{ transition:none; }
  .tab, .btn, .chk, .life-check, .chk-mini{ transition:none; }
  .bar-fill{ transition:width .2s ease; }
}
