      <div class="meta">${t.expiresAt ? 'expires '+fmtDate(t.expiresAt) : 'permanent'}</div>
    </div>`).join('') || `<div class="empty">No titles.</div>`;

  return `
    <div class="panel">
      <div class="panel-title">Hunter Profile</div>
      <label class="fld"><span>Name</span><input id="pname" value="${esc(state.playerName)}"></label>
      <div class="row">
              <div class="row">
        <button class="btn small" data-act="save-name">Save Name</button>
        <span class="meta" style="color:var(--dim);font-size:11px">System Level ${getSystemLevel()} · ${state.systemTokens} upgrade token(s)</span>
      </div>
      <div class="meta" style="color:var(--dim);font-size:11px;margin-top:8px;line-height:1.7">
        Instant edit tokens: <b style="color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:13px">${state.editTokens}</b>
        — each allows one edit outside the weekly window.
      </div>
    </div>

    <div class="panel ${penValid?'':'warn'}">
      <div class="panel-title">Penalty Pool ${penValid?'':'— INCOMPLETE'}</div>
      <div class="meta" style="color:var(--dim);font-size:10.5px;margin-bottom:12px">
        Requirement: at least <b>5 penalties</b> total, and at least <b>1 in each tier</b>.
        Currently ${state.penalties.length} total.
      </div>
      ${pen}
      <div class="grid2" style="margin-top:6px">
        <input id="penText" placeholder="New penalty...">
        <div class="row">
          <select id="penTier" style="flex:1">
            <option value="1">Tier 1 — easiest</option>
            <option value="2" selected>Tier 2 — medium</option>
            <option value="3">Tier 3 — hardest</option>
          </select>
          <button class="btn small" data-act="add-penalty">Add</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Custom Rewards (50% slot)</div>
      ${rewards}
      <div class="row" style="margin-top:10px">
        <input id="rwText" placeholder="New reward..." style="flex:1;min-width:180px">
        <button class="btn small" data-act="add-reward">Add</button>
      </div>
      <div class="meta" style="color:var(--dim);font-size:10.5px;margin-top:10px">
        Drop table: 50% custom · 20% key (E/D) · 15% penalty skip · 10% +1 point &amp; key (C/B) ·
        4% key (A/S) · 1% system upgrade token.
      </div>
    </div>

            <div class="panel life-panel">
      <div class="panel-title">Lifestyle Upgrades</div>
      <div class="meta" style="color:var(--dim);font-size:10.5px;margin-bottom:12px">
        Passive maintenance habits — not attached to any stat. Complete them daily to shift your reward table
        toward rarer drops and reduce the tier of penalties from missed quests.
                ${isWeeklyWindow()
          ? '<br><span style="color:var(--cyan)">Editing unlocked — Sunday window active.</span>'
          : (state.editTokens > 0
              ? `<br><span style="color:var(--gold)">Editing locked — ${state.editTokens} edit token${state.editTokens===1?'':'s'} available to spend.</span>`
              : '<br><span style="color:var(--gold)">Editing locked — unlocks Sunday 19:00–24:00.</span>')}
      </div>
      ${lifestyleMgmt}
      <div class="row" style="margin-top:10px">
        <input id="lifeText" placeholder="New lifestyle upgrade..." style="flex:1;min-width:180px" ${canEditLife ? '' : 'disabled'}>
        <button class="btn small" data-act="add-lifestyle" ${canEditLife ? '' : 'disabled'} title="${canEditLife ? 'Add' : 'Editing unlocks Sunday 19:00–24:00'}">Add</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Titles</div>
      ${titles}
      <div class="grid2" style="margin-top:10px">
        <input id="ttName" placeholder="Title name">
        <input id="ttDesc" placeholder="Requirement / description">
      </div>
      <button class="btn small" style="margin-top:8px" data-act="add-title">Add Title (award manually)</button>
    </div>

    <div class="panel">
      <div class="panel-title">Weekly Reset</div>
            <div class="meta" style="color:var(--dim);font-size:11px;line-height:1.8;margin-bottom:10px">
        Runs automatically Sunday 19:00–24:00. Window opens in-page; you can also trigger it manually here.
        ${hasFullWeekOfData()
          ? '<br>Status: <b style="color:var(--cyan)">full week of data — auto-reset active.</b>'
          : '<br>Status: <b style="color:var(--gold)">first partial week — auto-reset will skip this Sunday.</b>'}
        <br>Failures this week: ${
          Object.entries(state.weekFails).map(([id,n]) => {
            const q = state.quests.find(x => x.id === id);
            return q ? `${esc(q.name||'unnamed')}: ${n}` : '';
          }).filter(Boolean).join(' · ') || 'none recorded'
        }
      </div>
      <button class="btn small" data-act="weekly">Open Weekly Review</button>
    </div>

        <div class="panel">
      <div class="panel-title">Data</div>
      <div class="row">
        <button class="btn" data-act="export">Export Data</button>
        <button class="btn" data-act="import">Import Data</button>
        <button class="btn danger" data-act="wipe">Erase Everything</button>
      </div>
      <div class="meta" style="color:var(--dim);font-size:10.5px;margin-top:10px">
        Everything is stored locally in this browser. Export regularly — clearing your browser data
        will erase your progress permanently.
      </div>
    </div>

    <div class="panel dev-panel">
      <div class="panel-title">Developer Mode</div>
      ${state.devMode ? `
        <div class="dev-active">
          Developer mode is active.<br>
          Points and penalties are disabled. Edits bypass all locks.
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn danger" data-act="deactivate-dev">Deactivate</button>
        </div>
      ` : `
        <div class="meta" style="color:var(--dim);font-size:11px;line-height:1.8;margin-bottom:12px">
          Grants unrestricted editing and disables point/penalty awards. Intended for testing and setup only.
          Enter the passphrase to proceed.
        </div>
        <label class="fld"><span>Passphrase</span>
          <input id="devPass" type="password" placeholder="…" autocomplete="off">
        </label>
        <div class="row" style="justify-content:flex-end">
          <button class="btn gold" data-act="activate-dev">Activate Developer Mode</button>
        </div>
      `}
    </div>`;
}

/* =========================================================
   TIMERS
   ========================================================= */
function updateTimers(){
  const p = state.pendingPenalty;
  const pEl = document.querySelector('[data-timer="penalty"]');
  if (pEl && p && !p.done){
    const ms = new Date(p.deadline).getTime() - Date.now();
    pEl.textContent = fmtDuration(ms);
    pEl.classList.toggle('ok', ms > 3*3600*1000);
  }
  const a = state.dungeons.active;
  const dEl = document.querySelector('[data-timer="dungeon"]');
  if (dEl && a){
    const ms = new Date(a.deadline).getTime() - Date.now();
    dEl.textContent = fmtDuration(ms);
    dEl.classList.toggle('ok', ms > 24*3600*1000);
  }
}
setInterval(() => { tick(); updateTimers(); }, 1000);

/* =========================================================
   MODAL
   ========================================================= */
function openModal(html){
  const m = $('#modal');
  m.innerHTML = `<div class="modal">${html}</div>`;
  m.classList.remove('hidden');
}
function closeModal(){
  const m = $('#modal');
  m.classList.add('hidden');
  m.innerHTML = '';
}

/* =========================================================
   ACTIONS
   ========================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch(act){
        case 'tab':
      activeTab = el.dataset.tab;
      render();
      break;

    case 'toggle-stat': {
      const k = el.dataset.stat;
      if (expandedStats.has(k)) expandedStats.delete(k);
      else expandedStats.add(k);
      render();
      break;
    }
    case 'close-modal':
      closeModal();
      break;

                    case 'toggle': {
      const id = el.dataset.id, kind = el.dataset.kind;
      const q = state.quests.find(x => x.id === id);
      const map = kind === 'floor' ? state.today.floor : state.today.ceil;
      const isRepeatable = kind === 'ceil' && q && q.ceilingRepeatable;

      if (isRepeatable){
        const cur = map[id];
        const n = typeof cur === 'number' ? cur : (cur ? 1 : 0);
        map[id] = n + 1;
      } else {
        map[id] = !map[id];
      }
      if (kind === 'ceil' && map[id]) state.today.floor[id] = true; // ceiling implies floor

      // checkDailyAwards() owns both the award and the refund now —
      // ceiling points are conditional on floor state.
      checkDailyAwards();
      save(); render();
      break;
    }

            case 'dec-ceil': {
      const id = el.dataset.id;
      const cur = state.today.ceil[id];
      const n = typeof cur === 'number' ? cur : (cur ? 1 : 0);
      state.today.ceil[id] = n <= 1 ? 0 : n - 1;
      checkDailyAwards();
      save(); render();
      break;
    }
    case 'toggle-ceil-step': {
      const qid = el.dataset.qid, sid = el.dataset.sid;
      const q = state.quests.find(x => x.id === qid);
      if (!q) break;
      const step = (q.ceilingSteps || []).find(s => s.id === sid);
      if (!step) break;
      if (!state.today.ceilSteps) state.today.ceilSteps = {};
      if (!state.today.ceilSteps[qid]) state.today.ceilSteps[qid] = {};
      const cur = state.today.ceilSteps[qid][sid];
      if (step.repeatable){
        const n = typeof cur === 'number' ? cur : (cur ? 1 : 0);
        state.today.ceilSteps[qid][sid] = n + 1;
      } else {
        state.today.ceilSteps[qid][sid] = !cur;
      }
      save(); render();
      break;
    }

    case 'dec-ceil-step': {
      const qid = el.dataset.qid, sid = el.dataset.sid;
      if (!state.today.ceilSteps || !state.today.ceilSteps[qid]) break;
      const cur = state.today.ceilSteps[qid][sid];
      const n = typeof cur === 'number' ? cur : (cur ? 1 : 0);
      state.today.ceilSteps[qid][sid] = n <= 1 ? 0 : n - 1;
      save(); render();
      break;
    }

                case 'edit-quest': {
      if (!canEditNow()){
        toast('Quest editing locked — Sunday 19:00–24:00 only.', 'bad');
        break;
      }
      const q = state.quests.find(x => x.id === el.dataset.id);
      if (!q) break;
      openModal(`
        <h2>Edit Quest — ${STAT_META[q.stat].label}</h2>
        <label class="fld"><span>Quest name</span><input id="eqName" value="${esc(q.name)}"></label>
        <label class="fld"><span>Floor — absolute minimum that counts</span><input id="eqFloor" value="${esc(q.floor)}"></label>
                                                <label class="fld"><span>Ceiling — ideal outcome</span><input id="eqCeil" value="${esc(q.ceiling)}"></label>
        <label style="display:flex;align-items:center;gap:10px;margin:0 0 12px 0;font-size:12.5px;color:var(--text);cursor:pointer">
          <input type="checkbox" id="eqCeilRepeatable" ${q.ceilingRepeatable ? 'checked' : ''} style="width:auto">
          <span>Repeatable ceiling — tracks a count, but awards the point only once</span>
        </label>
        <label class="fld"><span>Ceiling Steps (one per line — optional)</span>
          <textarea id="eqSteps" placeholder="[r] Drink a glass of water&#10;Finish the report&#10;— prefix a line with [r] to make it repeatable">${(q.ceilingSteps||[]).map(s => (s.repeatable ? '[r] ' : '') + s.text).join('\n')}</textarea>
        </label>
        <label class="fld"><span>Quest Phase</span>
          <div style="padding:9px 11px;background:rgba(4,10,22,.85);border:1px solid rgba(47,143,255,.3);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:15px">PHASE ${q.phase ?? 1}</div>
        </label>
                <div class="meta" style="color:var(--dim);font-size:10.5px;margin-bottom:14px">
          Phase is adjusted automatically by the weekly reset. Quests must reflect effort you control — never outcomes.
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn ghost" data-act="close-modal">Cancel</button>
          <button class="btn" data-act="save-quest" data-id="${q.id}">Save</button>
        </div>
      `);
      break;
    }

                        case 'save-quest': {
      if (!consumeEditToken()){
        toast('Quest editing locked — Sunday 19:00–24:00 only. Earn an edit token to bypass.', 'bad');
        break;
      }
      const q = state.quests.find(x => x.id === el.dataset.id);
      if (!q) break;
                  q.name = $('#eqName').value.trim();
      q.floor = $('#eqFloor').value.trim();
            q.ceiling = $('#eqCeil').value.trim();
      q.ceilingRepeatable = !!$('#eqCeilRepeatable').checked;
      // Convert today's ceiling tick to the right type if the flag flipped.
      if (q.ceilingRepeatable && state.today.ceil[q.id] === true) state.today.ceil[q.id] = 1;
      if (!q.ceilingRepeatable && typeof state.today.ceil[q.id] === 'number') state.today.ceil[q.id] = state.today.ceil[q.id] > 0;

      const stepLines = $('#eqSteps').value.split('\n').map(s => s.trim()).filter(Boolean);
      const oldSteps = q.ceilingSteps || [];
      q.ceilingSteps = stepLines.map((line, i) => {
        let text = line;
        let repeatable = false;
        const m = line.match(/^\[r\]\s*(.+)$/i);
        if (m){ repeatable = true; text = m[1].trim(); }
        const old = oldSteps[i];
        const sameAsOld = old && old.text === text;
        return { id: sameAsOld ? old.id : uid(), text, repeatable };
      });
      if (state.today.ceilSteps){
        const liveIds = new Set(q.ceilingSteps.map(s => s.id));
        const ticks = state.today.ceilSteps[q.id] || {};
        Object.keys(ticks).forEach(sid => { if (!liveIds.has(sid)) delete ticks[sid]; });
      }
      save(); closeModal(); render();
      break;
    }

    case 'view-tree': {
      const q = state.quests.find(x => x.id === el.dataset.id);
      if (!q) break;
      openTreeModal(q);
      break;
    }

                case 'save-graduation': {
      if (!consumeEditToken()){
        toast('Graduation locked — Sunday 19:00–24:00 only. Earn an edit token to bypass.', 'bad');
        break;
      }
      const q = state.quests.find(x => x.id === el.dataset.id);
      if (!q) break;
      const mode = (document.querySelector('input[name="gradMode"]:checked') || {}).value || 'extend';
      const newName = $('#gradName').value.trim();
      const newFloor = $('#gradFloor').value.trim();
      const newCeil = $('#gradCeil').value.trim();
      const note = $('#gradNote').value.trim();

      if (!newFloor){
        toast('New floor is required to graduate.', 'bad');
        break;
      }

      q.history.push({
        date: new Date().toISOString(),
        name: q.name,
        floor: q.floor,
        ceiling: q.ceiling,
        action: mode,
        note
      });

      q.name = newName || q.name;
      q.floor = newFloor;
      q.ceiling = newCeil;

      save(); closeModal(); render();
      toast('Quest graduated — ' + mode.toUpperCase(), 'gold');
      break;
    }

        case 'assign': {
      if (state.unassigned <= 0) break;
      state.unassigned -= 1;
      state.stats[el.dataset.stat] += 1;
      save(); render();
      break;
    }

    case 'distribute-points':
      openDistributeModal();
      break;

    case 'apply-distribution': {
      const inputs = document.querySelectorAll('[data-dist]');
      let total = 0;
      const alloc = {};
      inputs.forEach(i => {
        const v = Math.max(0, parseInt(i.value, 10) || 0);
        if (v > 0) alloc[i.dataset.dist] = v;
        total += v;
      });
      if (total === 0){
        toast('Allocate at least 1 point.', 'bad');
        break;
      }
      if (total > state.unassigned){
        toast('Allocation exceeds your pool.', 'bad');
        break;
      }
      Object.entries(alloc).forEach(([k, v]) => { state.stats[k] += v; });
      state.unassigned -= total;
      save(); closeModal(); render();
      toast(`Distributed ${total} point${total === 1 ? '' : 's'}`, 'gold');
      break;
    }

        case 'activate-dev': {
      const input = $('#devPass');
      if (!input) break;
      if (input.value.trim().toLowerCase() !== DEV_PASSWORD.toLowerCase()){
        toast('Incorrect passphrase.', 'bad');
        break;
      }
      state.devMode = true;
      save(); render();
      toast('DEVELOPER MODE ACTIVE — points and penalties disabled', 'gold');
      break;
    }

    case 'deactivate-dev':
      state.devMode = false;
      save(); render();
      toast('Developer mode off. Everything counts again.');
      break;

            case 'start-mission': {
      const name = $('#msName').value.trim();
      const rank = $('#msRank').value;
      const c1 = $('#msCrit1').value.trim();
      const c2 = $('#msCrit2').value.trim();
      const c3 = $('#msCrit3').value.trim();
      const encounter = $('#msEncounter').value.trim();
      const plan = $('#msPlan').value.trim();
      const mode = (document.querySelector('input[name="msMode"]:checked') || {}).value || 'now';

      if (!name){ toast('Mission name is required.', 'bad'); break; }
      if (!c1 || !c2 || !c3){ toast('All 3 success criteria are required.', 'bad'); break; }
      if (!MISSION_BOUNTY[rank]){ toast('Invalid rank.', 'bad'); break; }

      const base = {
        id: uid(),
        name, rank,
        bounty: MISSION_BOUNTY[rank],
        criteria: [
          {id: uid(), text: c1, done: false},
          {id: uid(), text: c2, done: false},
          {id: uid(), text: c3, done: false}
        ],
        encounter, plan
      };

      if (mode === 'now'){
        if (state.missions.active){
          toast('You already have an active mission.', 'bad');
          break;
        }
        const deadlineStr = $('#msDeadline').value;
        if (!deadlineStr){ toast('Deadline is required.', 'bad'); break; }
        const deadline = new Date(deadlineStr + 'T23:59:59');
        const minDeadline = new Date(Date.now() + MISSION_MIN_DAYS * 86400000);
        if (deadline.getTime() < minDeadline.getTime()){
          toast(`Deadline must be at least ${MISSION_MIN_DAYS} days from now.`, 'bad');
          break;
        }
        state.missions.active = Object.assign(base, {
          startedAt: new Date().toISOString(),
          deadline: deadline.toISOString(),
          presumedDuration: null
        });
        save(); render();
        toast(`MISSION STARTED — ${rank}-RANK`, 'gold');
      } else {
        const durRaw = parseInt($('#msDuration').value, 10);
        if (!durRaw || durRaw < MISSION_MIN_DAYS){
          toast(`Presumed duration must be at least ${MISSION_MIN_DAYS} days.`, 'bad');
          break;
        }
        state.missions.backlog.push(Object.assign(base, {
          presumedDuration: durRaw,
          storedAt: new Date().toISOString()
        }));
        save(); render();
        toast(`MISSION STORED — ${rank}-RANK (not yet started)`, 'gold');
      }
      break;
    }

    case 'mission-mode': {
      const mode = el.value;
      const dW = document.getElementById('msDeadlineWrap');
      const uW = document.getElementById('msDurationWrap');
      if (dW) dW.style.display = (mode === 'now') ? '' : 'none';
      if (uW) uW.style.display = (mode === 'later') ? '' : 'none';
      break;
    }

    case 'launch-backlog': {
      if (state.missions.active){
        toast('Finish or abandon your current mission first.', 'bad');
        break;
      }
      const idx = state.missions.backlog.findIndex(m => m.id === el.dataset.id);
      if (idx === -1) break;
      const m = state.missions.backlog.splice(idx, 1)[0];
      const deadline = new Date(Date.now() + m.presumedDuration * 86400000);
      m.startedAt = new Date().toISOString();
      m.deadline = deadline.toISOString();
      state.missions.active = m;
      save(); render();
      toast(`MISSION LAUNCHED — ${m.rank}-RANK`, 'gold');
      break;
    }

    case 'del-backlog-mission': {
      const idx = state.missions.backlog.findIndex(m => m.id === el.dataset.id);
      if (idx === -1) break;
      if (!confirm('Remove this stored mission? It was never started — no penalty either way.')) break;
      state.missions.backlog.splice(idx, 1);
      save(); render();
      toast('Stored mission removed.');
      break;
    }

    case 'hold-mission': {
      const m = state.missions.active;
      if (!m) break;
      if (!confirm('Return this mission to the backlog? The deadline resets from a fresh start when you re-launch it.')) break;
      const durDefault = m.presumedDuration || Math.max(MISSION_MIN_DAYS, Math.ceil((new Date(m.deadline) - new Date(m.startedAt)) / 86400000));
      state.missions.backlog.push({
        id: m.id,
        name: m.name,
        rank: m.rank,
        bounty: m.bounty,
        criteria: m.criteria.map(c => ({...c, done: false})),
        encounter: m.encounter,
        plan: m.plan,
        presumedDuration: durDefault,
        storedAt: new Date().toISOString()
      });
      state.missions.active = null;
      save(); render();
      toast('Mission returned to backlog.');
      break;
    }

    case 'toggle-criterion': {
      const m = state.missions.active;
      if (!m) break;
      const c = m.criteria.find(x => x.id === el.dataset.id);
      if (!c) break;
      c.done = !c.done;
      save(); render();
      break;
    }

    case 'abandon-mission': {
      const m = state.missions.active;
      if (!m) break;
      if (!confirm('Abandon this mission? No points lost, no points gained. The slot frees up.')) break;
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'abandoned', delta: 0});
      state.missions.active = null;
      save(); render();
      toast('Mission abandoned.');
      break;
    }

    case 'finish-mission': {
      const m = state.missions.active;
      if (!m) break;
      const done = m.criteria.filter(c => c.done).length;
      if (done !== m.criteria.length){
        toast('All criteria must be met before finishing.', 'bad');
        break;
      }
      if (state.devMode){
        state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: 0});
        state.missions.active = null;
        save(); render();
        toast('DEV MODE — mission closed, no points awarded.');
        break;
      }
      state.unassigned += m.bounty;
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: m.bounty});
      state.missions.active = null;
      save(); render();
      openModal(`
        <h2>Mission Complete</h2>
        <div style="text-align:center;padding:10px 0 20px">
          <div style="font-size:16px;font-weight:700;margin-bottom:14px">
            <span class="tag rank-${m.rank}" style="font-size:13px">${m.rank}</span>
            ${esc(m.name)}
          </div>
          <div style="font-size:11px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px">Bounty Paid</div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(255,207,92,.7)">+${m.bounty} STAT POINTS</div>
          <div style="font-size:12px;color:var(--dim);margin-top:10px">Assign them in the Status tab.</div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn" data-act="close-modal">Acknowledge</button>
        </div>
      `);
      break;
    }

    case 'claim-reward':
      claimReward();
      break;

    case 'complete-penalty':
      state.pendingPenalty = null;
      save(); render();
      toast('Penalty cleared. The System acknowledges.');
      break;

    case 'add-penalty': {
      const t = $('#penText').value.trim();
      const tier = parseInt($('#penTier').value, 10);
      if (!t) break;
      state.penalties.push({id:uid(), tier, text:t});
      save(); render();
      break;
    }
    case 'del-penalty':
      state.penalties = state.penalties.filter(p => p.id !== el.dataset.id);
      save(); render();
      break;

    case 'add-reward': {
      const t = $('#rwText').value.trim();
      if (!t) break;
      state.rewards.push({id:uid(), text:t});
      save(); render();
      break;
    }
        case 'del-reward':
      state.rewards = state.rewards.filter(r => r.id !== el.dataset.id);
      save(); render();
      break;

    case 'toggle-lifestyle': {
      if (!state.today.lifestyle) state.today.lifestyle = {};
      const id = el.dataset.id;
      state.today.lifestyle[id] = !state.today.lifestyle[id];
      save(); render();
      break;
    }
                case 'add-lifestyle': {
      if (!consumeEditToken()){
        toast('Lifestyle editing locked — Sunday 19:00–24:00 only. Earn an edit token to bypass.', 'bad');
        break;
      }
      const t = $('#lifeText').value.trim();
      if (!t) break;
      state.lifestyle.push({id: uid(), name: t});
      save(); render();
      break;
    }
                case 'del-lifestyle':
      if (!consumeEditToken()){
        toast('Lifestyle editing locked — Sunday 19:00–24:00 only. Earn an edit token to bypass.', 'bad');
        break;
      }
      state.lifestyle = state.lifestyle.filter(l => l.id !== el.dataset.id);
      if (state.today.lifestyle) delete state.today.lifestyle[el.dataset.id];
      save(); render();
      break;

    case 'add-title': {
      const n = $('#ttName').value.trim();
      const d = $('#ttDesc').value.trim();
      if (!n) break;
      state.titles.push({id:uid(), name:n, desc:d, custom:true, expiresAt:null});
      save(); render();
      break;
    }

    case 'save-name':
      state.playerName = ($('#pname').value.trim() || 'HUNTER');
      save(); render();
      break;

        case 'add-dungeon': {
      const name = $('#dnName').value.trim();
      const real = $('#dnReal').value.trim();
      const rank = $('#dnRank').value;
      const raw = $('#dnTasks').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!name || !raw.length) return toast('Name and at least one objective required.', 'bad');
      state.dungeons.inbox.push({
        id: uid(), name, real, rank,
        tasks: raw.map(t => ({id:uid(), text:t, done:false})),
        createdAt: new Date().toISOString()
      });
      save(); render();
      toast('Dungeon registered in inbox.');
      break;
    }
    case 'del-dungeon':
      state.dungeons.inbox = state.dungeons.inbox.filter(x => x.id !== el.dataset.id);
      save(); render();
      break;

    case 'open-dungeon':
      openDungeon(el.dataset.id);
      break;

    case 'toggle-task':
      toggleTask(el.dataset.id);
      break;

    case 'abandon-dungeon':
      abandonDungeon();
      break;

    case 'weekly':
      openWeeklyReview();
      break;

    case 'apply-weekly':
      applyWeekly();
      break;

    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `arise-system-${localDateStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Export complete.');
      break;
    }

    case 'import':
      $('#importFile').click();
      break;

    case 'wipe': {
      if (!confirm('This erases EVERYTHING permanently. Are you certain?')) break;
      if (!confirm('Absolutely certain? There is no recovery.')) break;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
      break;
    }
  }
});

/* file import */
document.addEventListener('change', (e) => {
  if (e.target.id !== 'importFile') return;
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      state = migrate(data);
      save(); render();
      toast('Data imported successfully.', 'gold');
    } catch(err){
      toast('Import failed — invalid file.', 'bad');
    }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* =========================================================
   INIT
   ========================================================= */
function showOath(){
  openModal(`
    <div class="oath-title">ARISE</div>
    <div class="oath-sub">SYSTEM INITIALIZATION</div>
    <div class="oath-text">
      You have been selected as a <b>Player</b>.<br>
      Daily quests have been generated.<br>
      Failure to comply will result in a <b>penalty</b>.<br><br>
      <span style="color:var(--dim);font-size:12px;line-height:1.9">
        The first rule of this System is that you do not speak of this System.<br>
        Once you begin, you do not quit. You may only stop —
        and remain, indefinitely, at whatever level you stopped.
      </span>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-act="accept-oath" id="oathBtn">I Accept</button>
    </div>
  `);
  document.getElementById('oathBtn').addEventListener('click', () => {
    state.oathTaken = true;
    save(); closeModal(); render();
    toast('Welcome, Player.', 'gold');
  });
}

function init(){
  const loaded = load();
  if (loaded) state = loaded;

  tick();
  render();

  if (!state.oathTaken) showOath();
  else tick();
}

init();
</script>
