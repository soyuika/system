<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARISE // SYSTEM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='50%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%234fd6ff'/%3E%3Cstop offset='100%25' stop-color='%230a1230'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='%2304060d'/%3E%3Cpolygon points='32,6 56,20 56,44 32,58 8,44 8,20' fill='url(%23g)' stroke='%234fd6ff' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='bold' fill='%2304060d' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#04060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060d;
  --panel-a:rgba(10,22,45,.92);
  --panel-b:rgba(5,10,22,.92);
  --line:rgba(47,143,255,.35);
  --line-hi:rgba(79,214,255,.85);
  --cyan:#4fd6ff;
  --blue:#2f7fff;
  --text:#cfe6ff;
  --dim:#6f8cb5;
  --danger:#ff3d6e;
  --gold:#ffcf5c;
  --green:#38ffb0;
    --purple:#a06bff;
  --mission:#ff5fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Chakra Petch',system-ui,-apple-system,sans-serif;
  font-weight:400;
  letter-spacing:.02em;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg,
      var(--bg) 0%,
      rgba(4,6,13,.85) 6%,
      rgba(4,6,13,.35) 14%,
      rgba(4,6,13,0) 22%,
      rgba(4,6,13,0) 66%,
      rgba(4,6,13,.45) 82%,
      rgba(4,6,13,.92) 94%,
      var(--bg) 100%),
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(30,110,255,.20), transparent 65%),
    radial-gradient(ellipse 60% 40% at 100% 105%, rgba(0,200,255,.09), transparent 60%),
    linear-gradient(rgba(47,143,255,.05) 1px, transparent 1px) 0 0/100% 44px,
    linear-gradient(90deg, rgba(47,143,255,.05) 1px, transparent 1px) 0 0/44px 100%;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,20,60,.16) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode:overlay;opacity:.5;
  animation:scan 9s linear infinite;
}
@keyframes scan{from{background-position-y:0}to{background-position-y:100px}}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:18px 14px 40px}

/* ---------- panels ---------- */
.panel{
  position:relative;
  background:linear-gradient(160deg,var(--panel-a),var(--panel-b));
  border:1px solid var(--line);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.6) inset,
    0 0 26px rgba(79,214,255,.12),
    0 0 60px rgba(30,110,255,.07),
    0 6px 30px rgba(0,0,0,.55);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  padding:16px 18px;
  margin-bottom:14px;
}
.panel::before{
  content:'';position:absolute;top:0;left:14px;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-hi),transparent);opacity:.75;
}
.panel-title{
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);
  margin:0 0 14px 0;display:flex;align-items:center;gap:12px;
  padding:9px 14px;
  border:1px solid rgba(79,214,255,.32);
  background:linear-gradient(90deg, rgba(79,214,255,.07), rgba(79,214,255,.01) 70%);
  text-shadow:0 0 12px rgba(79,214,255,.6);
  box-shadow:0 0 14px rgba(79,214,255,.08), inset 0 0 24px rgba(79,214,255,.03);
}
.panel-title::before{
  content:'';
  display:block;
  width:22px;height:22px;flex-shrink:0;
  border:1px solid var(--cyan);border-radius:50%;
  background:
    linear-gradient(var(--cyan),var(--cyan)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(79,214,255,.18), transparent 72%);
  box-shadow:0 0 10px rgba(79,214,255,.45), inset 0 0 8px rgba(79,214,255,.15);
  filter:drop-shadow(0 0 4px rgba(79,214,255,.9));
}
.warn .panel-title::before{
  border-color:var(--danger);
  background:
    linear-gradient(var(--danger),var(--danger)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--danger),var(--danger)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(255,61,110,.20), transparent 72%);
  box-shadow:0 0 10px rgba(255,61,110,.5), inset 0 0 8px rgba(255,61,110,.15);
  filter:drop-shadow(0 0 4px rgba(255,61,110,.9));
}
.warn .panel-title{
  border-color:rgba(255,61,110,.4);
  background:linear-gradient(90deg, rgba(255,61,110,.08), rgba(255,61,110,.01) 70%);
}

/* ---------- HUD ---------- */
#hud{margin-bottom:14px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hud-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud-name{font-size:19px;font-weight:600;letter-spacing:.18em;color:#eaf6ff;text-shadow:0 0 18px rgba(79,214,255,.55)}
.hud-name small{font-weight:300;color:var(--dim);letter-spacing:.1em;font-size:11px;display:block;margin-top:2px}
.hud-right{display:flex;align-items:center;gap:16px}
.lvl-box{text-align:right}
.lvl-label{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim)}
.lvl-num{font-family:'Share Tech Mono',monospace;font-size:34px;line-height:1;color:#fff;text-shadow:0 0 22px rgba(79,214,255,.85)}
.rank-badge{
  --c:#8fa6c4;
  width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:28px;color:var(--c);
  border:1px solid var(--c);
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  text-shadow:0 0 18px var(--c);
  box-shadow:0 0 26px color-mix(in srgb, var(--c) 40%, transparent);
  animation:pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{
  font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  background:rgba(8,18,36,.7);color:var(--dim);border:1px solid rgba(47,143,255,.22);
  padding:10px 16px;cursor:pointer;transition:.16s;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.tab:hover{color:var(--cyan);border-color:rgba(79,214,255,.5)}
.tab.active{color:#04121f;background:linear-gradient(180deg,#5fd8ff,#2f8fff);border-color:#7fe3ff;font-weight:600;box-shadow:0 0 22px rgba(79,214,255,.5)}
.tab .badge{display:inline-block;margin-left:6px;background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px}
.tab-icon{display:none}

@media(max-width:620px){
  .tabs{flex-wrap:nowrap;gap:5px;overflow:hidden}
  .tab{flex:1 1 auto;min-width:0;text-align:center;font-size:11px !important;padding:9px 6px !important;letter-spacing:.12em !important}
  .tab-full{display:none}
      .tab-icon{
    display:flex;align-items:center;justify-content:center;
    flex:0 0 42px;
    padding:9px 0 !important;
    font-size:18px !important;
    letter-spacing:0 !important;
    font-family:'Share Tech Mono',monospace !important;
  }

  /* unassigned points: stack the number above a 2-column grid of buttons */
  .unassigned-row{
    flex-direction:column !important;
    align-items:stretch !important;
    justify-content:flex-start !important;
    gap:14px !important;
  }
  .unassigned-row .pts{
    text-align:center;
    font-size:38px;
    line-height:1;
  }
  .unassigned-row .assign-row{
    display:grid !important;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:0 !important;
    width:100%;
  }
  .unassigned-row .assign-row .btn{
    width:100%;
    justify-content:center;
    padding:10px 6px;
    font-size:10.5px !important;
    letter-spacing:.06em !important;
    min-width:0;
    text-align:center;
  }
  /* the odd-one-out button (last, at odd position) spans the full width */
  .unassigned-row .assign-row .btn:last-child:nth-child(odd){
    grid-column:1 / -1;
  }
}

/* ---------- buttons ---------- */
.btn{
  font-family:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  background:linear-gradient(180deg, rgba(30,90,180,.35), rgba(10,30,70,.35));
  border:1px solid rgba(79,214,255,.45);color:var(--cyan);
  padding:9px 15px;cursor:pointer;transition:.15s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn:hover:not(:disabled){background:linear-gradient(180deg, rgba(50,140,255,.55), rgba(20,60,130,.55));box-shadow:0 0 20px rgba(79,214,255,.45);color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.small{font-size:10px;padding:6px 11px;letter-spacing:.12em}
.btn.danger{border-color:rgba(255,61,110,.5);color:var(--danger)}
.btn.danger:hover:not(:disabled){background:linear-gradient(180deg, rgba(180,30,60,.55), rgba(80,10,25,.55));box-shadow:0 0 20px rgba(255,61,110,.45);color:#fff}
.btn.gold{border-color:rgba(255,207,92,.5);color:var(--gold)}
.btn.gold:hover:not(:disabled){background:linear-gradient(180deg, rgba(180,140,30,.55), rgba(80,60,10,.55));box-shadow:0 0 20px rgba(255,207,92,.45);color:#fff}
.btn.ghost{border-color:rgba(111,140,181,.35);color:var(--dim);background:rgba(10,18,32,.5)}
.btn.ghost:hover{color:var(--cyan);border-color:rgba(79,214,255,.5);background:rgba(20,50,100,.5)}

input,textarea,select{
  font-family:inherit;font-size:13px;color:var(--text);
  background:rgba(4,10,22,.85);border:1px solid rgba(47,143,255,.3);
  padding:9px 11px;width:100%;outline:none;transition:.15s;
}

/* iOS/Safari: strip native chrome so inputs respect the container width */
input[type="date"],
input[type="time"],
input[type="datetime-local"],
input[type="number"]{
  -webkit-appearance:none;
  appearance:none;
  min-width:0;
  max-width:100%;
  width:100%;
  box-sizing:border-box;
}

/* keep the picker indicator from pushing the box wider on iOS */
input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:.7;
  margin-left:6px;
  cursor:pointer;
  filter:invert(1) hue-rotate(180deg);
}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(79,214,255,.25)}
textarea{resize:vertical;min-height:64px}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}

/* ---------- stats ---------- */
.stat-row{margin-bottom:14px}
.stat-top{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:.14em;margin-bottom:6px;
  cursor:pointer;user-select:none;
  padding:4px 0;
  transition:.15s;
}
.stat-top:hover .stat-name{color:var(--cyan)}
.stat-name{
  color:var(--text);font-weight:500;
  display:inline-flex;align-items:center;gap:11px;
  transition:color .15s;
}
.stat-chevron{
  display:inline-block;width:0;height:0;
  border-left:6px solid var(--cyan);
  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  transition:transform .2s ease;
  flex-shrink:0;
}
.stat-top.open .stat-chevron{transform:rotate(90deg)}
.stat-val{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff}
.stat-val small{color:var(--dim);font-size:10px}
.bar{height:8px;background:rgba(10,25,50,.9);border:1px solid rgba(47,143,255,.25);overflow:hidden;position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,#1c5fd6,#4fd6ff);box-shadow:0 0 14px rgba(79,214,255,.7);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.stat-desc{
  font-size:10.5px;color:var(--dim);margin-top:0;line-height:1.5;
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .28s ease, opacity .22s ease, margin-top .22s ease;
}
.stat-desc.open{max-height:160px;opacity:1;margin-top:8px}

/* lagging stat highlight */
.stat-row.lagging .stat-name{color:var(--gold)}
.stat-row.lagging .stat-val{color:var(--gold)}
.stat-row.lagging .bar{border-color:rgba(255,207,92,.45)}
.stat-row.lagging .bar-fill{background:linear-gradient(90deg,#c9880a,#ffcf5c);box-shadow:0 0 14px rgba(255,207,92,.6)}
.stat-lag-badge{
  display:inline-block;font-size:9.5px;letter-spacing:.16em;
  padding:2px 6px;margin-left:10px;
  color:var(--gold);border:1px solid rgba(255,207,92,.5);
  text-transform:uppercase;font-weight:500;
}

/* unassigned-points lag warning */
.lag-warn{
  margin-top:11px;padding:10px 13px;
  border:1px solid rgba(255,207,92,.4);
  background:linear-gradient(90deg, rgba(255,207,92,.09), rgba(255,207,92,.01) 80%);
  font-size:12.5px;color:var(--text);line-height:1.65;
}
.lag-warn b{color:var(--gold)}

/* distribution modal */
.dist-row{
  display:flex;align-items:center;gap:14px;
  padding:11px 0;
  border-bottom:1px solid rgba(47,143,255,.12);
}
.dist-row:last-of-type{border-bottom:none}
.dist-name{flex:1;font-size:14.5px;letter-spacing:.1em}
.dist-name.lag{color:var(--gold)}
.dist-cur{
  font-family:'Share Tech Mono',monospace;
  font-size:13.5px;color:var(--dim);
  min-width:56px;text-align:right;
}
.dist-input{
  width:84px !important;padding:7px 9px !important;
  font-family:'Share Tech Mono',monospace;font-size:16px !important;
  text-align:center;
}
.dist-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 0 4px;margin-top:4px;
  border-top:1px solid rgba(79,214,255,.25);
}
.dist-total .label{
  font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;
}
.dist-total .val{
  font-family:'Share Tech Mono',monospace;
  font-size:21px;color:var(--gold);
  text-shadow:0 0 14px rgba(255,207,92,.5);
}
.dist-total .val.over{color:var(--danger);text-shadow:0 0 14px rgba(255,61,110,.5)}

.assign-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.pts{font-family:'Share Tech Mono',monospace;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(255,207,92,.7)}

/* ---------- quests ---------- */
.quest{padding:14px 16px;margin-bottom:10px}
.quest.done{border-color:rgba(56,255,176,.45);box-shadow:0 0 26px rgba(56,255,176,.12)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.q-stat{font-size:10.5px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase}
.q-phase{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--cyan);border:1px solid rgba(79,214,255,.35);padding:1px 6px;letter-spacing:.1em}
.q-phase.hard{color:var(--gold);border-color:rgba(255,207,92,.5)}
.q-phase.easy{color:var(--green);border-color:rgba(56,255,176,.5)}
.q-name{font-size:15px;font-weight:600;color:#eaf6ff;margin-bottom:11px;letter-spacing:.04em}
.q-line{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-top:1px solid rgba(47,143,255,.13)}
.q-tag{font-size:9.5px;letter-spacing:.2em;color:var(--dim);min-width:62px;padding-top:3px}
.q-text{flex:1;font-size:12.5px;color:var(--text);line-height:1.5}
.q-text.empty{color:var(--dim);font-style:italic}
.chk{
  font-family:inherit;font-size:10px;letter-spacing:.14em;padding:6px 11px;cursor:pointer;
  background:rgba(8,18,36,.8);border:1px solid rgba(47,143,255,.35);color:var(--dim);
  transition:.15s;min-width:92px;text-transform:uppercase;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.chk:hover{border-color:var(--cyan);color:var(--cyan)}
.chk.on{background:linear-gradient(180deg,rgba(56,255,176,.35),rgba(10,80,55,.35));border-color:var(--green);color:#c9fff0;box-shadow:0 0 18px rgba(56,255,176,.35)}
.chk-mini{
  font-family:inherit;font-size:12px;letter-spacing:.06em;
  padding:6px 10px;cursor:pointer;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(47,143,255,.25);
  color:var(--dim);
  transition:.15s;
}
.chk-mini:hover{border-color:var(--danger);color:var(--danger);background:rgba(60,10,25,.5)}
.q-line.on .q-text{color:var(--green);text-decoration:line-through;text-decoration-color:rgba(56,255,176,.4)}

/* ---------- ceiling sub-steps ---------- */
.ceil-steps{
  margin:0 0 0 0;
  padding:6px 0 4px 22px;
  border-top:1px dashed rgba(47,143,255,.14);
}
.ceil-steps-head{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase;
  margin-bottom:6px;
}
.ceil-steps-head b{color:var(--cyan);font-weight:500}
.ceil-step{
  display:flex;align-items:flex-start;gap:11px;
  padding:4px 0;
  font-size:13.5px;color:var(--dim);
  line-height:1.5;
  transition:color .15s;
}
.ceil-step .step-chk{
  font-family:'Share Tech Mono',monospace;font-size:12px;
  width:22px;height:22px;min-width:22px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(47,143,255,.3);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;
  margin-top:1px;
}
.ceil-step .step-chk:hover{border-color:var(--cyan);color:var(--cyan)}
.ceil-step .step-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
  box-shadow:0 0 12px rgba(56,255,176,.3);
}
.ceil-step .step-text{flex:1}
.ceil-suspended{
  display:inline-block;margin-left:8px;
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px;letter-spacing:.14em;
  padding:1px 6px;
  color:var(--gold);
  border:1px solid rgba(255,207,92,.5);
  text-transform:uppercase;vertical-align:middle;
}
.ceil-step.on .step-text{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}

/* ---------- quest tree / graduation ---------- */
.qtree{
  margin:0 0 16px 0;
  padding:14px 16px;
  background:rgba(4,10,22,.65);
  border:1px solid rgba(47,143,255,.2);
}
.qtree-node{
  position:relative;
  padding:10px 0 10px 22px;
  border-left:2px solid rgba(47,143,255,.35);
  margin-left:6px;
}
.qtree-node:last-child{border-left-color:transparent}
.qtree-node::before{
  content:'';position:absolute;left:-6px;top:14px;
  width:10px;height:10px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px rgba(79,214,255,.8);
}
.qtree-node.origin{border-left-color:rgba(111,140,181,.3)}
.qtree-node.origin::before{background:var(--dim);box-shadow:none}
.qtree-node.current{border-left-color:rgba(255,207,92,.5)}
.qtree-node.current::before{background:var(--gold);box-shadow:0 0 10px rgba(255,207,92,.9)}
.qtree-date{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.qtree-name{font-size:14.5px;font-weight:600;color:#eaf6ff;margin-bottom:6px}
.qtree-detail{font-size:12.5px;color:var(--text);line-height:1.55;margin-bottom:3px}

.qtree-action{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;padding:3px 8px;border:1px solid currentColor}
.qtree-action.extend{color:var(--green)}
.qtree-action.replace{color:var(--gold)}
.qtree-action.obsolete{color:var(--danger)}
.qtree-note{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:5px}

/* graduate mode radio cards */
.grad-modes{display:grid;grid-template-columns:1fr;gap:6px}
.grad-mode{
  display:flex;gap:10px;align-items:flex-start;

}

.grad-mode b{display:block;color:#eaf6ff;margin-bottom:2px;font-weight:600;letter-spacing:.06em}
.grad-mode span{display:block;color:var(--dim);font-size:12px;line-height:1.5}

/* ---------- lifestyle upgrades ---------- */
.life-panel{border-color:rgba(160,107,255,.4)}
.life-panel .panel-title{
  color:var(--purple);
  text-shadow:0 0 12px rgba(160,107,255,.55);
  border-color:rgba(160,107,255,.4);
  background:linear-gradient(90deg, rgba(160,107,255,.09), rgba(160,107,255,.01) 70%);
  box-shadow:0 0 14px rgba(160,107,255,.1), inset 0 0 24px rgba(160,107,255,.04);
}
.life-panel .panel-title::before{
  border-color:var(--purple);
  background:
    linear-gradient(var(--purple),var(--purple)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--purple),var(--purple)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(160,107,255,.22), transparent 72%);
  box-shadow:0 0 10px rgba(160,107,255,.55), inset 0 0 8px rgba(160,107,255,.18);
  filter:drop-shadow(0 0 4px rgba(160,107,255,.95));
}
.life-grid{display:grid;grid-template-columns:1fr;gap:8px}
.life-item{
  display:flex;align-items:center;gap:12px;padding:10px 13px;
  border:1px solid rgba(160,107,255,.25);background:rgba(15,8,28,.55);
  transition:.15s;
}
.life-item:hover{border-color:rgba(160,107,255,.5)}
.life-item.on{border-color:rgba(56,255,176,.45);background:rgba(10,30,25,.55)}
.life-item .life-name{flex:1;font-size:14.5px;color:var(--text)}
.life-item.on .life-name{color:var(--green)}
.life-check{
  font-family:inherit;font-size:11px;letter-spacing:.14em;padding:6px 12px;cursor:pointer;
  background:rgba(20,10,35,.8);border:1px solid rgba(160,107,255,.4);color:var(--purple);
  transition:.15s;min-width:96px;text-transform:uppercase;text-align:center;
}
.life-check:hover{border-color:var(--purple);color:#c9a9ff}
.life-check.on{background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));border-color:var(--green);color:#c9fff0}
.life-counter{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--purple)}
.life-counter b{color:#fff;font-size:17px}

.daily-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.daily-count{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--dim)}
.daily-count b{color:#fff;font-size:17px}
.daily-count .ok{color:var(--green)}

/* ---------- misc ---------- */
.empty{color:var(--dim);font-size:12px;font-style:italic;padding:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.item{

  padding:9px 11px;border:1px solid rgba(47,143,255,.18);background:rgba(6,14,28,.6);margin-bottom:6px;
  font-size:12.5px;
}
.item .meta{font-size:10px;color:var(--dim);letter-spacing:.1em}

/* dungeon inbox / cleared entries get extra breathing room */
.item.dungeon{
  padding:13px 15px;
  gap:16px;
  align-items:flex-start;
  margin-bottom:8px;
}
.item.dungeon .title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14.5px;
  font-weight:600;
  line-height:1.35;
  margin-bottom:7px;
}
.item.dungeon .title .tag{
  flex-shrink:0;
  font-size:11.5px;
  padding:3px 8px;
}
.item.dungeon .meta{
  font-size:12px !important;
  letter-spacing:.04em !important;
  line-height:1.55;
  color:var(--dim);
}
.item.dungeon .row{
  gap:9px;
  flex-shrink:0;
  padding-top:2px;
}
.dungeon-real{
  font-size:12.5px;
  color:var(--dim);
  font-style:italic;
  opacity:.62;
  letter-spacing:.03em;
  line-height:1.4;
}
.item.dungeon .dungeon-real{
  margin:-4px 0 7px 0;
}
.tag{font-family:'Share Tech Mono',monospace;font-size:10px;padding:2px 7px;border:1px solid currentColor}
.tag.t1{color:var(--green)}.tag.t2{color:var(--gold)}.tag.t3{color:var(--danger)}
.rank-E{color:#8fa6c4}.rank-D{color:#5fd0ff}.rank-C{color:#4f8dff}
.rank-B{color:#a06bff}.rank-A{color:#ffb347}.rank-S{color:#ff4d6d}

.warn{border-color:rgba(255,61,110,.5);box-shadow:0 0 30px rgba(255,61,110,.15)}
.warn .panel-title{color:var(--danger);text-shadow:0 0 12px rgba(255,61,110,.5)}

/* ---------- developer mode ---------- */
.dev-banner{
  text-align:center;
  padding:9px 14px;
  margin:-4px 0 14px 0;

}
.dev-panel{border-color:rgba(255,207,92,.4)}
.dev-panel .panel-title{
  color:var(--gold);
  text-shadow:0 0 12px rgba(255,207,92,.55);

  background:linear-gradient(90deg, rgba(255,207,92,.09), rgba(255,207,92,.01) 70%);
}
.dev-panel .panel-title::before{

}
.dev-active{

}

/* ---------- missions ---------- */
.mission-panel{
  border-color:rgba(255,95,168,.4);

}
.mission-panel .panel-title{
  color:var(--mission);
  text-shadow:0 0 12px rgba(255,95,168,.55);
  border-color:rgba(255,95,168,.4);
  background:linear-gradient(90deg, rgba(255,95,168,.09), rgba(255,95,168,.01) 70%);
  box-shadow:0 0 14px rgba(255,95,168,.1), inset 0 0 24px rgba(255,95,168,.04);
}
.mission-panel .panel-title::before{
  border-color:var(--mission);
  background:
    linear-gradient(var(--mission),var(--mission)) 50% 4px / 2px 7px no-repeat,
    linear-gradient(var(--mission),var(--mission)) 50% 13px / 2px 2px no-repeat,
    radial-gradient(circle at 50% 50%, rgba(255,95,168,.22), transparent 72%);
  box-shadow:0 0 10px rgba(255,95,168,.55), inset 0 0 8px rgba(255,95,168,.18);
  filter:drop-shadow(0 0 4px rgba(255,95,168,.95));
}
.mission-name{
  font-size:22px;font-weight:700;color:#fff;
  letter-spacing:.05em;margin-bottom:10px;
  line-height:1.25;
  text-shadow:0 0 18px rgba(255,95,168,.5);
}
.mission-meta{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  margin-bottom:12px;padding-bottom:12px;
  border-bottom:1px solid rgba(255,95,168,.2);
}
.mission-bounty{
  font-family:'Share Tech Mono',monospace;
  font-size:14px;color:var(--gold);
  letter-spacing:.1em;
}
.mission-dates{
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;color:var(--dim);
  letter-spacing:.06em;margin-bottom:6px;
}
.mission-timeline{
  font-family:'Share Tech Mono',monospace;
  font-size:15px;color:var(--text);
  letter-spacing:.06em;margin-bottom:4px;
}
.mission-timeline b{color:var(--mission);font-weight:600}
.mission-section-label{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim);margin:18px 0 8px;
  padding-bottom:6px;
  border-bottom:1px dashed rgba(255,95,168,.25);
}
.mission-criterion{
  display:flex;align-items:flex-start;gap:12px;
  padding:9px 0;font-size:14.5px;color:var(--text);
  line-height:1.5;transition:color .15s;
}
.mission-criterion .crit-chk{
  font-family:'Share Tech Mono',monospace;font-size:14px;
  width:26px;height:26px;min-width:26px;padding:0;
  background:rgba(8,18,36,.8);
  border:1px solid rgba(255,95,168,.35);
  color:var(--dim);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;margin-top:1px;
}
.mission-criterion .crit-chk:hover{border-color:var(--mission);color:var(--mission)}
.mission-criterion .crit-chk.on{
  background:linear-gradient(180deg,rgba(56,255,176,.3),rgba(10,80,55,.3));
  border-color:var(--green);color:#c9fff0;
  box-shadow:0 0 12px rgba(56,255,176,.3);
}
.mission-criterion .crit-text{flex:1}
.mission-criterion.on .crit-text{
  color:var(--green);
  text-decoration:line-through;
  text-decoration-color:rgba(56,255,176,.4);
}
.mission-progress{
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;color:var(--dim);
  letter-spacing:.08em;margin-top:8px;
}
.mission-progress b{color:var(--green);font-weight:600}
.mission-field-value{
  font-size:13.5px;color:var(--text);
  line-height:1.7;white-space:pre-wrap;
  padding:10px 13px;
  background:rgba(4,10,22,.6);
  border-left:2px solid rgba(255,95,168,.4);
}
.mission-ready{
  padding:12px 14px;margin:18px 0 8px;
  border:1px solid rgba(56,255,176,.5);
  background:linear-gradient(90deg, rgba(56,255,176,.08), rgba(56,255,176,.01) 80%);
  color:var(--green);
  font-family:'Share Tech Mono',monospace;
  font-size:13px;letter-spacing:.16em;
  text-align:center;text-transform:uppercase;
  box-shadow:0 0 20px rgba(56,255,176,.15);
}
.mission-log-item{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:11px 13px;margin-bottom:8px;
  border:1px solid rgba(255,95,168,.18);
  background:rgba(6,14,28,.55);
}
.mission-log-item.completed{border-color:rgba(56,255,176,.35)}
.mission-log-item.failed{border-color:rgba(255,61,110,.35)}
.mission-log-name{
  font-size:14px;font-weight:600;color:#eaf6ff;
  margin-bottom:5px;line-height:1.4;
}
.mission-log-name .tag{margin-right:6px}
.mission-log-meta{
  font-family:'Share Tech Mono',monospace;
  font-size:11.5px;color:var(--dim);
  letter-spacing:.04em;
}
.mission-log-delta{
  font-family:'Share Tech Mono',monospace;
  font-size:15px;font-weight:700;
  flex-shrink:0;white-space:nowrap;
}
.mission-log-delta.plus{color:var(--green)}
.mission-log-delta.minus{color:var(--danger)}
.mission-log-delta.zero{color:var(--dim)}
.big-timer{font-family:'Share Tech Mono',monospace;font-size:30px;color:var(--danger);text-shadow:0 0 22px rgba(255,61,110,.7);letter-spacing:.06em}
.big-timer.ok{color:var(--cyan);text-shadow:0 0 22px rgba(79,214,255,.7)}

.hexstrip{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hex{width:15px;height:15px;background:rgba(20,40,70,.8);border:1px solid rgba(47,143,255,.2)}
.hex.g{background:linear-gradient(180deg,#38ffb0,#12a878);border-color:#38ffb0;box-shadow:0 0 8px rgba(56,255,176,.6)}
.hex.y{background:linear-gradient(180deg,#ffcf5c,#b8860b);border-color:#ffcf5c}
.hex.r{background:linear-gradient(180deg,#ff3d6e,#8a1230);border-color:#ff3d6e}
.hex.today{outline:1px solid #fff}

/* ---------- overlay / modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
  background:rgba(2,5,12,.9);backdrop-filter:blur(6px);padding:18px;overflow-y:auto;
}
.overlay.hidden{display:none}
.modal{
  width:100%;max-width:520px;position:relative;
  background:linear-gradient(160deg,rgba(10,24,48,.98),rgba(4,9,20,.98));
  border:1px solid rgba(79,214,255,.5);
  box-shadow:0 0 60px rgba(30,110,255,.3), 0 0 0 1px rgba(0,0,0,.7) inset;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  padding:26px;max-height:88vh;overflow-y:auto;
}
.modal h2{font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);margin-bottom:16px;text-shadow:0 0 14px rgba(79,214,255,.5)}
.oath-title{font-size:26px;letter-spacing:.32em;color:#fff;text-align:center;text-shadow:0 0 34px rgba(79,214,255,.9);margin-bottom:8px}
.oath-sub{text-align:center;font-size:11px;letter-spacing:.24em;color:var(--cyan);margin-bottom:24px}
.oath-text{font-size:13px;line-height:2;color:var(--text);margin-bottom:22px;text-align:center}
.oath-text b{color:var(--cyan)}

/* ---------- toast ---------- */
#toasts{position:fixed;right:14px;bottom:14px;z-index:10001;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  background:linear-gradient(160deg,rgba(10,30,60,.97),rgba(4,10,22,.97));
  border:1px solid rgba(79,214,255,.6);color:var(--cyan);
  padding:11px 16px;font-size:12px;letter-spacing:.1em;
  box-shadow:0 0 28px rgba(79,214,255,.35);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  animation:tin .3s ease-out;max-width:320px;
}
.toast.gold{border-color:rgba(255,207,92,.7);color:var(--gold);box-shadow:0 0 28px rgba(255,207,92,.35)}
.toast.bad{border-color:rgba(255,61,110,.7);color:var(--danger);box-shadow:0 0 28px rgba(255,61,110,.35)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

footer{position:relative;z-index:2;text-align:center;font-size:10px;letter-spacing:.22em;color:#33465f;padding:26px 0 10px;text-transform:uppercase}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(5,12,24,.9)}
::-webkit-scrollbar-thumb{background:rgba(47,143,255,.35)}
::-webkit-scrollbar-thumb:hover{background:rgba(79,214,255,.6)}

<div id="app" class="wrap">
  <div id="hud"></div>

<script>
"use strict";
/* =========================================================
   CONSTANTS
   ========================================================= */
const STORAGE_KEY = 'arise_system_v1';

const STAT_KEYS = ['intellect','stamina','agility','mental','awareness'];
const STAT_META = {
  intellect:{label:'INTELLECT', icon:'◈', desc:'Strategy, learning, creativity, problem-solving, pattern recognition, efficiency of thought.'},
  stamina  :{label:'STAMINA',   icon:'⬢', desc:'Endurance, cardio, deep work, sustained focus, muscle building, perseverance.'},
  agility  :{label:'AGILITY',   icon:'⚡', desc:'Mobility, reflexes, coordination, speed.'},
  mental   :{label:'MENTAL',    icon:'◆', desc:'Self-belief, focus on the goal, consistency, working with your nature instead of against it.'},
  awareness:{label:'AWARENESS', icon:'◎', desc:'Perception, intuition, self-reflection, spotting weaknesses, reading people, values alignment.'}
};

const RANKS = [
  {name:'E', min:0,    max:10,       color:'#8fa6c4'},
  {name:'D', min:11,   max:50,       color:'#5fd0ff'},
  {name:'C', min:51,   max:200,      color:'#4f8dff'},
  {name:'B', min:201,  max:500,      color:'#a06bff'},
  {name:'A', min:501,  max:1000,     color:'#ffb347'},
  {name:'S', min:1001, max:Infinity, color:'#ff4d6d'}
];
const POINTS_PER_LEVEL = 10;

const RANK_VAL = {E:1,D:2,C:3,B:4,A:5,S:6};
const DUNGEON_DAYS = {E:2,D:2,C:3,B:4,A:4,S:5};
const DUNGEON_OBJECTIVE_POINTS = 20;
const EDIT_TOKEN_CHANCE_IN_KEY_SLOT = 0.5; // inside the 20% "key" band, 50/50 key vs token
const DEV_PASSWORD = "I'm breaking the rules";
const MISSION_BOUNTY = {E:5, D:10, C:30, B:70, A:100, S:150};
const MISSION_MIN_DAYS = 14;

/* =========================================================
   UTILS

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function localDateStr(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartStr(d = new Date()){
  const x = new Date(d);
  const dow = (x.getDay() + 6) % 7; // Monday = 0
  x.setDate(x.getDate() - dow);
  return localDateStr(x);
}
function fmtDuration(ms){
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return d > 0 ? `${d}d ${p(h)}:${p(m)}:${p(ss)}` : `${p(h)}:${p(m)}:${p(ss)}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

let state = defaultState();
let activeTab = 'status';
const expandedStats = new Set();  // which stat descriptions are expanded this session
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

function migrate(raw){
  const d = defaultState();
  const s = Object.assign({}, d, raw || {});
  s.stats = Object.assign({}, d.stats, (raw && raw.stats) || {});
    s.today = Object.assign({}, d.today, (raw && raw.today) || {});
    s.today.lifestyle = (raw && raw.today && raw.today.lifestyle) || {};
  // Ensure per-ceiling tracking exists. On first load after this update, mark
  // any already-ticked ceilings as paid so they aren't re-awarded retroactively.
      const hasCeilPaidField = raw && raw.today && typeof raw.today.ceilPaid === 'object';
  s.today.ceilPaid = (raw && raw.today && raw.today.ceilPaid) || {};
  if (!hasCeilPaidField && s.today.ceil){
    // One-time migration from the pre-ceilPaid schema: mark today's existing
    // ceiling ticks as already paid so they aren't retroactively awarded.
    Object.keys(s.today.ceil).forEach(id => {
      if (s.today.ceil[id]) s.today.ceilPaid[id] = true;
    });
  }
  s.today.ceilSteps = (raw && raw.today && raw.today.ceilSteps) || {};
  s.lifestyle = (raw && raw.lifestyle) || [];
    s.dungeons = Object.assign({}, d.dungeons, (raw && raw.dungeons) || {});
  s.dungeons.locked = (raw && raw.dungeons && raw.dungeons.locked) || {};
  s.dungeons.cleared = (raw && raw.dungeons && raw.dungeons.cleared) || [];
  s.dungeons.inbox = (raw && raw.dungeons && raw.dungeons.inbox) || [];
  if (s.dungeons.active && Array.isArray(s.dungeons.active.tasks)){
    s.dungeons.active.tasks.forEach(t => {
      if (typeof t.paid !== 'boolean') t.paid = !!t.done;
    });
  }
  s.titles = (raw && raw.titles) || [];
    s.keys = (raw && raw.keys) || [];
    if (typeof s.editTokens !== 'number') s.editTokens = 0;
    if (typeof s.devMode !== 'boolean') s.devMode = false;
    s.missions = Object.assign({active: null, backlog: [], history: []}, (raw && raw.missions) || {});
  if (!Array.isArray(s.missions.history)) s.missions.history = [];
  if (!Array.isArray(s.missions.backlog)) s.missions.backlog = [];
  s.log = (raw && raw.log) || {};
  s.weekFails = (raw && raw.weekFails) || {};
  s.penalties = (raw && raw.penalties) || d.penalties;
  s.rewards = (raw && raw.rewards) || d.rewards;
  if (!Array.isArray(s.quests) || s.quests.length !== 5){
    s.quests = d.quests;
  }
                        s.quests.forEach(q => {
    if (typeof q.phase !== 'number') q.phase = 1;
    if (!Array.isArray(q.history)) q.history = [];
    if (!Array.isArray(q.ceilingSteps)) q.ceilingSteps = [];
    if (typeof q.ceilingRepeatable !== 'boolean') q.ceilingRepeatable = false;
    q.ceilingSteps.forEach(st => {
      if (typeof st.repeatable !== 'boolean') st.repeatable = false;
    });
    if (!q.origin) q.origin = s.createdAt || new Date().toISOString();
    delete q.mult;
  });
  return s;
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return migrate(JSON.parse(raw));
  } catch(e){ console.error('load failed', e); return null; }
}

/* =========================================================
   DERIVED VALUES
   ========================================================= */
function getLevel(){
  return Math.floor(Math.min(...STAT_KEYS.map(k => state.stats[k])) / POINTS_PER_LEVEL);
}
function rankForLevel(lv){
  return RANKS.find(r => lv >= r.min && lv <= r.max) || RANKS[RANKS.length-1];
}
function nextRankOf(lv){
  const idx = RANKS.findIndex(r => lv >= r.min && lv <= r.max);
  return idx >= 0 && idx < RANKS.length-1 ? RANKS[idx+1] : null;
}
function nextLevelBarrier(){
  return (getLevel() + 1) * POINTS_PER_LEVEL;
}
function getSystemLevel(){
  return 1 + state.systemTokens;
}
function getDayNumber(){
  const start = new Date(state.createdAt);
  start.setHours(0,0,0,0);
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.floor((today - start) / 86400000) + 1;
}
function hasFullWeekOfData(){
  const [y,m,d] = state.weekStart.split('-').map(Number);
  const weekStartDate = new Date(y, m-1, d, 0, 0, 0, 0);
  const created = new Date(state.createdAt);
  created.setHours(0,0,0,0);
  return created <= weekStartDate;
}
function isWeeklyWindow(){
  const now = new Date();
  return now.getDay() === 0 && now.getHours() >= 19;
}
function canEditNow(){
  return state.devMode || isWeeklyWindow() || state.editTokens > 0;
}
function consumeEditToken(){
  if (state.devMode) return true;
  if (isWeeklyWindow()) return true;
  if (state.editTokens <= 0) return false;
  if (!confirm(`Use 1 instant edit token for this change?\n\nYou have ${state.editTokens} remaining.`)) return false;
  state.editTokens -= 1;
  return true;
}
function lowestStat(){
  let k = STAT_KEYS[0];
  STAT_KEYS.forEach(s => { if (state.stats[s] < state.stats[k]) k = s; });
  return k;
}

function addTitle(name, desc, hours){
  state.titles = state.titles.filter(t => t.name !== name);
  state.titles.push({
    id: uid(), name, desc, custom:false,
    expiresAt: hours ? new Date(Date.now() + hours*3600*1000).toISOString() : null
  });
}
function pruneTitles(){
  const now = Date.now();
  const before = state.titles.length;
  state.titles = state.titles.filter(t => !t.expiresAt || new Date(t.expiresAt).getTime() > now);
  return state.titles.length !== before;
}

function toast(msg, kind){
  const d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => { d.style.transition='opacity .4s'; d.style.opacity='0'; setTimeout(()=>d.remove(), 420); }, 3800);
}

function checkDailyAwards(){
  if (state.devMode) return;
  const t = state.today;
  if (!t.ceilPaid) t.ceilPaid = {};

  const total = state.quests.length;
  const allFloor = state.quests.every(q => t.floor[q.id]);

  // Floors: +1 to every stat when all five are done. Reversible.
  if (allFloor && !t.floorPointGiven){
    t.floorPointGiven = true;
    STAT_KEYS.forEach(k => { state.stats[k] += 1; });
    toast('+1 TO EVERY STAT — ALL FLOORS CLEARED', 'gold');
  } else if (!allFloor && t.floorPointGiven){
    t.floorPointGiven = false;
    STAT_KEYS.forEach(k => { state.stats[k] = Math.max(0, state.stats[k] - 1); });
    toast('−1 FROM EVERY STAT — FLOOR BONUS REVOKED', 'bad');
  }

  // Ceilings: awarded only while all floors are done.
  // Ticked early → suspended until floors finish.
  const awarded = [];
  const revoked = [];

  state.quests.forEach(q => {
    const ceilOn = !!t.ceil[q.id];
    const wasPaid = !!t.ceilPaid[q.id];
    const shouldPay = ceilOn && allFloor;

    if (shouldPay && !wasPaid){
      t.ceilPaid[q.id] = true;
      state.stats[q.stat] += 1;
      awarded.push(q.stat);
    } else if (!shouldPay && wasPaid){
      delete t.ceilPaid[q.id];
      state.stats[q.stat] = Math.max(0, state.stats[q.stat] - 1);
      revoked.push(q.stat);
    }
  });

  if (awarded.length === 1){
    toast(`+1 ${STAT_META[awarded[0]].label} — CEILING CLEARED`, 'gold');
  } else if (awarded.length > 1){
    toast(`+${awarded.length} CEILING POINTS — SUSPENDED AWARDS RELEASED`, 'gold');
  }
  if (revoked.length === 1){
    toast(`−1 ${STAT_META[revoked[0]].label} — CEILING REVOKED`, 'bad');
  } else if (revoked.length > 1){
    toast(`−${revoked.length} CEILING POINTS — SUSPENDED`, 'bad');
  }
}

function rollReward(boostFactor = 0){
  const w = {
    custom:     50,
    keyED:      20,
    skip:       15,
    pointKeyCB: 10,
    keyAS:       4,
    token:       1
  };

  // If no custom rewards are defined, redistribute that slot proportionally.
  if (!state.rewards.length){
    const released = w.custom;
    w.custom = 0;
    const sum = w.keyED + w.skip + w.pointKeyCB + w.keyAS + w.token;
    for (const k of ['keyED','skip','pointKeyCB','keyAS','token']){
      w[k] += released * (w[k] / sum);
    }
  }

  // Lifestyle boost: shift weight from common → rare, scaled by boostFactor (0..1).
  if (boostFactor > 0){
    const diminish = 1 - 0.35 * boostFactor;
    let released = 0;
    for (const k of ['custom','keyED','skip']){
      const before = w[k];
      w[k] = w[k] * diminish;
      released += before - w[k];
    }
    const rareSum = w.pointKeyCB + w.keyAS + w.token;
    if (rareSum > 0){
      for (const k of ['pointKeyCB','keyAS','token']){
        w[k] += released * (w[k] / rareSum);
      }
    } else {
      for (const k of ['pointKeyCB','keyAS','token']) w[k] += released / 3;
    }
  }

  const total = Object.values(w).reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (const [key, weight] of Object.entries(w)){
    if (r < weight){
      switch(key){
        case 'custom':     return {type:'custom',    text: pick(state.rewards).text};
                case 'keyED':      return Math.random() < EDIT_TOKEN_CHANCE_IN_KEY_SLOT
                                    ? {type:'key',       tier:'ED'}
                                    : {type:'editToken'};
        case 'skip':       return {type:'skip'};
        case 'pointKeyCB': return {type:'point_key', tier:'CB'};
        case 'keyAS':      return {type:'key',       tier:'AS'};
        case 'token':      return {type:'token'};
      }
    }
    r -= weight;
  }
  return {type:'token'};
}

function makeKey(tier){
  const table = {ED:['E','D'], CB:['C','B'], AS:['A','S']};
  const rank = pick(table[tier]);
  return {id: uid(), rank};
}

function claimReward(){
  const t = state.today;
  if (t.rewardGiven) return;
  if (!state.quests.every(q => t.ceil[q.id])) return;
  if (state.devMode){
    t.rewardGiven = true;
    t.rewardText = 'DEV MODE — reward not applied.';
    save(); render();
    return;
  }

    const lifestyleDone = Object.keys(state.today.lifestyle || {}).filter(id => state.today.lifestyle[id]).length;
  const lifestyleTotal = state.lifestyle.length;
  const boostFactor = lifestyleTotal > 0 ? lifestyleDone / lifestyleTotal : 0;
  const res = rollReward(boostFactor);
  let text = '';

  if (res.type === 'custom'){
    text = res.text;
  } else if (res.type === 'key'){
    const k = makeKey(res.tier);
    state.keys.push(k);
    text = `DUNGEON KEY [${k.rank}-RANK] acquired.`;
    } else if (res.type === 'skip'){
    state.skips += 1;
    text = 'PENALTY SKIP — tomorrow\'s penalty will be voided.';
  } else if (res.type === 'editToken'){
    state.editTokens += 1;
    text = 'INSTANT EDIT TOKEN — one unrestricted System edit, usable any time.';
  } else if (res.type === 'point_key'){
    const k = makeKey(res.tier);
    state.keys.push(k);
    state.unassigned += 1;
    text = `+1 STAT POINT and DUNGEON KEY [${k.rank}-RANK].`;
  } else {
    state.systemTokens += 1;
    text = 'SYSTEM UPGRADE TOKEN — account level +1.';
  }

  t.rewardGiven = true;
  t.rewardText = text;
  save(); render();
  openModal(`
    <h2>Reward Acquired</h2>
    <div style="font-size:15px;line-height:1.9;color:#eaf6ff;text-align:center;padding:10px 0 20px">${esc(text)}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="close-modal">Acknowledge</button></div>
  `);
}

/* =========================================================
   ROLLOVER / TICK
   ========================================================= */
function issuePenalty(failedCount, forDate, lifestyleDone = 0, lifestyleTotal = 0){
  if (state.devMode) return;
  let tier = failedCount === 1 ? 1 : (failedCount <= 3 ? 2 : 3);
  const ratio = lifestyleTotal > 0 ? lifestyleDone / lifestyleTotal : 0;

  // Full escape: 1 missed quest + ALL lifestyle upgrades done → 1% chance to skip entirely.
  if (tier === 1 && lifestyleTotal > 0 && lifestyleDone === lifestyleTotal){
    if (Math.random() < 0.01){
      toast('LIFESTYLE BONUS — penalty escaped entirely.', 'gold');
      return;
    }
  }

  // Tier reduction: base tier 2 or 3, scaled by lifestyle ratio.
  if (tier > 1 && lifestyleTotal > 0 && lifestyleDone > 0){
    const dropChance = ratio * 0.6;
    if (Math.random() < dropChance){
      tier -= 1;
      if (tier === 2 && Math.random() < dropChance * 0.4){
        tier -= 1;
      }
      toast(`LIFESTYLE BONUS — penalty tier reduced to ${tier}.`, 'gold');
    }
  }

  if (state.skips > 0){
    state.skips -= 1;
    toast('Penalty skipped (consumed skip).', 'gold');
    return;
  }

  const pool = state.penalties.filter(p => p.tier === tier);
  const chosen = pool.length ? pick(pool) : null;

  let dl = new Date(); dl.setHours(12,0,0,0);
  if (dl.getTime() < Date.now()) dl = new Date(Date.now() + 6*3600*1000);

  state.pendingPenalty = {
    date: forDate,
    tier,
    penaltyId: chosen ? chosen.id : null,
    text: chosen ? chosen.text : `Tier ${tier} penalty — you have none defined. Add them in the System tab.`,
    deadline: dl.toISOString(),
    done: false
  };
  toast(`PENALTY ISSUED — TIER ${tier}`, 'bad');
}

function applyFraud(){
  const lv = getLevel();
  const barrier = lv * POINTS_PER_LEVEL;
  STAT_KEYS.forEach(k => { state.stats[k] = barrier; });
  state.unassigned = 0;
  addTitle('Fraud', 'You did not complete your penalty in time.', 24);
  state.pendingPenalty = null;
  toast('FRAUD — all progress within your level annulled. Title: FRAUD (24h)', 'bad');
}

function rollover(){
  const nowStr = localDateStr();
  const prev = state.today;
  const total = state.quests.length;

  let done = 0;
  state.quests.forEach(q => { if (prev.floor[q.id]) done++; });
  const failed = total - done;

  const prevLife = prev.lifestyle || {};
  const lifeDone = Object.keys(prevLife).filter(id => prevLife[id]).length;
  const lifeTotal = state.lifestyle.length;

  if (prev.date){
    state.log[prev.date] = {done, failed};
    const keys = Object.keys(state.log).sort();
    while (keys.length > 400) delete state.log[keys.shift()];
        if (!state.devMode){
      state.quests.forEach(q => {
        if (!prev.floor[q.id]) state.weekFails[q.id] = (state.weekFails[q.id] || 0) + 1;
      });
    }
  }

  if (prev.date && failed > 0) issuePenalty(failed, prev.date, lifeDone, lifeTotal);

      state.today = {
    date: nowStr, floor:{}, ceil:{}, lifestyle:{}, ceilPaid:{}, ceilSteps:{},
    floorPointGiven:false, rewardGiven:false, rewardText:null
  };
}

function checkDungeonTimeout(){
  const a = state.dungeons.active;
  if (!a) return false;
  if (Date.now() > new Date(a.deadline).getTime()){
    const lockMs = (7 + Math.random()*175) * 86400000; // 7 days .. ~6 months
    state.dungeons.locked[a.id] = {
      until: new Date(Date.now() + lockMs).toISOString(),
      everFailed: true
    };
    state.dungeons.active = null;
    toast('SYSTEM ERROR: MENTAL BARRIER — dungeon sealed.', 'bad');
    return true;
  }
  return false;
}

function checkMissionDeadline(){
  const m = state.missions && state.missions.active;
  if (!m) return false;
  if (Date.now() < new Date(m.deadline).getTime()) return false;
  resolveMissionDeadline();
  return true;
}

function resolveMissionDeadline(){
  const m = state.missions.active;
  if (!m) return;
  const done = m.criteria.filter(c => c.done).length;
  const missing = m.criteria.length - done;

  if (missing === 0){
    if (state.devMode){
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: 0});
      toast('DEV MODE — mission complete, no points awarded.');
    } else {
      state.unassigned += m.bounty;
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'completed', delta: m.bounty});
      toast(`MISSION COMPLETE — +${m.bounty} points`, 'gold');
    }
  } else {
    const fine = Math.round(m.bounty * missing / m.criteria.length);
    if (state.devMode){
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'failed', delta: 0, missing});
      toast('DEV MODE — mission failed, no fine applied.');
    } else {
      applyMissionFine(fine);
      state.missions.history.unshift({...m, finishedAt: new Date().toISOString(), outcome: 'failed', delta: -fine, missing});
      toast(`MISSION FAILED — ${missing} criteria missing · −${fine} points`, 'bad');
    }
  }
  state.missions.active = null;
  if (state.missions.history.length > 100) state.missions.history.length = 100;
}

function applyMissionFine(fine){
  let remaining = fine;
  const fromPool = Math.min(state.unassigned, remaining);
  state.unassigned -= fromPool;
  remaining -= fromPool;
  while (remaining > 0){
    const sorted = [...STAT_KEYS].sort((a,b) => state.stats[b] - state.stats[a]);
    let deducted = false;
    for (const k of sorted){
      if (state.stats[k] > 0 && remaining > 0){
        state.stats[k] -= 1;
        remaining -= 1;
        deducted = true;
      }
    }
    if (!deducted) break;
  }
}
  
function checkWeeklyWindow(){
  const now = new Date();
  if (now.getDay() === 0 && now.getHours() >= 19){
    const ws = weekStartStr();
    if (state.lastWeeklyPrompt !== ws){
      state.lastWeeklyPrompt = ws;
      save();
      if (hasFullWeekOfData()){
        openWeeklyReview();
      } else {
        toast('FIRST WEEK — no reset. Full week of data required.', 'gold');
      }
    }
  }
}

function tick(){
  let dirty = false;

  // 1. title expiry
  if (pruneTitles()) dirty = true;

  // 2. fraud check (before rollover, so the pending penalty belongs to the right day)
  if (state.pendingPenalty && !state.pendingPenalty.done){
    if (Date.now() > new Date(state.pendingPenalty.deadline).getTime()){
      applyFraud();
      dirty = true;
    }
  }

    // 3. dungeon timeout
  if (checkDungeonTimeout()) dirty = true;

  // 3b. mission deadline
  if (checkMissionDeadline()) dirty = true;

  // 4. day rollover
  if (state.today.date !== localDateStr()){
    rollover();
    dirty = true;
  }

  // 5. week rollover
  const ws = weekStartStr();
  if (state.weekStart !== ws){
    state.weekStart = ws;
    state.weekFails = {};
    dirty = true;
  }

  if (dirty){ save(); render(); }
  checkWeeklyWindow();
}

/* =========================================================
   WEEKLY REVIEW
   ========================================================= */
function weeklySuggestion(fails){
  if (fails === 0) return {label:'INCREASE DIFFICULTY', delta:1,  cls:'gold'};
  if (fails >= 5)  return {label:'DECREASE DIFFICULTY', delta:-1, cls:'ghost'};
  return {label:'HOLD', delta:0, cls:'ghost'};
}

function openWeeklyReview(){

function applyWeekly(){
  state.quests.forEach(q => {
    const inp = document.querySelector(`[data-wk-floor="${q.id}"]`);
    if (inp && inp.value.trim()) q.floor = inp.value.trim();
        const chk = document.querySelector(`[data-wk-apply="${q.id}"]`);
    if (chk && chk.checked){
      const fails = state.weekFails[q.id] || 0;
      const s = weeklySuggestion(fails);
      if (s.delta !== 0){
        q.phase = (q.phase ?? 1) + s.delta;
      }
    }
  });
  state.weekFails = {};
  state.lastWeeklyPrompt = weekStartStr();
  save(); closeModal(); render();
  toast('WEEKLY RESET COMPLETE');

/* =========================================================
   DUNGEONS
   ========================================================= */
function openDungeon(id){
  const d = state.dungeons.inbox.find(x => x.id === id);
  if (!d) return;
  if (state.dungeons.active) return toast('You are already inside a dungeon.', 'bad');

  const lock = state.dungeons.locked[id];
  if (lock && Date.now() < new Date(lock.until).getTime()){
    return toast(`SYSTEM ERROR: MENTAL BARRIER — sealed until ${fmtDate(lock.until)}`, 'bad');
  }

  let usedKey = null;
  const needsKey = !(lock && lock.everFailed);
  if (needsKey){
    const need = RANK_VAL[d.rank];
    const idx = state.keys.findIndex(k => RANK_VAL[k.rank] >= need);
    if (idx === -1) return toast('No suitable key. Clear all ceiling quests for a chance at one.', 'bad');
    usedKey = state.keys.splice(idx,1)[0];
  }

  const days = DUNGEON_DAYS[d.rank];
    state.dungeons.active = {
    id: d.id,
    name: d.name,
    real: d.real || '',
    rank: d.rank,
    tasks: d.tasks.map(t => ({...t, done:false})),
    startedAt: new Date().toISOString(),
    deadline: new Date(Date.now() + days*86400000).toISOString()
  };
  state.dungeons.inbox = state.dungeons.inbox.filter(x => x.id !== id);
  delete state.dungeons.locked[id];

  save(); render();
  toast(`DUNGEON OPENED — ${d.rank}-RANK${usedKey ? ` (key [${usedKey.rank}] consumed)` : ''}`);
}

function toggleTask(taskId){
  const a = state.dungeons.active;
  if (!a) return;
  const t = a.tasks.find(x => x.id === taskId);
  if (!t) return;

  t.done = !t.done;

  // Bank points the first time an objective is ticked. Unticking does not refund.
    if (t.done && !t.paid){
    t.paid = true;
    if (state.devMode){
      toast('DEV MODE — objective logged, no points awarded.');
    } else {
      state.unassigned += DUNGEON_OBJECTIVE_POINTS;
      toast(`+${DUNGEON_OBJECTIVE_POINTS} STAT POINTS — OBJECTIVE COMPLETE`, 'gold');
    }
  }

  if (a.tasks.every(x => x.done)){
        const earned = state.devMode ? 0 : a.tasks.filter(x => x.paid).length * DUNGEON_OBJECTIVE_POINTS;
    state.dungeons.cleared.push({
      id: a.id, name: a.name, real: a.real || '', rank: a.rank,
      clearedAt: new Date().toISOString()
    });
    state.dungeons.active = null;
    save(); render();
    openModal(`
      <h2>Dungeon Cleared</h2>
      <div style="text-align:center;padding:10px 0 20px">
        <div style="font-size:16px;font-weight:700;margin-bottom:12px">
          <span class="tag rank-${a.rank}" style="font-size:13px">${a.rank}</span>
          ${esc(a.name)}
        </div>
        ${a.real ? `<div class="dungeon-real" style="margin-bottom:18px">${esc(a.real)}</div>` : ''}
        <div style="font-size:11px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px">Total Earned</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--gold);text-shadow:0 0 20px rgba(255,207,92,.7)">+${earned} STAT POINTS</div>
        <div style="font-size:12px;color:var(--dim);margin-top:10px">Assign them in the Status tab.</div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" data-act="close-modal">Acknowledge</button>
      </div>
    `);
    return;
  }
  save(); render();
}
function abandonDungeon(){
  const a = state.dungeons.active;
  if (!a) return;
  if (!confirm('Abandon this dungeon? It will be sealed for a random period (1 week – 6 months).')) return;
  const lockMs = (7 + Math.random()*175) * 86400000;
  state.dungeons.locked[a.id] = {until: new Date(Date.now()+lockMs).toISOString(), everFailed:true};
  state.dungeons.active = null;
  save(); render();
  toast('SYSTEM ERROR: MENTAL BARRIER — dungeon sealed.', 'bad');
}

    const val = state.stats[k];

    if (rec){

      else if (rec.failed <= 2) cls = 'y';
      else cls = 'r';

    if (i === 0) cls += ' today';
    days.push(`<div class="hex ${cls}" title="${key}${rec?` — ${rec.done}/${state.quests.length} floors`:''}"></div>`);
  }

  const nextRankLine = nr

    : `<div style="font-size:12.5px">MAXIMUM RANK REACHED. <span style="color:var(--danger)">S-RANK.</span> The System has nothing left to offer you.</div>`;

        This pool holds points from dungeons, rewards, and rare drops.
      </div>
      ${(state.unassigned > 0 && anyLags) ? `
        <div class="lag-warn">

  const quests = state.quests.map(q => {

        : `<div class="daily-bar">
             <div class="daily-count">All ceilings required — <b>${ceilDone}</b>/${total}</div>
             <button class="btn gold" data-act="claim-reward" ${allCeil?'':'disabled'}>Claim Reward</button>
           </div>`}
    </div>`;

  return `

        </div>
      </div>

        ${quests}

}

function renderCeilingSteps(q, t){
  const steps = q.ceilingSteps || [];
  if (!steps.length) return '';
  const done = t.ceilSteps[q.id] || {};
  const doneCount = steps.filter(s => done[s.id]).length;
    const rows = steps.map(s => {
    const raw = done[s.id];
    const count = typeof raw === 'number' ? raw : (raw ? 1 : 0);
    const on = count > 0;
    const btnLabel = s.repeatable
      ? (on ? `×${count}` : '○')
      : (on ? '✓' : '○');
    return `
      <div class="ceil-step ${on?'on':''}">
        <button class="step-chk ${on?'on':''}" data-act="toggle-ceil-step" data-qid="${q.id}" data-sid="${s.id}">${btnLabel}</button>
        <span class="step-text">${esc(s.text)}</span>
        ${s.repeatable && on ? `<button class="chk-mini" data-act="dec-ceil-step" data-qid="${q.id}" data-sid="${s.id}" title="Decrease count">−</button>` : ''}
      </div>`;
  }).join('');
  return `
    <div class="ceil-steps">
      <div class="ceil-steps-head">Steps &nbsp;<b>${doneCount}</b>/${steps.length} &nbsp;·&nbsp; for clarity only, no points</div>
      ${rows}
    </div>`;
}

function fmtShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function openTreeModal(q){
  const origin = q.origin || state.createdAt;

  // Build the version chain: oldest → newest, ending with the current version.
  const versions = [];
  if (q.history.length === 0){
    versions.push({
      start: origin, end: null,
      name: q.name, floor: q.floor, ceiling: q.ceiling,
      isCurrent: true, isOrigin: true
    });
  } else {
    versions.push({
      start: origin, end: q.history[0].date,
      name: q.history[0].name, floor: q.history[0].floor, ceiling: q.history[0].ceiling,
      action: q.history[0].action, note: q.history[0].note,
      isOrigin: true
    });
    for (let i = 1; i < q.history.length; i++){
      versions.push({
        start: q.history[i-1].date, end: q.history[i].date,
        name: q.history[i].name, floor: q.history[i].floor, ceiling: q.history[i].ceiling,
        action: q.history[i].action, note: q.history[i].note
      });
    }
    versions.push({
      start: q.history[q.history.length-1].date, end: null,
      name: q.name, floor: q.floor, ceiling: q.ceiling,
      isCurrent: true
    });
  }

  const treeHTML = versions.map(v => {
    const dateLabel = v.isCurrent
      ? `CURRENT · since ${fmtShort(v.start)}`
      : `${fmtShort(v.start)} → ${fmtShort(v.end)}`;
    const cls = v.isCurrent ? 'current' : (v.isOrigin ? 'origin' : '');
    let actionLabel = '';
    if (v.action){
      const actionText = {extend:'EXTENDED', replace:'REPLACED', obsolete:'OBSOLETED'}[v.action] || v.action.toUpperCase();
      actionLabel = `<div class="qtree-action ${v.action}">↑ ${actionText}</div>`;
      if (v.note) actionLabel += `<div class="qtree-note">"${esc(v.note)}"</div>`;
    }
    return `
      <div class="qtree-node ${cls}">
        <div class="qtree-date">${dateLabel}</div>
        <div class="qtree-name">${esc(v.name) || '— unnamed —'}</div>
        ${v.floor ? `<div class="qtree-detail"><b>Floor</b> ${esc(v.floor)}</div>` : ''}
        ${v.ceiling ? `<div class="qtree-detail"><b>Ceiling</b> ${esc(v.ceiling)}</div>` : ''}
        ${actionLabel}
      </div>`;
  }).join('');

        const canGrad = canEditNow();

  const gradSection = canGrad ? `
    <div class="panel-title" style="margin-bottom:12px">Graduate Quest</div>
    <p style="font-size:12.5px;color:var(--dim);line-height:1.7;margin-bottom:14px">
      Evolve this habit into a new version. The current version will be archived into the tree above.
    </p>

    <label class="fld"><span>Transition</span></label>
        <div class="grad-modes" style="margin-bottom:14px">
      <label class="grad-mode">
        <input type="radio" name="gradMode" value="extend" checked>
        <div><b>Extend</b><span>Keep the old one as is (only its ceiling) — add the new habit's floor + ceiling on top</span></div>
      </label>
      <label class="grad-mode">
        <input type="radio" name="gradMode" value="replace">
        <div><b>Replace</b><span>Retire the old one entirely — only the new habit is done going forward</span></div>
      </label>
    </div>

    <label class="fld"><span>New quest name</span>
      <input id="gradName" value="${esc(q.name)}">
    </label>
    <label class="fld"><span>New floor</span>
      <input id="gradFloor" value="" placeholder="${esc(q.floor)} + [new addition]">
    </label>
    <label class="fld"><span>New ceiling</span>
      <input id="gradCeil" value="" placeholder="Optional ideal outcome">
    </label>
    <label class="fld"><span>Note (optional)</span>
      <input id="gradNote" placeholder="Why are you evolving this?">
    </label>

    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" data-act="close-modal">Cancel</button>
      <button class="btn gold" data-act="save-graduation" data-id="${q.id}">Confirm Graduation</button>
    </div>
  ` : `
    <div class="panel-title" style="margin-bottom:12px;color:var(--dim)">Graduate Quest — LOCKED</div>
    <p style="font-size:12.5px;color:var(--dim);line-height:1.8;margin-bottom:6px">
      Graduation is only available during the weekly reset window.
    </p>
        <p style="font-size:12.5px;letter-spacing:.08em;line-height:1.8;margin-bottom:16px">
      <span style="color:var(--gold)">Next window: Sunday 19:00 – 24:00</span><br>
      <span style="color:var(--dim)">…or spend an instant edit token.</span>
    </p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" data-act="close-modal">Close</button>
    </div>
  `;

  openModal(`
    <h2>Quest Tree — ${STAT_META[q.stat].label}</h2>
    <div class="qtree">${treeHTML}</div>

    <hr style="border:none;border-top:1px solid rgba(47,143,255,.2);margin:18px 0">

    ${gradSection}
  `);

    // In Extend mode, the new habit builds on top of the old ceiling.
  // In Replace mode, the new habit stands alone — clear the floor.
  document.querySelectorAll('input[name="gradMode"]').forEach(r => {
    r.addEventListener('change', () => {
      const floorInput = document.getElementById('gradFloor');
      if (!floorInput) return;
      if (r.checked && r.value === 'extend'){
        const base = q.ceiling || q.floor || '';
        floorInput.value = base ? base + ' + ' : '';
        floorInput.focus();
      } else if (r.checked){
        floorInput.value = '';
      }
    });
  });
}

function viewMissions(){
  if (!state.missions) state.missions = {active: null, backlog: [], history: []};

function viewActiveMission(m){
  const done = m.criteria.filter(c => c.done).length;
  const total = m.criteria.length;
  const allDone = done === total;

  const now = Date.now();
  const start = new Date(m.startedAt).getTime();
  const end = new Date(m.deadline).getTime();
  const daysElapsed = Math.floor((now - start) / 86400000);
  const totalDays = Math.max(1, Math.ceil((end - start) / 86400000));
  const daysRemaining = Math.max(0, Math.ceil((end - now) / 86400000));
  const overdue = now > end;

  const criteria = m.criteria.map((c, i) => `
    <div class="mission-criterion ${c.done ? 'on' : ''}">
      <button class="crit-chk ${c.done ? 'on' : ''}" data-act="toggle-criterion" data-id="${c.id}">${c.done ? '✓' : (i+1)}</button>
      <span class="crit-text">${esc(c.text)}</span>
    </div>`).join('');

  return `
    <div class="panel mission-panel">
      <div class="panel-title">Active Mission</div>

      <div class="mission-name">${esc(m.name)}</div>
      <div class="mission-meta">
        <span class="tag rank-${m.rank}">${m.rank}</span>
        <span class="mission-bounty">◆ BOUNTY +${m.bounty} PTS</span>
      </div>

      <div class="mission-dates">
        Started ${fmtShort(m.startedAt)} · Deadline ${fmtShort(m.deadline)}
      </div>
      <div class="mission-timeline">
        Day <b>${daysElapsed + 1}</b> of ${totalDays} · <b>${daysRemaining}</b> day${daysRemaining === 1 ? '' : 's'} remaining${overdue ? ' · EXPIRED' : ''}
      </div>

      <div class="mission-section-label">Success Criteria — all three required</div>
      ${criteria}
      <div class="mission-progress">PROGRESS: <b>${done}</b> / ${total}${allDone ? ' — ALL CRITERIA MET' : ''}</div>

      ${m.encounter ? `
        <div class="mission-section-label">Likely to Encounter</div>
        <div class="mission-field-value">${esc(m.encounter)}</div>` : ''}

      ${m.plan ? `
        <div class="mission-section-label">Plan to Deal With It</div>
        <div class="mission-field-value">${esc(m.plan)}</div>` : ''}

      ${allDone ? `<div class="mission-ready">◆ All criteria met — ready to close</div>` : ''}

            <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">
        <button class="btn small ghost" data-act="hold-mission">Return to Backlog</button>
        <button class="btn small danger" data-act="abandon-mission">Abandon Mission</button>
        ${allDone ? `<button class="btn gold" data-act="finish-mission">Finish Mission · +${m.bounty} pts</button>` : ''}
      </div>
    </div>`;
}
